name: Weekly backup

# Every Sunday 11:23 AM Philippine time (03:23 UTC). You can also run it any time
# from the Actions tab: Weekly backup > Run workflow.
on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy players and rankings from Supabase
        run: node .github/scripts/backup.mjs
      - name: Save the backup to the repo
        run: |
          git config user.name "deckflix-backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then echo "No changes since the last backup."; exit 0; fi
          git commit -m "Weekly backup $(date -u +%Y-%m-%d)"
          git push
