<style>:root {
  --bg: #090D18;
  --bg-2: #0C1221;
  --surface: #121A2B;
  --surface-2: #17213A;
  --line: rgba(146, 157, 178, 0.14);
  --line-2: rgba(146, 157, 178, 0.24);
  --primary: #386BFF;
  --secondary: #9747FF;
  --accent: #FF8A32;
  --cyan: #20E5FF;
  --text: #FFFFFF;
  --muted: #929DB2;
  --good: #3DF2A8;
  --bad: #FF5470;
  --glass: rgba(18, 26, 43, 0.62);
  --r-sm: 8px; --r-md: 14px; --r-lg: 22px;
  --f-head: 'Space Grotesk', system-ui, sans-serif;
  --f-body: 'Inter', system-ui, sans-serif;
  --side: 248px;
  --cw: 74px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font: 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-head); margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
h1 { font-size: clamp(30px, 4.2vw, 52px); font-weight: 700; letter-spacing: -0.025em; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- atmosphere ---------- */
.atmos { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.atmos::before { content: ''; position: absolute; width: 900px; height: 900px; left: -300px; top: -420px; background: radial-gradient(closest-side, rgba(56,107,255,.22), transparent); }
.atmos::after { content: ''; position: absolute; width: 800px; height: 800px; right: -320px; top: 10%; background: radial-gradient(closest-side, rgba(151,71,255,.16), transparent); }
.atmos .grid { position: absolute; left: -10%; right: -10%; bottom: -20%; height: 55%; transform: perspective(600px) rotateX(62deg); transform-origin: bottom;
  background-image: linear-gradient(rgba(32,229,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(32,229,255,.07) 1px, transparent 1px);
  background-size: 56px 56px; mask-image: linear-gradient(to top, black, transparent 80%); -webkit-mask-image: linear-gradient(to top, black, transparent 80%); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px;
  background: linear-gradient(180deg, rgba(12,18,33,.92), rgba(9,13,24,.92)); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; }
.brand .word { font-family: var(--f-head); font-weight: 700; font-size: 21px; letter-spacing: -.01em; }
.brand .word-b { color: var(--cyan, #20E5FF); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 500; position: relative; transition: background .2s, color .2s; }
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { color: var(--text); background: rgba(255,255,255,.04); }
.nav a.on { color: var(--text); background: linear-gradient(90deg, rgba(56,107,255,.2), rgba(56,107,255,0)); }
.nav a.on::before { content: ''; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.legend { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(18,26,43,.5); display: grid; gap: 7px; font-size: 12px; color: var(--muted); }
.legend b { color: var(--text); font-weight: 600; font-size: 12px; }
.me-chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; text-decoration: none; border: 1px solid var(--line); background: rgba(18,26,43,.5); }
.me-chip .nm { font-weight: 600; font-size: 14px; line-height: 1.2; }

main { min-width: 0; padding: 26px clamp(16px, 3vw, 40px) 80px; }
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.topbar .title { flex: 1; min-width: 0; }
.mob-brand { display: none; }
.bottomnav { display: none; }

/* ---------- primitives ---------- */
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.panel { padding: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 600; font-family: var(--f-head); font-size: 15px; letter-spacing: .01em; text-decoration: none; white-space: nowrap; transition: transform .15s var(--ease), box-shadow .2s, background .2s, opacity .2s; }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn-primary { background: linear-gradient(180deg, #4C7BFF, var(--primary)); color: #fff; box-shadow: 0 6px 22px -8px rgba(56,107,255,.9), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-primary:hover:not(:disabled) { box-shadow: 0 8px 30px -6px rgba(56,107,255,1), 0 0 0 1px rgba(32,229,255,.5), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-accent { background: linear-gradient(180deg, #FF9C4F, var(--accent)); color: #1A0D02; box-shadow: 0 6px 22px -8px rgba(255,138,50,.9), inset 0 1px 0 rgba(255,255,255,.3); }
.btn-ghost { background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--line-2); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,.09); border-color: rgba(32,229,255,.4); }
.btn-quiet { background: transparent; color: var(--muted); padding: 8px 10px; }
.btn-quiet:hover { color: var(--text); }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn-lg { padding: 14px 24px; font-size: 16px; border-radius: 14px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); }
.icon-btn:hover { color: var(--text); border-color: var(--line-2); }
.icon-btn svg { width: 20px; height: 20px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--cyan); background: rgba(32,229,255,.1); border-color: rgba(32,229,255,.25); }
.pill.net { color: #3DE99A; background: rgba(61,233,154,.1); border-color: rgba(61,233,154,.28); }
.pill.net::before { box-shadow: 0 0 0 3px rgba(61,233,154,.18); }
.pill.sim { color: var(--accent); background: rgba(255,138,50,.1); border-color: rgba(255,138,50,.25); }
.pill.soon { color: var(--muted); background: rgba(146,157,178,.08); border-color: var(--line); }
.pill.sample { color: #C49BFF; background: rgba(151,71,255,.1); border-color: rgba(151,71,255,.3); }
.pill.plain::before { display: none; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); color: var(--muted); font-weight: 500; font-size: 14px; transition: all .2s; }
.chip:hover { color: var(--text); }
.chip.on { color: var(--text); background: rgba(56,107,255,.18); border-color: rgba(56,107,255,.7); box-shadow: 0 0 0 3px rgba(56,107,255,.12); }

.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.section-head .aside { display: flex; align-items: center; gap: 10px; }
.link { color: var(--cyan); text-decoration: none; font-weight: 500; font-size: 14px; background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; }

.avatar { --a1: var(--primary); --a2: var(--secondary); width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 15px; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); overflow: hidden; }
.avatar::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 2px, transparent 2px 7px); }
.avatar span { position: relative; z-index: 1; }
.avatar.lg { width: 88px; height: 88px; border-radius: 24px; font-size: 32px; }
.avatar.sm { width: 30px; height: 30px; border-radius: 9px; font-size: 12px; }

.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r-md); }
.empty .btn { margin-top: 14px; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; border-radius: 28px; min-height: 380px; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center;
  background: radial-gradient(120% 120% at 85% 40%, rgba(56,107,255,.28), transparent 55%), radial-gradient(80% 90% at 100% 100%, rgba(151,71,255,.25), transparent 60%), linear-gradient(160deg, #111a30, #0b1122);
  border: 1px solid rgba(56,107,255,.25); box-shadow: 0 30px 80px -40px rgba(56,107,255,.6), inset 0 1px 0 rgba(255,255,255,.06); }
.hero-copy { padding: clamp(24px, 4vw, 48px); position: relative; z-index: 2; }
.hero-copy .kicker { color: var(--cyan); font-weight: 600; font-family: var(--f-head); margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
.hero-copy h1 { max-width: 13ch; }
.hero-copy p.lede { color: #C3CBDA; max-width: 46ch; margin: 16px 0 26px; font-size: 16px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-facts { display: flex; gap: 22px; margin-top: 30px; flex-wrap: wrap; }
.hero-facts div { font-size: 13px; color: var(--muted); }
.hero-facts b { display: block; font-family: var(--f-head); font-size: 20px; color: var(--text); }
.hero-stage { position: relative; height: 100%; min-height: 360px; }
.hero-stage .felt { position: absolute; right: -12%; top: 50%; width: 118%; aspect-ratio: 1.55; transform: translateY(-50%) perspective(900px) rotateX(48deg); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(32,229,255,.12), rgba(56,107,255,.06) 60%, transparent 72%); border: 1px solid rgba(32,229,255,.25); box-shadow: 0 0 60px rgba(32,229,255,.15), inset 0 0 80px rgba(56,107,255,.2); }
.fan { position: absolute; left: 50%; top: 52%; width: 0; height: 0; }
.fan .card { position: absolute; left: calc(var(--cw) * -.5); top: calc(var(--cw) * -.7); transform-origin: 50% 160%; transition: transform .5s var(--ease); }
/* featured-game shuffle: keyframes are generated in App.shuffleCSS */
.hero-stage:has(.shuf) { --cw: clamp(84px, 8.6vw, 128px); }
/* cards + tag are centred as one group: the fan spans about -0.75cw to +0.8cw around the pivot, the tag sits just under it */
.shuf { position: absolute; left: 50%; top: calc(50% - var(--cw) * .2 + var(--nudge, 0px)); width: 0; height: 0; }
.hero-stage:has(.shuf) .meld-tag { top: calc(50% - var(--cw) * .2 + var(--nudge, 0px) + var(--cw) * .98); bottom: auto; }
.shuf .sb, .shuf .sd { position: absolute; left: calc(var(--cw) * -.5); top: calc(var(--cw) * -.7); animation-duration: var(--T); animation-delay: var(--sync); animation-iteration-count: infinite; animation-fill-mode: both; will-change: transform; }
.shuf .sb { transform-origin: 50% 50%; }
.shuf .sd { width: var(--cw); height: calc(var(--cw) * 1.4); transform-origin: 50% 160%; z-index: 40; perspective: 700px; }
.shuf .flip { position: absolute; inset: 0; transform-style: preserve-3d; animation-duration: var(--T); animation-delay: var(--sync); animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: cubic-bezier(.3,.7,.2,1); }
.shuf .flip .card { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.shuf .flip .rev { transform: rotateY(180deg); }
.hero-stage:has(.shuf) .meld-tag { animation: shuf-tag var(--T, 9s) infinite both; animation-delay: var(--sync, 0s); }
.hero-stage .meld-tag { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); font-size: 12px; color: var(--cyan); background: rgba(9,13,24,.7); border: 1px solid rgba(32,229,255,.3); padding: 5px 12px; border-radius: 99px; white-space: nowrap; }

/* ---------- lobby grid ---------- */
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
.stat { padding: 16px 18px; border-radius: var(--r-md); background: rgba(18,26,43,.55); border: 1px solid var(--line); }
.stat .v { font-family: var(--f-head); font-size: 26px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 13px; }
.stat .v.dim { color: var(--muted); font-size: 18px; padding: 5px 0; }

.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; }
.rail > * { scroll-snap-align: start; }

/* game card */
.gcard { position: relative; border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column;
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); transition: transform .25s var(--ease), border-color .25s, box-shadow .25s; }
.gcard:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--g) 60%, transparent); box-shadow: 0 18px 40px -20px var(--g); }
.gcard .art { aspect-ratio: 16/10; position: relative; overflow: hidden; }
.gcard .art svg { width: 100%; height: 100%; display: block; transition: transform .6s var(--ease); }
.gcard:hover .art svg { transform: scale(1.04); }
.gcard .art .pill { position: absolute; left: 12px; top: 12px; backdrop-filter: blur(8px); }
.gcard .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.gcard .meta { display: flex; gap: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.gcard .meta span { display: inline-flex; align-items: center; gap: 5px; }
.gcard .meta svg { width: 14px; height: 14px; }
.gcard .desc { color: #B5BECE; font-size: 14px; flex: 1; }
.gcard .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

.mini-list { display: grid; gap: 10px; }
.mini-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.02); border: 1px solid var(--line); }
.mini-row .grow { flex: 1; min-width: 0; }
.mini-row .t { font-weight: 600; font-size: 14px; }
.thumb { width: 48px; height: 36px; border-radius: 8px; overflow: hidden; flex: none; }
.thumb svg { width: 100%; height: 100%; display: block; }

.mission { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mission:last-child { border-bottom: 0; }
.mission .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 500; }
.bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--primary), var(--cyan)); box-shadow: 0 0 10px rgba(32,229,255,.6); }
.mission.done .bar i { background: linear-gradient(90deg, var(--accent), #FFC06B); box-shadow: 0 0 10px rgba(255,138,50,.6); }

.lb-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 8px 0; }
.lb-row .rk { font-family: var(--f-head); font-weight: 700; color: var(--muted); text-align: center; }
.lb-row.top1 .rk { color: #FFC06B; } .lb-row.top2 .rk { color: #D6E0F0; } .lb-row.top3 .rk { color: #E7A272; }
.lb-row .who { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 500; }
.lb-row .who span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-row.you { background: rgba(56,107,255,.12); border-radius: 10px; padding: 8px 6px; margin: 4px -6px; }

.room-card { padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.02); display: grid; gap: 10px; }
.slots { display: flex; gap: 6px; }
.slots i { width: 26px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); }
.slots i.f { background: var(--cyan); box-shadow: 0 0 8px rgba(32,229,255,.6); }

/* ---------- library / tables ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.table td { padding: 12px; border-bottom: 1px solid var(--line); }
.table tr:last-child td { border-bottom: 0; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.res-w { color: var(--good); font-weight: 600; } .res-l { color: var(--bad); font-weight: 600; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 14px; align-items: end; margin-bottom: 20px; }
.podium .p { text-align: center; padding: 20px 12px; border-radius: 20px; background: rgba(18,26,43,.6); border: 1px solid var(--line); display: grid; justify-items: center; gap: 8px; }
.podium .p.first { padding-top: 30px; border-color: rgba(255,192,107,.4); box-shadow: 0 20px 50px -30px rgba(255,138,50,.8); }
.podium .p .place { font-family: var(--f-head); font-size: 13px; color: var(--muted); }
.podium .p .pts { font-family: var(--f-head); font-size: 22px; font-weight: 700; }

/* ---------- rooms ---------- */
.rooms-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.field { display: grid; gap: 6px; }
.field label, .field .lab { font-size: 13px; color: var(--muted); font-weight: 500; }
.input { width: 100%; padding: 11px 14px; border-radius: 12px; background: rgba(9,13,24,.7); border: 1px solid var(--line-2); color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56,107,255,.2); }
.input:disabled { opacity: .5; }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: rgba(9,13,24,.7); border: 1px solid var(--line); gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; }
.seg button.on { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px rgba(56,107,255,.6); }
.game-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.game-pick button { text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.02); display: grid; gap: 8px; transition: all .2s; }
.game-pick button .thumb { width: 100%; height: auto; aspect-ratio: 16/9; }
.game-pick button.on { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(32,229,255,.15); background: rgba(32,229,255,.05); }
.game-pick button b { font-family: var(--f-head); font-size: 14px; }
.seat-list { display: grid; gap: 8px; }
.seat { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.02); border: 1px solid var(--line); }
.seat .grow { flex: 1; min-width: 0; }
.ready { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.ready.y { color: var(--good); background: rgba(61,242,168,.1); }
.ready.n { color: var(--muted); background: rgba(146,157,178,.1); }
.code { font-family: var(--f-head); font-size: 28px; letter-spacing: .3em; font-weight: 700; }
.note { font-size: 13px; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: rgba(146,157,178,.07); border: 1px solid var(--line); }
.note.warn { color: #FFC59A; background: rgba(255,138,50,.08); border-color: rgba(255,138,50,.25); }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

/* ---------- profile ---------- */
.profile-head { display: flex; gap: 22px; align-items: center; padding: 24px; }
.profile-head .grow { flex: 1; min-width: 0; }
.profile-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; margin-top: 24px; align-items: start; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.02); display: grid; gap: 8px; justify-items: start; }
.badge .ico { width: 42px; height: 42px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: rgba(146,157,178,.15); color: var(--muted); }
.badge .ico svg { width: 20px; height: 20px; }
.badge.got { border-color: rgba(255,138,50,.35); background: linear-gradient(180deg, rgba(255,138,50,.08), transparent); }
.badge.got .ico { background: linear-gradient(135deg, var(--accent), #FFC06B); color: #1A0D02; box-shadow: 0 0 18px rgba(255,138,50,.5); }
.badge b { font-family: var(--f-head); font-size: 14px; }
.avatar-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.avatar-pick button { padding: 0; border: 2px solid transparent; border-radius: 14px; background: none; }
.avatar-pick button.on { border-color: var(--cyan); }
.toggle { width: 44px; height: 26px; border-radius: 99px; background: rgba(146,157,178,.25); border: 0; position: relative; transition: background .2s; flex: none; }
.toggle::after { content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: transform .2s var(--ease); }
.toggle.on { background: var(--primary); }
.toggle.on::after { transform: translateX(18px); }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5,8,16,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 50; padding: 16px; animation: fade .2s; }
.modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 26px; border-radius: 24px; background: linear-gradient(180deg, #141D33, #0F1628); border: 1px solid rgba(56,107,255,.3); box-shadow: 0 40px 100px -30px rgba(56,107,255,.5); animation: pop .3s var(--ease); }
.modal.wide { width: min(720px, 100%); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0; }
.tabs button { background: none; border: 0; padding: 10px 14px; color: var(--muted); font-weight: 600; font-family: var(--f-head); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-color: var(--cyan); }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 80; padding: 12px 18px; border-radius: 14px; background: #1A2440; border: 1px solid var(--line-2); box-shadow: 0 20px 50px -20px #000; font-weight: 500; font-size: 14px; animation: pop .25s var(--ease); max-width: calc(100vw - 32px); }
.toast.bad { border-color: rgba(255,84,112,.5); }

/* ---------- playing cards ---------- */
.card { --ch: calc(var(--cw) * 1.4); width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .1); position: relative; flex: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(160deg, #FFFFFF, #EEF2FA); color: #1B2235; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 16px -6px rgba(0,0,0,.6), 0 0 0 1px rgba(10,16,30,.25); font-family: var(--f-head); }
.card.red { color: #E0264B; }
/* Corner index sits in its own column (left 4–26% of the width); pips start at ~30% and sit below the rank, so they never touch. */
.card .cn { position: absolute; width: calc(var(--cw) * .22); display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 700; font-size: calc(var(--cw) * .2); letter-spacing: -.02em; }
.card .cn.ten { font-size: calc(var(--cw) * .17); letter-spacing: -.09em; }
.card .cn small { font-size: calc(var(--cw) * .13); margin-top: calc(var(--cw) * .015); }
.card .cn.tl { left: calc(var(--cw) * .04); top: calc(var(--cw) * .06); }
.card .cn.br { right: calc(var(--cw) * .04); bottom: calc(var(--cw) * .06); transform: rotate(180deg); }
.card .pips { position: absolute; left: calc(var(--cw) * .38); right: calc(var(--cw) * .38); top: calc(var(--cw) * .3); bottom: calc(var(--cw) * .3); }
.card .pip { position: absolute; transform: translate(-50%, -50%); font-size: calc(var(--cw) * .155); line-height: 1; }
.card .pip.flip { transform: translate(-50%, -50%) rotate(180deg); }
.card .ace { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .46); line-height: 1; }
.card .face { position: absolute; left: calc(var(--cw) * .28); right: calc(var(--cw) * .28); top: calc(var(--cw) * .18); bottom: calc(var(--cw) * .18); border-radius: calc(var(--cw) * .05); display: grid; place-items: center; overflow: hidden;
  background: repeating-linear-gradient(45deg, currentColor 0 1px, transparent 1px 6px); }
.card .face::before { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.9), rgba(238,242,250,.75)); }
.card .face::after { content: ''; position: absolute; inset: 2px; border: 1px solid currentColor; border-radius: 3px; opacity: .5; }
.card .face b { position: relative; z-index: 1; font-size: calc(var(--cw) * .34); font-weight: 700; letter-spacing: -.04em; line-height: 1; }
.card .face em { position: absolute; z-index: 1; font-style: normal; font-size: calc(var(--cw) * .14); bottom: 7%; line-height: 1; }
.card .face i { position: absolute; z-index: 1; font-style: normal; font-size: calc(var(--cw) * .14); top: 7%; line-height: 1; }
.card.sm .pips, .card.sm .face, .card.sm .ace { display: none; }
.card.sm .cn.br { display: none; }
.card.sm .big { position: absolute; right: 10%; bottom: 8%; font-size: calc(var(--cw) * .42); line-height: 1; }
.card .big { display: none; }
.card.sm .big { display: block; }
.card.back { background: radial-gradient(circle at 50% 50%, rgba(32,229,255,.18), transparent 50%), repeating-linear-gradient(45deg, rgba(56,107,255,.35) 0 1px, transparent 1px 9px), repeating-linear-gradient(-45deg, rgba(151,71,255,.35) 0 1px, transparent 1px 9px), linear-gradient(160deg, #1A2550, #0E1530); box-shadow: inset 0 0 0 1px rgba(32,229,255,.35), inset 0 0 0 calc(var(--cw) * .06) #0E1530, inset 0 0 0 calc(var(--cw) * .07) rgba(56,107,255,.5), 0 6px 16px -6px rgba(0,0,0,.7); }
.card.back .em { position: absolute; inset: 0; display: grid; place-items: center; }
.card.back .em svg { width: 46%; opacity: .95; }
.card.ghost { background: transparent; border: 1.5px dashed rgba(32,229,255,.35); box-shadow: none; }

/* ---------- game table ---------- */
.game-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; height: calc(100vh - 140px); min-height: 560px; }
.game-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.game-bar h2 { font-size: 20px; }
.game-bar .grow { flex: 1; }
.table-area { position: relative; display: flex; flex-direction: column; min-height: 0; }
.felt { position: relative; flex: 1; min-height: 340px; border-radius: 40% / 30%; overflow: visible;
  background: radial-gradient(ellipse at 50% 45%, rgba(56,107,255,.22), transparent 60%), radial-gradient(ellipse at 50% 120%, rgba(151,71,255,.25), transparent 60%), linear-gradient(180deg, #101A33, #0B1226);
  box-shadow: inset 0 0 0 1px rgba(32,229,255,.25), inset 0 0 0 10px rgba(9,13,24,.6), inset 0 0 0 11px rgba(56,107,255,.25), inset 0 0 90px rgba(0,0,0,.5), 0 30px 80px -40px rgba(56,107,255,.6); }
.felt::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; border: 1px dashed rgba(146,157,178,.12); pointer-events: none; }
.felt .center { position: absolute; inset: 0; padding-top: var(--padtop, 0); display: grid; place-items: center; z-index: 2; pointer-events: none; }
.felt .center > * { pointer-events: auto; }

.opp { position: absolute; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translate(-50%, -50%); }
.opp .plate { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 14px; background: rgba(9,13,24,.82); border: 1px solid var(--line-2); white-space: nowrap; position: relative; }
.opp.turn .plate { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(32,229,255,.15), 0 0 26px rgba(32,229,255,.35); }
.opp .plate .nm { font-weight: 600; font-size: 13px; line-height: 1.2; }
.opp .plate .sub { font-size: 11px; color: var(--muted); }
.opp .backs { display: flex; height: calc(var(--cw) * .7 * 1.4); --cw: 34px; }
.opp .backs .card { margin-left: -24px; }
.opp .backs .card:first-child { margin-left: 0; }
.opp .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 600; }
.tag.bot { background: rgba(151,71,255,.18); color: #C49BFF; }
.tag.open { background: rgba(32,229,255,.12); color: var(--cyan); }
.tag.blocked { background: rgba(255,138,50,.12); color: var(--accent); }
.ring { position: relative; }
.ring::before { content: ''; position: absolute; inset: -4px; border-radius: 15px; background: conic-gradient(var(--cyan) calc(var(--p, 0) * 1%), rgba(255,255,255,.08) 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 2px; opacity: 0; transition: opacity .2s; }
.ring.on::before { opacity: 1; }
.ring.low::before { background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), rgba(255,255,255,.08) 0); }
.thinking { display: inline-flex; gap: 3px; }
.thinking i { width: 4px; height: 4px; border-radius: 50%; background: var(--cyan); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.react { position: absolute; top: -34px; left: 50%; font-size: 26px; animation: floatup 1.8s var(--ease) forwards; pointer-events: none; z-index: 9; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -40px) scale(1); } }
.speech { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: #fff; color: #0E1530; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 10px; white-space: nowrap; animation: pop .25s var(--ease); z-index: 9; }

.me-area { padding: 14px 4px 4px; }
.me-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.me-row .grow { flex: 1; }
.status-line { font-size: 14px; color: #C3CBDA; min-height: 22px; }
.status-line b { color: var(--text); }
.hand { display: flex; justify-content: center; padding: 22px 8px 8px; min-height: calc(var(--cw) * 1.4 + 34px); overflow-x: auto; overflow-y: visible; scrollbar-width: thin; }
.hand .card { margin-left: var(--ml, calc(var(--cw) * -.42)); transition: transform .18s var(--ease), box-shadow .18s; cursor: pointer; }
.hand .card:first-child { margin-left: 0; }
.hand .card:hover { transform: translateY(-8px); }
.hand .card.sel { transform: translateY(-20px); box-shadow: 0 0 0 2px var(--cyan), 0 0 24px rgba(32,229,255,.6), 0 10px 20px -6px rgba(0,0,0,.6); }
.hand .card.hint { box-shadow: 0 0 0 2px rgba(255,138,50,.9), 0 6px 16px -6px rgba(0,0,0,.6); }
.hand .card .meldmark { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); width: 60%; height: 3px; border-radius: 3px; }
.hand.disabled .card { cursor: default; }
.deal-in { animation: dealin .5s var(--ease) both; }
@keyframes dealin { from { opacity: 0; transform: translate(var(--dx, 0), -260px) rotate(-12deg) scale(.6); } }
.fly-in { animation: flyin .35s var(--ease) both; }
@keyframes flyin { from { opacity: 0; transform: translateY(-30px) scale(.85); } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.side-panel { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; }
.side-panel .tabs { margin: 0; padding: 0 12px; }
.feed { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.feed .ln { color: #B5BECE; }
.feed .ln b { color: var(--text); font-weight: 600; }
.feed .ln.sys { color: var(--muted); font-size: 12px; }
.feed .ln.hl { color: var(--cyan); }
.feed .chatln { padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.04); }
.feed .chatln.mine { background: rgba(56,107,255,.16); align-self: flex-end; }
.chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.emoji-row { display: flex; gap: 4px; padding: 8px 12px 0; flex-wrap: wrap; }
.emoji-row button { border: 0; background: rgba(255,255,255,.05); border-radius: 9px; width: 36px; height: 34px; font-size: 18px; transition: transform .15s; }
.emoji-row button:hover { transform: scale(1.12); background: rgba(255,255,255,.1); }

/* In Between */
.ib-center { display: grid; justify-items: center; gap: 14px; }
.pot { font-family: var(--f-head); text-align: center; }
.pot .v { font-size: 34px; font-weight: 700; color: #FFC06B; text-shadow: 0 0 20px rgba(255,138,50,.5); line-height: 1; }
.pot .l { font-size: 12px; color: var(--muted); }
.posts { display: flex; gap: 14px; align-items: center; --cw: 82px; }
.posts .slot { position: relative; }
.posts .gapnote { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
.outcome { font-family: var(--f-head); font-weight: 700; font-size: 18px; padding: 6px 14px; border-radius: 99px; animation: pop .3s var(--ease); }
.outcome.win { color: var(--good); background: rgba(61,242,168,.12); }
.outcome.lose { color: var(--bad); background: rgba(255,84,112,.12); }
.outcome.post { color: var(--accent); background: rgba(255,138,50,.14); }
.bet-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.bet-field { display: flex; flex-direction: column; gap: 3px; }
.bet-field .input { width: 112px; height: 46px; font-family: var(--f-head); font-weight: 700; font-size: 22px; text-align: center; padding: 0 8px; -moz-appearance: textfield; }
.bet-field .input::-webkit-outer-spin-button, .bet-field .input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.bet-field .input.invalid { border-color: #FF5A6E; box-shadow: 0 0 0 3px rgba(255,90,110,.18); }
.bet-box { align-items: flex-end; }
.bet-box .btn { height: 46px; }
.btn.allin { letter-spacing: .04em; font-weight: 800; }
.btn.allin .amt { font-family: var(--f-head); opacity: .85; margin-left: 4px; letter-spacing: 0; }
.bet-risk { text-align: center; margin-top: 8px; color: var(--muted); }
.bet-risk .good { color: #3DE99A; } .bet-risk .bad { color: #FF6B7D; }
.chipstack { font-family: var(--f-head); font-weight: 700; color: #FFC06B; font-size: 13px; }

/* Tongits */
.tg-center { display: grid; gap: 12px; justify-items: center; width: min(92%, 640px); }
.piles { display: flex; gap: 22px; align-items: flex-end; --cw: 64px; }
.pile { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.pile .stackwrap { position: relative; }
.pile .stackwrap .card + .card { position: absolute; left: 2px; top: -2px; }
.pile.clickable .card { cursor: pointer; }
.pile.clickable .card:hover { box-shadow: 0 0 0 2px var(--cyan), 0 0 20px rgba(32,229,255,.5); }
.melds { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 190px; overflow-y: auto; padding: 4px; }
.meld { display: flex; padding: 6px 8px 6px 6px; border-radius: 12px; background: rgba(9,13,24,.6); border: 1px solid var(--line); --cw: 46px; position: relative; transition: border-color .2s, box-shadow .2s; }
.meld .card { margin-left: -20px; }
.meld .card:first-child { margin-left: 0; }
.meld .own { position: absolute; top: -9px; left: 8px; font-size: 10px; padding: 1px 6px; border-radius: 5px; background: #0E1530; border: 1px solid var(--line-2); color: var(--muted); }
.meld.can { border-color: var(--cyan); box-shadow: 0 0 16px rgba(32,229,255,.35); cursor: pointer; }
.callbox { padding: 16px; border-radius: 16px; background: rgba(9,13,24,.92); border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(255,138,50,.25); text-align: center; display: grid; gap: 10px; }

/* Pusoy */
.trick { display: grid; justify-items: center; gap: 8px; min-height: 150px; }
.trick .cards { display: flex; --cw: 68px; }
.trick .cards .card { margin-left: -20px; }
.trick .cards .card:first-child { margin-left: 0; }
.trick .lab { font-size: 13px; color: var(--muted); }
.trick .lab b { color: var(--text); }

.results .standing { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.results .standing:last-child { border-bottom: 0; }
.results .reveal { display: flex; --cw: 34px; margin-top: 6px; flex-wrap: wrap; gap: 2px; }
.trophy { width: 64px; height: 64px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 20px; background: linear-gradient(135deg, var(--accent), #FFC06B); color: #1A0D02; box-shadow: 0 0 40px rgba(255,138,50,.5); }
.trophy.lost { background: linear-gradient(135deg, #2A3656, #1A2440); color: var(--muted); box-shadow: none; }
.trophy svg { width: 32px; height: 32px; }
.rules { display: grid; gap: 10px; font-size: 14px; color: #C3CBDA; }
.rules h3 { color: var(--text); margin-top: 8px; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

.mobile-only { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .lobby-grid, .profile-grid { grid-template-columns: 1fr; }
  .game-wrap { grid-template-columns: 1fr; height: auto; }
  .game-wrap .side-panel { height: 320px; }
}
@media (max-width: 900px) {
  :root { --cw: 58px; }
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  main { padding: 16px 14px 96px; }
  .mob-brand { display: flex; }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(9,13,24,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .bottomnav a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); text-decoration: none; border-radius: 10px; }
  .bottomnav a svg { width: 22px; height: 22px; }
  .bottomnav a.on { color: var(--text); }
  .bottomnav a.on svg { color: var(--cyan); filter: drop-shadow(0 0 6px rgba(32,229,255,.7)); }
  .hero { grid-template-columns: 1fr; }
  .hero-stage { min-height: 230px; order: -1; }
  .hero-copy { padding-top: 0; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .rooms-grid { grid-template-columns: 1fr; }
  .lib-grid { grid-template-columns: 1fr; }
  .lib-grid.swipe { display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 84%; overflow-x: auto; scroll-snap-type: x mandatory; }
  .lib-grid.swipe > * { scroll-snap-align: start; }
  .podium { gap: 8px; }
  .profile-head { flex-wrap: wrap; }
  .game-pick { grid-template-columns: repeat(2, 1fr); }
  .mobile-only { display: initial; }
  .desk-only { display: none !important; }
  .in-game .bottomnav { display: none; }
  .game-bar { flex-wrap: nowrap; gap: 8px; }
  .game-bar h2 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .game-bar .icon-btn { width: 36px; height: 36px; flex: none; }
  .in-game main { padding-bottom: 16px; }
  .felt { min-height: 440px; border-radius: 28px; }
  .opp .plate .sub { white-space: nowrap; }
  .opp .tag { font-size: 10px; padding: 1px 5px; }
  .posts { --cw: 64px; }
  .piles { --cw: 50px; gap: 14px; }
  .trick .cards { --cw: 52px; }
  .meld { --cw: 36px; }
  .meld .card { margin-left: -17px; }
  .opp .backs { --cw: 26px; }
  .opp .backs .card { margin-left: -19px; }
  .opp .plate { padding: 4px 8px 4px 4px; }
  .opp .plate .avatar { width: 28px; height: 28px; font-size: 11px; border-radius: 8px; }
  .game-wrap .side-panel { display: none; }
  .game-wrap .side-panel.open { display: flex; position: fixed; inset: auto 0 0 0; height: 60vh; z-index: 45; border-radius: 22px 22px 0 0; }
}
@media (max-width: 420px) {
  :root { --cw: 50px; }
  .stat .v { font-size: 22px; }
  .podium .p .pts { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/* Reduced motion: no shuffle, just the dealt hand resting in its fan. */
@media (prefers-reduced-motion: reduce) {
  .shuf .sb { display: none; }
  .shuf .sd { animation: none !important; transform: var(--fan); opacity: 1; }
  .shuf .flip { animation: none !important; transform: none; }
  .hero-stage:has(.shuf) .meld-tag { animation: none !important; opacity: 1; }
}

/* ---------- sessions ---------- */
.sess { padding: 16px; border-radius: 16px; border: 1px solid rgba(32,229,255,.2); background: rgba(32,229,255,.03); }
details summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: '+'; font-family: var(--f-head); color: var(--cyan); width: 12px; }
details[open] summary::before { content: '–'; }
.champ { text-align: center; padding: 34px 20px 28px; display: grid; justify-items: center; gap: 6px; position: relative; overflow: hidden;
  background: radial-gradient(60% 80% at 50% 0%, rgba(255,138,50,.22), transparent 70%), var(--glass); border-color: rgba(255,192,107,.35); }
.champ h1 { font-size: clamp(28px, 4vw, 44px); }
.champ-badge { width: 54px; height: 54px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(135deg, var(--accent), #FFC06B); color: #1A0D02; margin-bottom: 6px; }
.champ-badge svg { width: 26px; height: 26px; }
.fulllog { margin: 14px 0 0; padding-left: 26px; display: grid; gap: 4px; font-size: 13px; color: #B5BECE; max-height: 420px; overflow-y: auto; }
.fulllog li.rd { color: var(--cyan); font-weight: 600; }
.round-banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; display: grid; gap: 4px; justify-items: center; text-align: center; padding: 18px 26px; border-radius: 18px; background: rgba(9,13,24,.94); border: 1px solid rgba(255,138,50,.6); box-shadow: 0 0 40px rgba(255,138,50,.3); animation: pop .3s var(--ease); max-width: 90%; }
.round-banner b { font-family: var(--f-head); font-size: 20px; }
.table.sb { font-size: 13px; }
.table.sb td, .table.sb th { padding: 7px 6px; }

/* Grid and flex children may shrink below their content width (prevents pages overflowing on phones) */
.lobby-grid > *, .profile-grid > *, .rooms-grid > *, .game-wrap > *, .shell > *, .table-area, .me-area, .stack > *, .hero > * { min-width: 0; }
.podium .p { min-width: 0; }
.podium .p b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-row > * { min-width: 0; }
@media (max-width: 1180px) {
  .lobby-grid, .profile-grid { grid-template-columns: minmax(0, 1fr); }
  .game-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .shell, .rooms-grid { grid-template-columns: minmax(0, 1fr); }
  .rail { grid-auto-columns: 78%; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip { flex: none; }
}
@media (max-width: 900px) { .hero-stage .meld-tag { bottom: 2%; } .fan { top: 46%; } .hero-stage:has(.shuf) { --cw: clamp(80px, 22vw, 118px); min-height: calc(var(--cw) * 2.45 + 44px); --nudge: 8px; } .hero-stage:has(.shuf) .meld-tag { bottom: auto; } }

/* chow + bot action callouts */
.pile { position: relative; }
.pile.chowable .card { box-shadow: 0 0 0 2px var(--accent), 0 0 26px rgba(255,138,50,.65); animation: chowpulse 1.4s ease-in-out infinite; }
@keyframes chowpulse { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 10px rgba(255,138,50,.3); } }
.chow-badge { position: absolute; top: -10px; right: -12px; z-index: 2; background: linear-gradient(180deg, #FF9C4F, var(--accent)); color: #1A0D02; font-family: var(--f-head); font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 99px; }
.callout { margin-top: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: rgba(9,13,24,.9); border: 1px solid var(--line-2); color: #D6DEEC; white-space: nowrap; animation: pop .25s var(--ease); }
.callout.chow { color: #1A0D02; background: linear-gradient(180deg, #FF9C4F, var(--accent)); border-color: transparent; }
.hand .card.hint { box-shadow: 0 0 0 2px rgba(255,138,50,.9), 0 0 16px rgba(255,138,50,.45), 0 6px 16px -6px rgba(0,0,0,.6); }

.ib-center > div { text-align: center; }

/* ---------- solitaire ---------- */
.sol-wrap { max-width: 980px; margin: 0 auto; }
.sol-head { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.sol-stats { display: flex; gap: 18px; font-size: 14px; }
.sol-stats b { font-family: var(--f-head); font-size: 18px; font-variant-numeric: tabular-nums; }
.sol-head .actions { justify-content: flex-end; align-items: center; }
.sol-head .seg button { padding: 5px 10px; font-size: 13px; }
.sol-board { user-select: none; -webkit-user-select: none; padding: calc(var(--g) * 1.4); border-radius: 22px;
  background: radial-gradient(ellipse at 50% 0%, rgba(56,107,255,.18), transparent 60%), linear-gradient(180deg, #101A33, #0B1226); box-shadow: inset 0 0 0 1px rgba(32,229,255,.2), 0 30px 70px -40px rgba(56,107,255,.6); }
.sol-top, .sol-tab { display: grid; grid-template-columns: repeat(7, var(--cw)); gap: var(--g); justify-content: center; }
.sol-top { margin-bottom: calc(var(--g) * 1.8); }
.sol-board .slot { position: relative; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); border: 1.5px dashed rgba(146,157,178,.28); display: grid; place-items: center; }
.sol-board .slot > .card, .sol-board .wcard { position: absolute; left: -1.5px; top: -1.5px; }
.sol-board .slot.waste { border-color: transparent; }
.sol-board .slot.waste.wide { grid-column: span 2; width: auto; justify-self: stretch; }
.sol-board .slot.stock { cursor: pointer; border-color: rgba(32,229,255,.35); }
.sol-board .slot.stock .count { position: absolute; right: 4px; bottom: 4px; font-size: 11px; font-weight: 700; color: var(--cyan); background: rgba(9,13,24,.85); padding: 1px 6px; border-radius: 6px; }
.sol-board .slot .recycle svg { width: 26px; height: 26px; color: var(--cyan); }
.sol-board .ph { font-family: var(--f-head); font-weight: 700; color: rgba(146,157,178,.35); font-size: calc(var(--cw) * .3); }
.sol-board .col { position: relative; width: var(--cw); min-height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); transition: box-shadow .15s; }
.sol-board .col > .card { position: absolute; left: 0; }
.sol-board .col .slot.empty { position: absolute; inset: 0; }
.sol-board [data-src] { cursor: grab; touch-action: none; }
/* A card partly hidden under another shows only its corner, so the artwork of one card
   never mixes with the rank of the next. Tableau: rank and suit side by side in the visible strip.
   Draw-3 waste: the stacked corner stays, the pips are hidden. */
.sol-board .card.covered .pips, .sol-board .card.covered .face, .sol-board .card.covered .ace, .sol-board .card.covered .big, .sol-board .card.covered .cn.br,
.sol-ghost .card.covered .pips, .sol-ghost .card.covered .face, .sol-ghost .card.covered .ace, .sol-ghost .card.covered .big, .sol-ghost .card.covered .cn.br { visibility: hidden; }
.sol-board .card.covered:not(.side):not(.sm) .cn.tl, .sol-ghost .card.covered:not(.sm) .cn.tl { width: auto; flex-direction: row; align-items: baseline; gap: calc(var(--cw) * .02); left: calc(var(--cw) * .07); top: calc(var(--cw) * .05); font-size: calc(var(--cw) * .2); }
.sol-board .card.covered:not(.side):not(.sm) .cn.tl small, .sol-ghost .card.covered:not(.sm) .cn.tl small { margin: 0; font-size: calc(var(--cw) * .17); }
.sol-board .drop-over, .sol-board .sol-hint-col { box-shadow: 0 0 0 2px var(--cyan), 0 0 22px rgba(32,229,255,.45); }
.sol-board .slot.drop-over { border-color: var(--cyan); }
.card.sol-hint, .slot.sol-hint { box-shadow: 0 0 0 3px var(--accent), 0 0 26px rgba(255,138,50,.65) !important; }
.sol-ghost { position: fixed; left: 0; top: 0; z-index: 95; pointer-events: none; }
.sol-ghost .card { box-shadow: 0 18px 30px -10px rgba(0,0,0,.8), 0 0 0 1px rgba(10,16,30,.25); }
.card.nope { animation: nope .32s; }
@keyframes nope { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
/* compact cards for narrow screens: one-line index and a large suit */
.card.sm.solc .cn { width: auto; flex-direction: row; align-items: baseline; gap: 1px; font-size: calc(var(--cw) * .3); left: calc(var(--cw) * .07); top: calc(var(--cw) * .05); letter-spacing: -.04em; }
.card.sm.solc .cn small { font-size: calc(var(--cw) * .24); margin: 0; }
.card.sm.solc .cn.ten { font-size: calc(var(--cw) * .26); }
.card.sm.solc .big { right: auto; left: 50%; transform: translateX(-50%); bottom: 9%; font-size: calc(var(--cw) * .58); }
@media (max-width: 900px) { .sol-head { gap: 10px; } .sol-head .actions { justify-content: flex-start; } .sol-board { border-radius: 16px; } }

/* ---------- bingo ---------- */
.pgrid { display: inline-grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 40px; flex: none; }
.pgrid i { aspect-ratio: 1; border-radius: 2px; background: rgba(146,157,178,.22); }

.pgrid.sm { width: 28px; gap: 1.5px; }
.pgrid.lg { width: 64px; gap: 3px; }
.bg-lineup { display: flex; gap: 8px; flex-wrap: wrap; }
.sess .bg-lineup .bg-step, .bg-main > .bg-lineup .bg-step { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); font-size: 13px; }
.sess .bg-step { flex-direction: column; align-items: flex-start; }

.bingo-wrap { height: auto; }
.bg-main { display: grid; gap: 14px; min-width: 0; align-content: start; }

.bg-round, .bg-caller { padding: 16px; display: flex; gap: 14px; align-items: center; }
.bg-short { display: none; }
.bg-caller { flex-direction: column; align-items: stretch; }
.bg-pname { font-family: var(--f-head); font-weight: 700; font-size: 26px; line-height: 1.1; }
.bg-now { display: flex; gap: 14px; align-items: center; }
.bg-callno { font-family: var(--f-head); font-weight: 700; font-size: 22px; }
.bg-recent { display: flex; gap: 6px; min-height: 34px; }
.ball { --bc: #386BFF; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: radial-gradient(circle at 35% 30%, #fff 0 6%, var(--bc) 60%, color-mix(in srgb, var(--bc) 60%, #000)); box-shadow: 0 4px 10px -4px #000; }
.ball > span { width: 64%; height: 64%; border-radius: 50%; background: #fff; color: #0E1530; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 11px; line-height: .9; text-align: center; }
.ball small { display: block; font-size: 7px; }
.ball.big { width: 74px; height: 74px; box-shadow: 0 0 30px color-mix(in srgb, var(--bc) 60%, transparent), 0 8px 20px -8px #000; animation: pop .35s var(--ease); }
.ball.big > span { font-size: 22px; }
.ball.big small { font-size: 11px; }
.ball.empty { background: rgba(146,157,178,.15); box-shadow: none; animation: none; }
.ball.empty > span { background: transparent; color: var(--muted); }
.bg-players { display: flex; gap: 8px; flex-wrap: wrap; }
.bg-plate { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 14px; background: rgba(9,13,24,.7); border: 1px solid var(--line-2); }
.bg-plate.me { border-color: rgba(56,107,255,.6); }
.bg-plate .nm { font-weight: 600; font-size: 13px; line-height: 1.2; }
.bg-plate .sub { font-size: 11px; color: var(--muted); }
.bg-plate .callout { position: absolute; top: -12px; right: -6px; margin: 0; }
.bg-cardwrap { position: relative; }
.bg-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 300px)); justify-content: center; }
.bcard { padding: 10px; border-radius: 18px; background: linear-gradient(180deg, #F7F9FE, #E8EDF7); box-shadow: 0 16px 40px -20px rgba(0,0,0,.8); color: #0E1530; transition: box-shadow .2s; }
.bcard.ready { box-shadow: 0 0 0 3px var(--accent), 0 0 30px rgba(255,138,50,.6); }
.bhead, .bgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.bhead span { text-align: center; font-family: var(--f-head); font-weight: 700; font-size: 18px; color: #FF5470; padding-bottom: 4px; }
.bgrid .cell { aspect-ratio: 1; border: 0; border-radius: 9px; background: #fff; color: #0E1530; font-family: var(--f-head); font-weight: 700; font-size: clamp(13px, 2.4vw, 19px); box-shadow: inset 0 0 0 1px rgba(14,21,48,.1); position: relative; padding: 0; }
.bgrid .cell.tgt { box-shadow: inset 0 0 0 2px rgba(255,84,112,.45); }
.bgrid .cell.m { background: radial-gradient(circle, #FF5470 0 56%, #fff 57%); color: #fff; }
.bgrid .cell.free { background: radial-gradient(circle, #9747FF 0 56%, #fff 57%); color: #fff; font-size: 10px; letter-spacing: .02em; }
.bgrid .cell.win { background: radial-gradient(circle, #FF8A32 0 60%, #FFE2C9 61%); }
.bgrid .cell.last { outline: 3px solid var(--cyan); outline-offset: -3px; }
.bnote { margin-top: 6px; color: #4A5573; text-align: center; }
.bg-actions { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
.bingo-btn { font-size: 22px; padding: 14px 42px; letter-spacing: .04em; }

.bg-board { padding: 12px; display: grid; gap: 4px; overflow-x: auto; }
.bg-board .brow { display: grid; grid-template-columns: 22px repeat(15, minmax(22px, 1fr)); gap: 3px; align-items: center; }
.bg-board .bl { font-family: var(--f-head); font-weight: 700; text-align: center; }
.bg-board .bn { text-align: center; font-size: 11px; padding: 3px 0; border-radius: 6px; color: rgba(146,157,178,.45); font-variant-numeric: tabular-nums; }
.bg-board .bn.on { background: rgba(56,107,255,.25); color: #fff; font-weight: 600; }
.bg-board .bn.last { background: var(--cyan); color: #0E1530; }
.bg-cardwrap .round-banner { z-index: 5; }
@media (max-width: 900px) {

  .bg-main > .bg-lineup { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }

}
@media (max-width: 900px) {

  .bg-round, .bg-caller { padding: 10px; gap: 8px; }

  .bg-round .pgrid.lg { width: 34px; gap: 2px; }
  .bg-round .small { display: none; }
  .bg-round .bg-short { display: block; margin-top: 2px; line-height: 1.3; }
  .bg-pname { font-size: 19px; }

  .ball.big { width: 52px; height: 52px; }

  .bg-recent .ball > span { font-size: 9px; }
  .bg-recent .ball small { display: none; }
  .bg-caller .row .btn { padding: 5px 8px; font-size: 12px; }
}

/* ---------- photos, picker, invites ---------- */
.avatar.photo { background-size: cover; background-position: center; }
.avatar.photo::after { display: none; }
.picker { display: grid; gap: 10px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.pick { display: grid; gap: 6px; }
.mcard { padding: 6px; border-radius: 12px; background: #F7F9FE; color: #0E1530; cursor: pointer; box-shadow: 0 8px 20px -12px #000; transition: box-shadow .15s, transform .15s; }
.mcard:hover { transform: translateY(-2px); }
.mcard.on { box-shadow: 0 0 0 3px var(--cyan), 0 0 22px rgba(32,229,255,.5); }
.mhead, .mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; text-align: center; }
.mhead span { font-family: var(--f-head); font-weight: 700; font-size: 11px; color: #FF5470; }
.mgrid span { font-family: var(--f-head); font-weight: 600; font-size: 11px; padding: 3px 0; border-radius: 4px; background: #fff; box-shadow: inset 0 0 0 1px rgba(14,21,48,.08); font-variant-numeric: tabular-nums; }
.mgrid span.free { background: #9747FF; color: #fff; }
.alaga { border: 1px solid var(--line-2); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 9px; padding: 5px 8px; font-size: 12px; font-weight: 600; }
.alaga.saved { color: #FFC06B; border-color: rgba(255,192,107,.5); background: rgba(255,138,50,.1); }
.invite-card { border-color: rgba(32,229,255,.35); }
.invite-card .code { color: var(--cyan); text-shadow: 0 0 20px rgba(32,229,255,.4); }
button, .card, .cell, [data-act] { touch-action: manipulation; }
.card.sm .cn { font-size: calc(var(--cw) * .28); }
.card.sm .cn small { font-size: calc(var(--cw) * .22); }
.card.sm .big { font-size: calc(var(--cw) * .48); }
/* safe areas when installed to the home screen */
.side { padding-top: calc(22px + env(safe-area-inset-top)); }
@media (max-width: 900px) { main { padding-top: calc(16px + env(safe-area-inset-top)); } }
@media (max-width: 900px) { .toast { bottom: calc(84px + env(safe-area-inset-bottom)); } .in-game .toast { bottom: calc(20px + env(safe-area-inset-bottom)); } }

/* ---------- flags ---------- */
.flag { display: inline-block; width: 20px; height: 15px; border-radius: 3px; object-fit: cover; vertical-align: -3px; margin-right: 6px; box-shadow: 0 0 0 1px rgba(255,255,255,.18); flex: none; }
.flag.sm { width: 16px; height: 12px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
.loc { display: inline-flex; align-items: center; }

.country-in #cflag:not(:empty) + .input { padding-left: 42px; }
.podium .p .loc { justify-content: center; }

.rank-table .loc { display: flex; align-items: center; max-width: 240px; min-width: 0; }
