<script>/* DeckFlix game tables + router */
(function () {
  'use strict';
  const App = window.App, CV = window.CV, $ = App.$, esc = App.esc;
  // How long bots 'think' before each move: base + random spread (ms)
  const PACE = { relaxed: [2300, 1400], normal: [1500, 1100], quick: [700, 400] };
  const think = (pace, follow) => { const [b, r] = PACE[pace] || PACE.normal; return follow ? b * 0.6 + Math.random() * r * 0.6 : b + Math.random() * r; };
  const LINES = {
    win: ['Grabe!', 'Swerte mo ah', 'Ayos!', 'Nice one'], lose: ['Sayang…', 'Bawi ako next', 'Ouch'],
    draw: ['Laban!', 'Hmm, sige', 'Talaga ba?'], tongits: ['Tongits?! Grabe', 'GG', 'Wow'], sapaw: ['Sapaw!', 'Hoy!'], two: ['Dos!', 'Lakas!'], pass: ['Pass muna', 'Bahala na'],
  };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  class Match {
    constructor(gameId, opts) {
      this.gameId = gameId; this.opts = opts;
      const u = App.data.user;
      const n = gameId === 'tongits' ? 3 : gameId === 'pusoydos' ? 4 : gameId === 'solitaire' ? 1 : gameId === 'bingo' ? opts.bingoSeats || 4 : opts.ibSeats || 4;
      this.isBingo = gameId === 'bingo';
      this.solo = gameId === 'solitaire'; this.undoStack = [];
      this.online = !!opts.online; this.host = this.online && opts.role === 'host'; this.guest = this.online && opts.role === 'guest';
      this.players = opts.players ? opts.players.map((p) => Object.assign({}, p))
        : [{ name: u.name, bot: false, av: u.avatar, photo: u.photo || null, country: u.country || '', cards: opts.myCards || null }].concat(App.BOTS.slice(0, n - 1).map(([b, av]) => ({ name: b, bot: true, av })));
      const cfg = { players: this.players, dealer: opts.dealer || 0, startChips: opts.startChips || opts.ibChips || 300, rotations: opts.ibRot || 4 };
      if (this.isBingo) { cfg.cardsEach = opts.cardsEach || 2; cfg.roundCount = opts.roundCount || 5; }
      if (this.solo) cfg.drawCount = opts.drawCount || App.data.settings.solDraw || 1;
      if (opts.session) Object.assign(cfg, { session: true, winRounds: opts.winRounds, scoring: opts.scoring, rules: opts.rules });
      this.auth = this.guest ? new App.RemoteAuthority(gameId) : new CV.LocalAuthority(gameId, cfg);
      this.E = this.auth.engine;
      this.me = opts.mySeat || 0;
      if (this.host) this.auth.onChange((a, seat, r) => App.Online.sendViews(seat >= 0 ? { seat, a, r: r ? { outcome: r.outcome, delta: r.delta } : null } : null));
      this.sel = new Set(); this.chat = []; this.tab = 'log'; this.sort = 'rank';
      this.bet = null; this.dealt = false; this.prevHand = new Set(); this.ibWins = 0; this.hintIdx = -1; this.hintMarks = null;
      this.timers = []; this.deadline = null; this.recorded = false; this.bubbles = {};
      this.seenSeq = -1; this.callouts = {};
      if (opts.session) this.tab = 'score';
    }
    v() { return this.auth.view(this.me); }
    destroy() { this.timers.forEach(clearTimeout); clearInterval(this.tick); this.dead = true; }
    later(fn, ms) { const t = setTimeout(() => { if (!this.dead) fn(); }, ms); this.timers.push(t); return t; }

    // ---------------------------------------------------- control flow
    begin() {
      App.sfx('deal');
      this.render();
      this.later(() => { this.dealt = true; this.loop(); }, 900);
      this.tick = setInterval(() => this.tickTimer(), 200);
    }
    actorSeats(v) {
      if (v.game === 'bingo' || v.phase === 'ended' || v.phase === 'reveal') return [];
      if (v.phase === 'drawCall') return v.pending.awaiting.slice();
      return [v.turn];
    }
    loop() {
      if (this.dead) return;
      const v = this.v();
      if (!v) return;
      if (v.phase === 'ended') return this.finish(v);
      if (this.guest) { // guests only render; the host's device runs the game
        if (this.actorSeats(v).includes(this.me) && !this.myTurnActive) { this.myTurnActive = true; App.sfx('turn'); this.render(); }
        return;
      }
      if (this.isBingo) return this.bingoLoop();
      if (v.phase === 'reveal') { this.later(() => { this.auth.advance(); this.after(); }, 1900); return; }
      const actors = this.actorSeats(v);
      const bot = actors.find((s) => this.players[s].bot);
      if (actors.includes(this.me) && !this.myTurnActive) {
        this.myTurnActive = true;
        if (!this.solo) App.sfx('turn');
        if (this.opts.timer > 0) { this.deadline = Date.now() + this.opts.timer * 1000; this.deadlineTotal = this.opts.timer * 1000; }
        this.render();
      }
      if (bot != null && !this.botPending) {
        this.botPending = true;
        const st = this.auth.state;
        const quick = this.gameId === 'tongits' && st.phase === 'act' && st.turn === bot && this.botActedThisTurn;
        this.later(() => this.botMove(bot), think(this.opts.pace, quick));
      }
    }
    botMove(seat) {
      this.botPending = false;
      const view = this.auth.view(seat); // bots only see their own seat's view
      const a = this.E.bot(view, seat);
      const before = this.auth.state.turn;
      const r = this.auth.submit(seat, a);
      if (!r.ok) { console.warn('bot move rejected', a, r.error); const t = this.E.timeoutAction(view, seat); this.auth.submit(seat, t); }
      this.botActedThisTurn = this.auth.state.turn === before && this.auth.state.phase === 'act';
      this.react(seat, a, r);
      this.after();
    }
    submit(a) {
      const snap = this.solo ? JSON.stringify(this.auth.state) : null;
      const r = this.auth.submit(this.me, a);
      if (r.pending) { this.sel.clear(); this.hintIdx = -1; this.hintMarks = null; this.render(); return r; }
      if (this.solo && r.ok) {
        this.undoStack.push(snap); if (this.undoStack.length > 300) this.undoStack.shift();
        if (!this.solStart) this.solStart = Date.now();
        if (this.auth.state.phase === 'ended') this.solEnd = Date.now();
      }
      if (!r.ok) { App.sfx('error'); App.toast(r.error, 'bad'); return r; }
      this.react(this.me, a, r);
      this.sel.clear(); this.hintIdx = -1; this.hintMarks = null;
      this.after();
      return r;
    }
    // host: a move arrived from another player's device
    remoteAction(seat, a, replyErr) {
      const r = this.auth.submit(seat, a);
      if (!r.ok) return replyErr(r.error);
      this.react(seat, a, r);
      if (this.isBingo && a.type === 'claim') { this.callouts[seat] = { text: 'BINGO!', until: Date.now() + 3000, chow: true }; App.sfx('coin'); if (this.auth.state.claims.length === 1) this.bingoLoop(); this.render(); return; }
      this.after();
    }
    // guest: the host sent a new view of the table
    receiveView(view, ev) {
      const prev = this.auth.latest;
      this.auth.latest = view;
      if (this.isBingo) this.bingoOnView(prev, view, ev);
      else if (ev && ev.a && ev.seat >= 0) this.react(ev.seat, ev.a, ev.r || {});
      if (!this.dealt && prev == null) { this.render(); return; }
      this.after();
    }
    netChat(m) {
      const seat = this.players.findIndex((p) => p.id === m.id);
      if (seat < 0 || seat === this.me) return;
      if (m.t === 'emo') { this.bubbles[seat] = { text: m.text, until: Date.now() + 2200 }; this.chat.push({ seat, text: m.text }); }
      else { const t = String(m.text || '').slice(0, 140); this.chat.push({ seat, text: t }); this.bubbles[seat] = { text: t, until: Date.now() + 2800 }; App.sfx('select'); }
      this.render();
    }
    after() {
      const v = this.v();
      if (!v) { this.render(); return; }
      if (v.session && v.lastRound && v.lastRound.n !== this.bannerRound) {
        this.bannerRound = v.lastRound.n;
        this.banner = { r: v.lastRound, until: Date.now() + 2600 };
        this.later(() => this.render(), 2700);
        if (v.lastRound.winner === this.me) App.sfx('coin');
      }
      if (!this.actorSeats(v).includes(this.me)) { this.deadline = null; this.myTurnActive = false; }
      this.render();
      this.loop();
    }
    tickTimer() {
      if (this.solo && !this.dead) { const t = $('#soltime'); if (t) { const s = Math.floor(this.solElapsed() / 1000); t.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); } }
      if (!this.deadline || this.dead) return;
      const left = this.deadline - Date.now();
      const ring = $('#myring'), tx = $('#mytime');
      const p = Math.max(0, left / this.deadlineTotal) * 100;
      if (ring) { ring.style.setProperty('--p', p); ring.classList.toggle('low', left < 6000); }
      if (tx) tx.textContent = Math.max(0, Math.ceil(left / 1000)) + 's';
      if (left <= 0) {
        this.deadline = null;
        const a = this.E.timeoutAction(this.v(), this.me);
        App.toast('Time’s up. Auto-played a safe move.');
        this.submit(a);
      }
    }

    // ---------------------------------------------------- reactions, sound, chat
    react(seat, a, r) {
      const v = this.v(); if (!v) return;
      r = r || {};
      const st = v;
      const nm = (id) => { const c = CV.makeDeck().find((x) => x.id === id); return c ? CV.cardName(c) : ''; };
      const say = {
        drawStock: 'Drew from the stock', takeDiscard: `Chow! ${st.last && st.last.card ? nm(st.last.card) : ''}`, meld: 'Laid down a meld', sapaw: 'Sapaw!',
        discard: `Discarded ${nm(a.card)}`, callDraw: 'Called a draw!', challenge: 'Challenge!', fold: 'Fold', pass: 'Pass',
        play: v.trick && v.trick.by === seat ? CV.Pusoy.TYPE_LABEL[v.trick.combo.type] : '',
      }[a.type];
      if (say && this.gameId !== 'inbetween') { this.callouts[seat] = { text: say, until: Date.now() + 2600, chow: a.type === 'takeDiscard' }; this.later(() => this.render(), 2700); }
      if (this.gameId === 'inbetween' && a.type === 'bet') {
        App.sfx(r.outcome === 'win' ? 'coin' : r.outcome === 'post' ? 'post' : 'play');
        if (!r.outcome && v.last) r = { outcome: v.last.kind };
        if (seat === this.me && r.outcome === 'win') this.ibWins++;
        if (r.outcome === 'post' || (r.outcome === 'win' && a.amount >= 50)) this.botTalk(seat, r.outcome === 'win' ? 'win' : 'lose');
      } else if (a.type === 'pass') App.sfx('select');
      else if (a.type === 'drawStock' || a.type === 'takeDiscard') App.sfx('deal');
      else App.sfx('play');
      if (a.type === 'callDraw') this.botTalk(seat, 'draw');
      if (a.type === 'sapaw' && st.melds && st.melds[a.meld] && st.melds[a.meld].owner !== seat) this.botTalk(st.melds[a.meld].owner, 'sapaw', 0.6);
      if (this.gameId === 'pusoydos' && a.type === 'play' && v.trick && v.trick.cards.some((c) => c.r === 2)) this.botTalk(seat, 'two', 0.35);
    }
    botTalk(exceptSeat, kind, p = 0.45) {
      if (Math.random() > p) return;
      const bots = this.players.map((pl, i) => i).filter((i) => this.players[i].bot && i !== exceptSeat);
      if (!bots.length) return;
      const s = pick(bots); const line = pick(LINES[kind]);
      this.chat.push({ seat: s, text: line });
      this.bubbles[s] = { text: line, until: Date.now() + 2200 };
      this.later(() => this.renderFeed(), 0);
    }
    say(text) {
      text = text.trim().slice(0, 140); if (!text) return;
      this.chat.push({ seat: this.me, text });
      this.bubbles[this.me] = { text, until: Date.now() + 2600 };
      if (this.online) App.Online.chat('chat', text);
      if (this.players.some((p) => p.bot) && Math.random() < (this.online ? 0.2 : 0.5)) this.later(() => { const b = pick(this.players.map((_, i) => i).filter((i) => i !== this.me)); const t = pick(['Haha', 'Sige!', 'Game!', '👍', 'Tara!']); this.chat.push({ seat: b, text: t }); this.bubbles[b] = { text: t, until: Date.now() + 2200 }; this.render(); }, 1200);
      this.tab = 'chat'; this.render();
    }
    emoji(e) {
      this.chat.push({ seat: this.me, text: e });
      if (this.online) App.Online.chat('emo', e);
      const el = $('#seat-me .ring') || $('#seat-me');
      if (el) { const f = document.createElement('span'); f.className = 'react'; f.textContent = e; el.appendChild(f); setTimeout(() => f.remove(), 1900); }
      this.renderFeed();
    }

    // ---------------------------------------------------- finish
    finish(v) {
      this.deadline = null;
      if (this.recorded) return;
      this.recorded = true;
      const res = v.result; const won = res.winners.includes(this.me);
      const mine = res.standings.find((s) => s.seat === this.me);
      const score = res.session ? mine.net : mine ? mine.score : 0;
      const bgPunuan = this.isBingo && res.rounds && res.rounds.length ? res.rounds[res.rounds.length - 1].winners.includes(this.me) : false;
      App.Rank.submit({ game: this.gameId, won, online: this.online });
      App.data.history.push({ online: this.online, bgPunuan, game: this.gameId, at: Date.now(), won, reason: res.session ? (won ? 'Grand Champion of a session' : 'Tracked session') : res.reason, score, ibWins: this.ibWins, players: this.players.length });
      if (res.session) {
        App.data.lastSession = {
          id: 's' + Date.now().toString(36), at: Date.now(), config: this.opts.room || {}, opts: Object.assign({}, this.opts, { players: undefined, online: undefined, role: undefined, mySeat: undefined, matchId: undefined }),
          players: this.players.map((p) => ({ name: p.name, av: p.av, bot: p.bot, photo: p.photo || null })), rows: res.standings, champs: res.winners, me: this.me, online: this.online, guest: this.guest,
          champNames: res.winners.map((i) => this.players[i].name).join(' & '), session: res.session, log: (v.log || []).slice(-1500),
        };
        App.viewSession = null;
      }
      if (App.data.history.length > 300) App.data.history.shift();
      App.save(); App.renderMeChip();
      // a win is celebrated by the confetti fanfare on the results screen; play the jingle only if that screen is skipped
      if (!won || this.skipResults) App.sfx(won ? 'win' : 'lose');
      if (this.skipResults) return;
      if (res.session) { this.later(() => { App.toast('Session over. Crowning the Grand Champion.'); location.hash = 'session-results'; setTimeout(() => App.confetti({ big: won }), 350); }, 1400); return; }
      this.later(() => this.showResults(v), 900);
    }
    showResults(v) {
      const res = v.result; const won = res.winners.includes(this.me);
      if (this.solo) {
        const s = Math.floor(this.solElapsed() / 1000);
        const m = App.modal(`<div class="results" style="text-align:center">
          <div class="trophy ${won ? '' : 'lost'}">${App.icon(won ? 'trophy' : 'cards')}</div>
          <h2>${won ? 'Solved!' : 'Game over'}</h2>
          <p class="muted small" style="margin-top:6px">Solitaire, draw ${v.drawCount === 3 ? 'three' : 'one'}.</p>
          <div class="stat-row" style="grid-template-columns:repeat(3,1fr);margin:18px 0">
            <div class="stat"><div class="v">${v.score}</div><div class="l">Score</div></div>
            <div class="stat"><div class="v">${v.moves}</div><div class="l">Moves</div></div>
            <div class="stat"><div class="v">${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}</div><div class="l">Time</div></div></div>
          <div class="row" style="justify-content:center"><button class="btn btn-accent" data-act="rematch">Deal again</button><button class="btn btn-ghost" data-act="tolobby">Return to lobby</button></div>
          <p class="tiny muted" style="margin-top:12px">Saved to your match history.</p></div>`, { locked: true });
        m.dataset.locked = '1';
        if (won) App.confetti({ big: true });
        return;
      }
      const unit = this.gameId === 'inbetween' ? 'chips' : 'pts';
      const winnerName = res.winners.map((i) => this.players[i].name).join(' & ');
      const rows = res.standings.map((s, i) => {
        const hand = res.revealed ? res.revealed[s.seat] : null;
        const extra = this.isBingo ? `${s.wins} round${s.wins === 1 ? '' : 's'} won` : this.gameId === 'tongits' ? `${s.points} hand pts${s.opened ? '' : ', burned'}` : this.gameId === 'pusoydos' ? `${s.cardsLeft} cards left` : '';
        return `<div class="standing"><b style="font-family:var(--f-head);color:${i === 0 ? '#FFC06B' : 'var(--muted)'}">${i + 1}</b>
          <div><div class="row" style="gap:8px">${App.avatar(this.players[s.seat].name, this.players[s.seat].av, 'sm', this.players[s.seat].photo)}<b>${esc(s.name)}${s.seat === this.me ? ' (you)' : ''}</b><span class="tiny muted">${extra}</span></div>
          ${hand && hand.length ? `<div class="reveal">${hand.map((c) => App.cardHTML(c, { sm: true })).join('')}</div>` : ''}</div>
          <b style="font-variant-numeric:tabular-nums">${this.gameId === 'inbetween' ? s.score : (s.score > 0 ? '+' : '') + s.score} ${unit}</b></div>`;
      }).join('');
      const s = App.modal(`<div class="results" style="text-align:center">
          <div class="trophy ${won ? '' : 'lost'}">${App.icon(won ? 'trophy' : 'cards')}</div>
          <h2>${won ? 'You win!' : esc(winnerName) + ' wins'}</h2>
          <p class="muted small" style="margin-top:6px">${App.game(this.gameId).name}, won by ${esc(res.reason.charAt(0).toLowerCase() + res.reason.slice(1))}.</p>
          <div style="text-align:left;margin:18px 0">${rows}</div>
          ${this.gameId === 'inbetween' && res.standings[0] && res.standings[0].net != null ? `<div class="settle-box"><div class="row between"><b>Settle up</b><span class="tiny muted">Virtual points, no cash value</span></div>
            ${App.settleHTML(this.players, CV.settle(this.players.map((_, i) => (res.standings.find((r) => r.seat === i) || { net: 0 }).net)), this.me, { compact: true })}</div>` : ''}
          <div class="row" style="justify-content:center">${this.guest ? '<button class="btn btn-ghost" disabled>Waiting for the host to start a rematch</button><button class="btn btn-ghost" data-act="tolobby">Back to the room</button>'
            : `<button class="btn btn-accent" data-act="rematch">Rematch</button><button class="btn btn-ghost" data-act="tolobby">${this.online ? 'Back to the room' : 'Return to lobby'}</button>`}</div>
          <p class="tiny muted" style="margin-top:12px">Saved to your match history${App.Rank.online() ? ' and rankings' : ''}.</p></div>`, { wide: true, locked: true });
      s.dataset.locked = '1';
      if (res.winners.length) App.confetti({ big: won });
    }

    // ---------------------------------------------------- layout helpers
    isMobile() { return window.innerWidth <= 900; }
    seatPos(i) {
      const n = this.players.length; const rel = (i - this.me + n) % n; const m = n - 1;
      if (this.isMobile()) { // opponents sit in a band across the top of the table
        const perRow = m <= 3 ? m : Math.ceil(m / 2);
        const row = Math.floor((rel - 1) / perRow), col = (rel - 1) % perRow;
        const inRow = row === 0 ? Math.min(perRow, m) : m - perRow;
        return { x: ((col + 0.5) / inRow) * 100, y: row === 0 ? 9 : 22, mobile: true };
      }
      let angles;
      if (m === 1) angles = [270];
      else if (m === 2) angles = [205, 335];
      else if (m === 3) angles = [195, 270, 345];
      else angles = Array.from({ length: m }, (_, k) => 190 + (160 * k) / (m - 1));
      const a = (angles[rel - 1] * Math.PI) / 180;
      return { x: 50 + 41 * Math.cos(a), y: 50 + 42 * Math.sin(a) };
    }
    plate(i, v, sub, tags = '', backs = 0) {
      const p = this.players[i]; const pos = this.seatPos(i);
      const isTurn = this.actorSeats(v).includes(i);
      const b = this.bubbles[i] && this.bubbles[i].until > Date.now() ? `<span class="speech">${esc(this.bubbles[i].text)}</span>` : '';
      const co = this.callouts[i] && this.callouts[i].until > Date.now() ? `<span class="callout ${this.callouts[i].chow ? 'chow' : ''}">${esc(this.callouts[i].text)}</span>` : '';
      const bk = backs ? `<div class="backs">${Array.from({ length: Math.min(backs, 13) }, (_, k) => App.cardHTML(null, { back: true, cls: this.dealt ? '' : 'deal-in', attr: `style="animation-delay:${k * 40}ms"` })).join('')}</div>` : '';
      const edge = pos.x < 22 ? 'transform:translate(0,-50%);align-items:flex-start;left:2%' : pos.x > 78 ? 'transform:translate(-100%,-50%);align-items:flex-end;left:98%' : `left:${pos.x}%`;
      return `<div class="opp ${isTurn ? 'turn' : ''}" style="top:${pos.y}%;${pos.mobile ? `left:${pos.x}%` : edge}">
        <div class="plate">${b}${App.avatar(p.name, p.av, 'sm', p.photo)}<div><div class="nm">${App.flag(p.country, 'sm')}${esc(p.name)}${p.away ? ' <span class="tag blocked">Away</span>' : ''} ${isTurn ? '<span class="thinking"><i></i><i></i><i></i></span>' : ''}</div><div class="sub">${sub}</div></div>${tags}</div>${bk}${co}</div>`;
    }
    meRow(v, right) {
      const u = this.players[this.me];
      const myTurn = this.actorSeats(v).includes(this.me);
      const b = this.bubbles[this.me] && this.bubbles[this.me].until > Date.now() ? `<span class="speech">${esc(this.bubbles[this.me].text)}</span>` : '';
      return `<div class="me-row"><div id="seat-me" class="row" style="gap:10px;position:relative">${b}<span id="myring" class="ring ${myTurn && this.deadline ? 'on' : ''}">${App.avatar(u.name, u.av, '', u.photo)}</span>
        <div><b>${App.flag(u.country, 'sm')}${esc(u.name)}</b><div class="tiny ${myTurn ? '' : 'muted'}" style="${myTurn ? 'color:var(--cyan)' : ''}">${myTurn ? `Your turn ${this.deadline ? `<span id="mytime"></span>` : ''}` : 'Waiting'}</div></div></div>
        <div class="grow"></div>${right}</div>`;
    }
    sortHand(hand) {
      const SO = this.gameId === 'pusoydos' ? { C: 0, S: 1, H: 2, D: 3 } : { S: 0, H: 1, C: 2, D: 3 };
      const rv = this.gameId === 'pusoydos' ? CV.Pusoy.rv : (c) => c.r;
      return hand.slice().sort((a, b) => (this.sort === 'suit' ? SO[a.s] - SO[b.s] || rv(a) - rv(b) : rv(a) - rv(b) || SO[a.s] - SO[b.s]));
    }
    handHTML(hand, disabled) {
      const sorted = this.sortHand(hand);
      const ids = new Set(sorted.map((c) => c.id));
      [...this.sel].forEach((id) => { if (!ids.has(id)) this.sel.delete(id); });
      const fresh = this.prevHand.size ? sorted.filter((c) => !this.prevHand.has(c.id)).map((c) => c.id) : [];
      this.prevHand = ids;
      const colors = ['#FF8A32', '#20E5FF', '#9747FF', '#3DF2A8', '#FF5470'];
      const w = window.innerWidth, cw = w <= 420 ? 50 : w <= 900 ? 58 : 74;
      const avail = Math.min(w <= 900 ? w - 36 : w - 248 - 300 - 120, 980);
      const n = Math.max(sorted.length, 2);
      const ml = Math.round(Math.min(cw * 0.58, (avail - cw) / (n - 1)) - cw);
      return `<div class="hand ${disabled ? 'disabled' : ''}" style="--ml:${ml}px" role="group" aria-label="Your hand">${sorted.map((c, i) => {
        const mark = this.hintMarks && this.hintMarks[c.id] != null ? `<span class="meldmark" style="background:${colors[this.hintMarks[c.id] % 5]}"></span>` : '';
        const cls = [this.sel.has(c.id) ? 'sel' : this.chowIds && this.chowIds.has(c.id) ? 'hint' : '', !this.dealt ? 'deal-in' : fresh.includes(c.id) ? 'fly-in' : ''].join(' ');
        return App.cardHTML(c, { cls, attr: `data-act="card" data-arg="${c.id}" tabindex="0" style="animation-delay:${this.dealt ? 0 : i * 45}ms;--dx:${(6 - i) * 18}px"` }).replace(/<\/div>$/, mark + '</div>');
      }).join('')}</div>`;
    }

    // ---------------------------------------------------- render
    render() {
      if (this.dead) return;

      const scrollFeed = $('#feed') ? $('#feed').scrollTop : null;

        <div class="game-bar">
          <button class="icon-btn" data-act="leave" aria-label="Leave match">${App.icon('back')}</button>
          <h2>${g.name}</h2>${this.online ? `<span class="pill net" title="Room code">${App.Online.code || 'Online'}</span>` : '<span class="pill sim">Bots</span>'}
          <span class="grow"></span>
          <button class="icon-btn" data-act="rules" data-arg="${this.gameId}" aria-label="Rules">${App.icon('info')}</button>
          <button class="icon-btn" data-act="sound" aria-label="Toggle sound">${App.icon(App.data.settings.sound ? 'sound' : 'mute')}</button>

        </div>
        <div class="game-wrap">
          <div class="table-area">
            <div class="felt" style="${this.isMobile() ? `--padtop:${this.players.length - 1 > 3 ? 190 : 118}px` : ''}">${body.seats}<div class="center">${body.center}</div></div>
            <div class="me-area">${this.meRow(v, body.right || '')}<div class="status-line" aria-live="polite">${body.status || ''}</div>${body.hand || ''}<div class="actions">${body.actions || ''}</div></div>
          </div>
          ${this.sidePanelHTML(v)}
        </div>`;
      this.renderFeed(scrollFeed);
      if (this.deadline) this.tickTimer();
      const inp = $('#betinput');
      if (inp) {
        const v0 = this.v();
        inp.addEventListener('input', () => {
          const n = Math.floor(Number(inp.value));
          if (inp.value !== '' && Number.isFinite(n)) this.bet = n;
          const r = $('#betrisk'); if (r) r.innerHTML = this.ibRisk(v0, inp.value === '' ? NaN : n);
          inp.classList.toggle('invalid', !(n >= v0.minBet && n <= v0.maxBet));
        });

        inp.addEventListener('focus', () => { this._betFocus = true; inp.select(); });
        inp.addEventListener('blur', () => { this._betFocus = false; });

      }
    }
    sidePanelHTML(v) {
      return `<aside class="glass side-panel ${this.feedOpen ? 'open' : ''}">
            <div class="tabs" role="tablist">${v.session ? `<button class="${this.tab === 'score' ? 'on' : ''}" data-act="tab" data-arg="score">Scoreboard</button>` : ''}<button class="${this.tab === 'log' ? 'on' : ''}" data-act="tab" data-arg="log">Game log</button><button class="${this.tab === 'chat' ? 'on' : ''}" data-act="tab" data-arg="chat">Chat</button><span class="grow" style="flex:1"></span><button class="btn-quiet mobile-only" data-act="togglefeed" style="border:0;background:none">${App.icon('x')}</button></div>
            <div class="feed" id="feed"></div>
            <div class="emoji-row">${['😀', '🔥', '👏', '😮', '😂', '🃏'].map((e) => `<button data-act="emoji" data-arg="${e}" aria-label="React ${e}">${e}</button>`).join('')}</div>
            <form class="chat-form" data-form="chat"><input class="input" name="msg" placeholder="Say something" maxlength="140" autocomplete="off" aria-label="Chat message"><button class="btn btn-primary btn-sm">Send</button></form>
            <p class="tiny muted" style="padding:0 12px 10px">Bots answer with set phrases. Live chat comes with multiplayer.</p>
          </aside>`;
    }
    renderFeed() {
      const f = $('#feed'); if (!f) return;
      const v = this.v();
      if (this.tab === 'score' && v.session) {
        const rows = v.seats.map((s, i) => ({ i, s, w: v.rounds.filter((r) => r.winner === i).length, l: v.rounds.filter((r) => r.deltas[i] < 0).length }))
          .sort((a, b) => (v.session.scoring === 'points' ? b.s.chips - a.s.chips || b.w - a.w : b.w - a.w || b.s.chips - a.s.chips));
        f.innerHTML = `<div class="tiny muted">The session ends when ${v.session.target} rounds have a winner. Ranked by ${v.session.scoring === 'points' ? 'points' : 'round wins'}.</div>
          <table class="table sb"><thead><tr><th>Player</th><th class="num">W</th><th class="num">L</th><th class="num">Points</th></tr></thead><tbody>
          ${rows.map((r) => `<tr><td>${esc(this.players[r.i].name)}${r.i === this.me ? ' (you)' : ''}${r.s.out ? ' <span class="res-l tiny">out</span>' : ''}</td><td class="num">${r.w}</td><td class="num">${r.l}</td><td class="num">${r.s.chips}</td></tr>`).join('')}</tbody></table>
          <div class="tiny muted" style="margin-top:6px">Rounds so far</div>
          ${v.rounds.length ? v.rounds.slice().reverse().map((r) => `<div class="ln"><b>R${r.n}</b> ${r.winner != null ? esc(this.players[r.winner].name) : 'No winner'} <span class="muted">${esc(r.how)}</span></div>`).join('') : '<div class="ln sys">No rounds finished yet.</div>'}`;
        return;
      }
      if (this.tab === 'log') {
        f.innerHTML = v.log.map((l) => `<div class="ln ${['ante', 'shuffle', 'deal', 'clear'].includes(l.t) ? 'sys' : ''} ${['end', 'callDraw', 'win'].includes(l.t) ? 'hl' : ''}">${esc(l.msg)}</div>`).join('');
      } else {
        f.innerHTML = this.chat.length ? this.chat.map((c) => `<div class="chatln ${c.seat === this.me ? 'mine' : ''}"><b>${esc(this.players[c.seat].name)}</b> ${esc(c.text)}</div>`).join('') : '<div class="ln sys">Say hi to the table.</div>';
      }

    }

    // ---------------------------------------------------- In Between
    render_inbetween(v) {
      const myTurn = v.turn === this.me && v.phase === 'bet' && this.dealt;
      const turnName = this.players[v.turn].name;
      const wins = (i) => (v.session ? v.rounds.filter((r) => r.winner === i).length : 0);
      const seats = v.seats.map((s, i) => (i === this.me ? '' : this.plate(i, v, s.out ? (v.session ? 'Eliminated' : 'Out of chips') : `<span class="chipstack">${s.chips}</span> ${v.session ? 'pts' : 'chips'}`, v.session && wins(i) ? `<span class="tag open">${wins(i)} won</span>` : ''))).join('');
      const [a, b] = v.posts || [];
      const third = v.phase === 'reveal' && v.third ? App.cardHTML(v.third, { cls: 'fly-in' }) : `<div class="card ghost" style="display:grid;place-items:center;color:var(--cyan);font-family:var(--f-head);font-size:28px">?</div>`;
      const N = (c) => CV.InBetween.num(v, c);
      const lab = (n) => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[n] || String(n));
      const gap = v.posts ? N(b) - N(a) - 1 : 0;
      const need = gap === 1 ? `Needs a ${lab(N(a) + 1)}, any suit` : gap > 1 ? `Needs ${lab(N(a) + 1)} to ${lab(N(b) - 1)}, any suit` : '';
      const gapText = v.postKind === 'pair' ? (v.noBet ? 'A pair: passes under house rules' : 'A pair: call higher or lower') : v.postKind === 'consecutive' ? 'No gap, this turn passes' : need;
      let outcome = '';
      if (v.phase === 'reveal' && v.last && v.last.kind !== 'pass') {
        const L = { win: 'In between!', lose: 'Missed', post: 'Hit the post' };
        const t = v.last.third, tn = CV.cardName(t);
        const why = v.postKind === 'pair' ? (v.last.kind === 'post' ? `${tn} matches the pair` : `${tn} is ${N(t) > N(a) ? 'higher' : 'lower'}`)
          : v.last.kind === 'win' ? `${lab(N(t))} is between ${lab(N(a))} and ${lab(N(b))}` : v.last.kind === 'post' ? `${lab(N(t))} equals a post` : `${lab(N(t))} is outside ${lab(N(a))} to ${lab(N(b))}`;
        outcome = `<span class="outcome ${v.last.kind}">${esc(this.players[v.last.seat].name)}: ${L[v.last.kind]} ${v.last.delta > 0 ? '+' : ''}${v.last.delta}</span><div class="small muted" style="margin-top:6px">${why}</div>`;
      }
      const center = `<div class="ib-center"><div class="pot"><div class="v">${v.pot}</div><div class="l">in the pot</div></div>
        <div class="muted small">${esc(turnName)}${v.turn === this.me ? ' (you)' : ''}’s posts</div>
        <div class="posts">${v.posts ? App.cardHTML(a, { cls: 'fly-in' }) + `<div class="slot">${third}<span class="gapnote">${gapText}</span></div>` + App.cardHTML(b, { cls: 'fly-in' }) : ''}</div>
        <div style="min-height:40px;margin-top:18px">${outcome}</div></div>`;
      const me = v.seats[this.me];
      let actions = '', status = '';
      if (v.phase === 'ended') status = 'Game over.';
      else if (me.out) status = 'You’re out of chips. Watch the rest of the game or leave.';
      else if (myTurn) {
        const min = v.minBet, max = v.maxBet;
        this.bet = Math.max(min, Math.min(max, this.bet || min));
        if (v.noBet) { status = v.postKind === 'pair' ? 'House rules: a pair passes automatically.' : 'Consecutive posts leave no gap, so pass this turn.'; actions = `<button class="btn btn-primary" data-act="ib" data-arg="pass">Pass</button>`; }
        else {
          const pay = v.rules.postMult === 3 ? 'triple' : 'double';
          status = v.postKind === 'pair' ? `<b>Pair of ${CV.rankLabel(a.r)}s.</b> Bet the next card is higher or lower. Matching the pair pays ${pay}.` : `<b>${need}.</b> Only the number counts, suit and colour don’t matter. Same number as a post pays ${pay}.`;
          const allIn = max === v.pot ? 'the whole pot' : 'all your points';
          actions = `<div class="bet-box">
              <label class="bet-field"><span class="tiny muted">Your bet</span><input id="betinput" class="input" type="number" inputmode="numeric" pattern="[0-9]*" min="${min}" max="${max}" step="1" value="${this.bet}" aria-label="Bet amount, ${min} to ${max}"></label>
              ${v.postKind === 'pair' ? `<button class="btn btn-primary" data-act="ib" data-arg="higher">Bet higher</button><button class="btn btn-primary" data-act="ib" data-arg="lower">Bet lower</button>` : `<button class="btn btn-primary" data-act="ib" data-arg="bet">Place bet</button>`}
              <button class="btn btn-accent allin" data-act="ibquick" data-arg="allin" title="Bet ${allIn}">ALL IN <span class="amt">${max}</span></button>
              <button class="btn btn-ghost" data-act="ib" data-arg="pass">Pass</button>
            </div>
            <div class="bet-risk small" id="betrisk" aria-live="polite">${this.ibRisk(v, this.bet)}</div>`;
        }
      } else status = v.phase === 'reveal' ? 'Revealing…' : `Waiting for ${esc(turnName)}.`;
      const unit = v.session ? 'points' : 'chips';
      let info;
      if (v.session) {
        const decided = v.rounds.filter((r) => r.winner != null).length;
        info = `<span class="small muted">Round ${v.roundNo}, ${decided} of ${v.session.target} won</span>`;
      } else {
        const round = Math.min(Math.floor(v.turnsTaken / v.seats.length) + 1, Math.ceil(v.maxTurns / v.seats.length));
        info = `<span class="small muted">Round ${round} of ${Math.ceil(v.maxTurns / v.seats.length)}</span>`;
      }
      let banner = '';
      if (this.banner && this.banner.until > Date.now()) {
        const r = this.banner.r;
        banner = `<div class="round-banner"><span class="tiny muted">Round ${r.n} complete</span><b>${r.winner != null ? esc(this.players[r.winner].name) + (r.winner === this.me ? ' (you)' : '') + ' wins the round' : 'No winner this round'}</b><span class="small muted">${esc(r.how)}${r.eliminated.length ? `. Eliminated: ${r.eliminated.map((i) => esc(this.players[i].name)).join(', ')}` : ''}</span></div>`;
      }
      return { seats, center: banner + center, status, actions, right: `${info}<span class="pill plain sim" style="font-size:14px"><span class="chipstack">${me.chips}</span>&nbsp;${unit}</span>` };
    }
    // What a bet can win or lose, shown live under the bet box
    ibRisk(v, amt) {
      const min = v.minBet, max = v.maxBet, me = v.seats[this.me].chips;
      if (!Number.isFinite(amt) || amt < min || amt > max) return `<span class="bad">Enter a bet from ${min} to ${max}.</span>`;
      const pm = v.rules.postMult, post = Math.min(me, amt * pm);
      const all = amt === max ? `<b>All in.</b> ` : '';
      return `${all}Win <b class="good">+${amt}</b> · Miss <b class="bad">−${amt}</b> · Hit the post <b class="bad">−${post}</b>${post < amt * pm ? ' (all you have)' : ''}`;
    }
    act_ib(arg) {
      const v = this.v();
      if (arg === 'pass') return this.submit({ type: 'pass' });
      const inp = $('#betinput');
      const amt = Math.floor(Number(inp ? inp.value : this.bet));
      if (!Number.isFinite(amt) || amt < v.minBet || amt > v.maxBet) {
        App.sfx('error'); App.toast(`Bet from ${v.minBet} to ${v.maxBet}.`);
        if (inp) { inp.focus(); inp.select(); }
        return;
      }
      this.bet = amt;
      const a = { type: 'bet', amount: amt };
      if (arg === 'higher' || arg === 'lower') a.call = arg;
      this.submit(a);
    }
    act_ibquick(arg) {
      const v = this.v();
      if (arg !== 'allin') return;
      this.bet = v.maxBet;
      // a pair still needs a call, so fill in the amount and let the player pick higher or lower
      if (v.postKind === 'pair') { this.render(); App.toast(`All in: ${v.maxBet}. Now pick higher or lower.`); return; }
      this.submit({ type: 'bet', amount: v.maxBet });
    }

    // ---------------------------------------------------- Tongits
    render_tongits(v) {
      const T = CV.Tongits; const me = v.seats[this.me];
      const myTurn = this.dealt && v.turn === this.me && (v.phase === 'draw' || v.phase === 'act');
      const seats = v.seats.map((s, i) => {
        if (i === this.me) return '';
        const tags = `${s.opened ? '<span class="tag open">Opened</span>' : ''}${s.drawBlocked ? '<span class="tag blocked">Sapaw’d</span>' : ''}`;
        return this.plate(i, v, `${s.handCount} cards${i === v.dealer ? ', dealer' : ''}`, tags, s.handCount);
      }).join('');
      const top = v.discard[v.discard.length - 1];
      const selCards = me.hand.filter((c) => this.sel.has(c.id));
      const prev = this.players[(this.me + 2) % 3].name;
      const chowTurn = myTurn && v.phase === 'draw' && top;
      this.chowOpts = chowTurn ? T.chowOptions(me.hand, top) : [];
      this.chowIds = this.chowOpts.length && !this.sel.size ? new Set(this.chowOpts.flatMap((o) => o.with.map((c) => c.id))) : null;
      const canSapaw = myTurn && v.phase === 'act' && selCards.length === 1;
      const melds = v.melds.map((m, i) => {
        const can = canSapaw && T.canLayOff(m, selCards[0]);
        return `<div class="meld ${can ? 'can' : ''}" ${can ? `data-act="sapaw" data-arg="${i}" role="button" tabindex="0" aria-label="Sapaw onto ${esc(this.players[m.owner].name)}’s meld"` : ''}><span class="own">${m.owner === this.me ? 'You' : esc(this.players[m.owner].name)}</span>${m.cards.map((c) => App.cardHTML(c)).join('')}</div>`;
      }).join('');
      let callbox = '';
      if (v.phase === 'drawCall') {
        const caller = this.players[v.pending.caller].name;
        callbox = v.pending.awaiting.includes(this.me)
          ? `<div class="callbox"><b>${esc(caller)} called a draw.</b><span class="small muted">You have ${T.handPoints(me.hand)} points in hand. Challenge if you think you’re lowest; a tie with the caller goes to you.</span><div class="row" style="justify-content:center"><button class="btn btn-accent" data-act="tg" data-arg="challenge">Challenge</button><button class="btn btn-ghost" data-act="tg" data-arg="fold">Fold</button></div></div>`
          : `<div class="callbox"><b>${esc(caller)} called a draw.</b><span class="small muted">Waiting for answers…</span></div>`;
      }
      const center = `<div class="tg-center">
        ${callbox}
        <div class="piles">
          <div class="pile">${v.stockCount ? `<div class="stackwrap">${App.cardHTML(null, { back: true })}${v.stockCount > 1 ? App.cardHTML(null, { back: true }) : ''}</div>` : '<div class="card ghost"></div>'}<span>Stock, ${v.stockCount} left</span></div>
          <div class="pile ${this.chowOpts.length ? 'clickable chowable' : ''}" ${this.chowOpts.length ? 'data-act="chowpile" role="button" tabindex="0" aria-label="Chow the discard"' : ''}>${top ? App.cardHTML(top, { cls: 'fly-in' }) : '<div class="card ghost"></div>'}${this.chowOpts.length ? '<span class="chow-badge">Chow</span>' : ''}<span>Discard${v.discard.length ? `, ${v.discard.length}` : ''}</span></div>
        </div>
        <div class="melds" aria-label="Exposed melds">${melds || '<span class="small muted">No melds on the table yet</span>'}</div></div>`;
      let status = '', actions = '';
      const pts = T.handPoints(me.hand);
      const selType = selCards.length >= 3 ? T.meldType(selCards) : null;
      const takeOk = top && selCards.length >= 2 && T.meldType(selCards.concat([top]));
      if (v.phase === 'ended') status = 'Round over.';
      else if (v.phase === 'drawCall') status = 'A draw has been called.';
      else if (!myTurn) status = `${esc(this.players[v.turn].name)} is ${v.phase === 'draw' ? 'deciding: draw or chow' : 'thinking'}…`;
      else if (v.phase === 'draw') {
        const tn = top ? CV.cardName(top) : '';
        const chows = this.chowOpts.slice(0, 3);
        const inOpts = takeOk && this.chowOpts.some((o) => o.with.length === selCards.length && o.with.every((c) => this.sel.has(c.id)));
        status = !top ? 'Draw a card to start your turn.'
          : chows.length ? `<b>You can chow ${tn}</b> from ${esc(prev)}. Pick the meld to lay down, or draw from the stock instead.`
          : `${esc(prev)} discarded ${tn}. It doesn’t make a set or run with your cards, so draw from the stock.`;
        actions = `<button class="btn btn-primary" data-act="tg" data-arg="drawStock" ${v.stockCount ? '' : 'disabled'}>Draw card</button>
          ${chows.map((o, i) => `<button class="btn btn-accent" data-act="chow" data-arg="${i}">Chow ${tn} with ${o.with.map((c) => CV.cardName(c)).join(' ')}</button>`).join('')}
          ${takeOk && !inOpts ? `<button class="btn btn-accent" data-act="tg" data-arg="takeDiscard">Chow with selected</button>` : ''}
          <button class="btn btn-accent" data-act="tg" data-arg="callDraw" ${me.opened && !me.drawBlocked ? '' : 'disabled'} title="${!me.opened ? 'Lay down a meld first' : me.drawBlocked ? 'Your meld was sapaw’d. Wait one turn.' : ''}">Call draw</button>`;
      } else {
        status = v.firstTurn && v.dealer === this.me && me.hand.length >= 13 ? 'You’re the dealer: no draw on your first turn. ' : '';
        status += selCards.length === 1 ? (v.melds.some((m) => T.canLayOff(m, selCards[0])) ? 'Tap a glowing meld to sapaw, or discard this card.' : 'Discard this card to end your turn.') : selCards.length >= 3 ? (selType ? `That’s a ${selType}. Lay it down.` : 'Those cards don’t make a meld.') : 'Lay down melds, sapaw, then discard one card.';
        actions = `<button class="btn btn-primary" data-act="tg" data-arg="meld" ${selType ? '' : 'disabled'}>Lay down meld</button>
          <button class="btn btn-accent" data-act="tg" data-arg="discard" ${selCards.length === 1 ? '' : 'disabled'}>Discard</button>`;
      }
      if (v.phase !== 'ended') actions += `<button class="btn btn-quiet btn-sm" data-act="hint">${App.icon('bulb')} Show melds</button><button class="btn btn-quiet btn-sm" data-act="sortmode">${App.icon('sort')} Sort by ${this.sort === 'rank' ? 'suit' : 'rank'}</button>`;
      return { seats, center, status, actions, hand: this.handHTML(me.hand, false),
        right: `<span class="small muted">${me.opened ? '<span class="tag open" style="font-size:11px;padding:2px 7px;border-radius:6px">Opened</span> ' : ''}${me.drawBlocked ? '<span class="tag blocked" style="font-size:11px;padding:2px 7px;border-radius:6px">Sapaw’d</span> ' : ''}Hand: <b style="color:var(--text)">${pts} pts</b></span>` };
    }
    act_tg(arg) {
      const v = this.v();
      const ids = [...this.sel];
      if (arg === 'takeDiscard') return this.submit({ type: 'takeDiscard', with: ids });
      if (arg === 'meld') return this.submit({ type: 'meld', cards: ids });
      if (arg === 'discard') return this.submit({ type: 'discard', card: ids[0] });
      this.submit({ type: arg });
    }
    act_sapaw(arg) { this.submit({ type: 'sapaw', card: [...this.sel][0], meld: +arg }); }

    // ---------------------------------------------------- Pusoy Dos
    render_pusoydos(v) {
      const P = CV.Pusoy; const me = v.seats[this.me];
      const myTurn = this.dealt && v.turn === this.me && v.phase === 'play';
      const seats = v.seats.map((s, i) => {
        if (i === this.me) return '';
        const tags = `${v.passed.includes(i) ? '<span class="tag blocked">Passed</span>' : ''}${s.handCount === 1 ? '<span class="tag open">Last card</span>' : ''}`;
        return this.plate(i, v, `${s.handCount} cards`, tags, s.handCount);
      }).join('');
      const t = v.trick;
      const center = `<div class="trick">${t ? `<div class="cards">${t.cards.map((c) => App.cardHTML(c, { cls: 'fly-in' })).join('')}</div><span class="lab"><b>${esc(this.players[t.by].name)}</b> played ${P.TYPE_LABEL[t.combo.type].toLowerCase()}</span>`
        : `<div class="card ghost" style="--cw:68px"></div><span class="lab">${v.mustInclude ? 'Lead with the <b>3♣</b> to start' : `<b>${esc(this.players[v.turn].name)}</b> leads a new round`}</span>`}
        <span class="tiny muted">${v.pileCount} cards played</span></div>`;
      const selCards = me.hand.filter((c) => this.sel.has(c.id));
      const combo = selCards.length ? P.classify(selCards) : null;
      let status = '', actions = '';
      if (v.phase === 'ended') status = 'Game over.';
      else if (!myTurn) status = `${esc(this.players[v.turn].name)} is thinking…`;
      else {
        const beats = combo && (!t || P.beats(combo, t.combo)) && (!v.mustInclude || this.sel.has(v.mustInclude));
        status = !selCards.length ? (t ? `Beat the ${P.TYPE_LABEL[t.combo.type].toLowerCase()} with ${t.combo.size} card${t.combo.size > 1 ? 's' : ''}, or pass.` : v.mustInclude ? 'You hold the 3♣. Your first play must include it.' : 'You lead. Play any valid combination.')
          : !combo ? 'Not a valid combination.' : beats ? `${P.TYPE_LABEL[combo.type]}. Ready to play.` : v.mustInclude && !this.sel.has(v.mustInclude) ? 'Include the 3♣.' : `${P.TYPE_LABEL[combo.type]} doesn’t beat the table.`;
        actions = `<button class="btn btn-accent" data-act="pd" data-arg="play" ${beats ? '' : 'disabled'}>Play</button>
          <button class="btn btn-ghost" data-act="pd" data-arg="pass" ${t ? '' : 'disabled'}>Pass</button>
          <button class="btn btn-quiet btn-sm" data-act="hint">${App.icon('bulb')} Suggest</button>`;
      }
      if (v.phase !== 'ended') actions += `<button class="btn btn-quiet btn-sm" data-act="sortmode">${App.icon('sort')} Sort by ${this.sort === 'rank' ? 'suit' : 'rank'}</button>${this.sel.size ? '<button class="btn btn-quiet btn-sm" data-act="clearsel">Clear</button>' : ''}`;
      return { seats, center, status, actions, hand: this.handHTML(me.hand, false), right: `<span class="small muted">${me.handCount} cards left</span>` };
    }
    act_pd(arg) { if (arg === 'pass') return this.submit({ type: 'pass' }); this.submit({ type: 'play', cards: [...this.sel] }); }

    // ---------------------------------------------------- shared handlers
    handle(act, arg) {
      const v = this.v();
      switch (act) {
        case 'bg-claim': case 'bg-cell': case 'bg-pause': case 'bg-board': case 'bg-auto':
          return this.isBingo ? this.bingoHandle(act, arg) : false;
        case 'sol-draw': case 'sol-undo': case 'sol-hint': case 'sol-finish': case 'sol-new': case 'sol-drawmode':
          return this.solo ? this.solHandle(act, arg) : false;
        case 'card': {
          if (this.gameId === 'inbetween') return;
          this.sel.has(arg) ? this.sel.delete(arg) : this.sel.add(arg);
          App.sfx('select'); this.render(); return true;
        }
        case 'ib': return this.act_ib(arg), true;
        case 'ibquick': return this.act_ibquick(arg), true;
        case 'tg': return this.act_tg(arg), true;
        case 'sapaw': return this.act_sapaw(arg), true;
        case 'pd': return this.act_pd(arg), true;
        case 'chow': { const o = (this.chowOpts || [])[+arg]; if (o) this.submit({ type: 'takeDiscard', with: o.with.map((c) => c.id) }); return true; }
        case 'chowpile': {
          const opts = this.chowOpts || [];
          if (opts.length === 1) this.submit({ type: 'takeDiscard', with: opts[0].with.map((c) => c.id) });
          else if (opts.length) { App.toast('Choose which meld to make with it.'); }
          return true;
        }
        case 'clearsel': this.sel.clear(); this.render(); return true;
        case 'sortmode': this.sort = this.sort === 'rank' ? 'suit' : 'rank'; this.render(); return true;
        case 'hint': {
          const hand = v.seats[this.me].hand;
          if (this.gameId === 'tongits') {
            if (this.hintMarks) { this.hintMarks = null; this.render(); return true; }
            const best = CV.Tongits.bestMelds(hand); this.hintMarks = {};
            best.melds.forEach((m, k) => m.forEach((c) => (this.hintMarks[c.id] = k)));
            if (!best.melds.length) App.toast('No complete melds in your hand yet.');
            else if (best.melds.length) { this.sel = new Set(best.melds[0].map((c) => c.id)); }
          } else {
            const opts = CV.Pusoy.hint(v, this.me);
            if (!opts.length) { App.toast('Nothing in your hand beats the table. Pass.'); return true; }
            this.hintIdx = (this.hintIdx + 1) % opts.length;
            this.sel = new Set(opts[this.hintIdx].cards.map((c) => c.id));
          }
          this.render(); return true;
        }
        case 'tab': this.tab = arg; this.render(); return true;
        case 'togglefeed': this.feedOpen = !this.feedOpen; this.render(); return true;
        case 'emoji': this.emoji(arg); return true;
      }
      return false;
    }
  }
  App.Match = Match;

  // ======================================================================= router
  App.match = null;
  App.startMatch = (gameId, opts = {}) => {
    if (App.match) App.match.destroy();
    App.closeModal();
    const o = Object.assign({ timer: App.data.settings.timer, pace: App.data.settings.pace }, opts);
    App.lastOpts = { gameId, opts: o };
    App.match = new Match(gameId, o);
    App.data.recent = [gameId].concat((App.data.recent || []).filter((g) => g !== gameId)).slice(0, 5);
    App.save();
    if (location.hash !== '#play-' + gameId) { App.skipRoute = true; location.hash = 'play-' + gameId; }
    App.route();
    return App.match;
  };
  // leaving the table: end online games properly
  App.leaveTable = () => {
    const m = App.match; if (!m) return;
    const ended = m.v() && m.v().phase === 'ended';
    if (m.online) {
      if (!ended) App.Online.close();
      else if (m.host) App.Online.backToLobby();
    }
    m.destroy(); App.match = null;
  };

  App.route = () => {
    if (!App.data.user) { App.onboard(); }
    const h = (location.hash || '#lobby').slice(1);
    if (h.startsWith('join-')) {
      const code = h.slice(5).toUpperCase();
      if (!App.data.user) { App.pendingJoin = code; return; }
      App.skipRoute = true; location.hash = 'room';
      App.joinRoom(code);
      return;
    }
    const page = h.startsWith('play-') ? 'play' : (App.pages[h] ? h : 'lobby');
    document.body.classList.toggle('in-game', page === 'play');
    document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('on', a.dataset.nav === page));
    if (page === 'play') {
      const gameId = h.slice(5);
      if (!['inbetween', 'tongits', 'pusoydos', 'solitaire', 'bingo'].includes(gameId)) { location.hash = 'library'; return; }
      if (!App.data.user) return;
      if ((!App.match || App.match.dead) && App.Online.role === 'guest') { location.hash = 'room'; return; }
      if (!App.match || App.match.gameId !== gameId || App.match.dead) { App.match = new Match(gameId, { timer: App.data.settings.timer, pace: App.data.settings.pace }); App.lastOpts = { gameId, opts: App.match.opts }; }
      if (!App.match.started) { App.match.started = true; App.match.begin(); } else App.match.render();
      window.scrollTo(0, 0);
      return;
    }
    if (App.match) App.leaveTable();
    if (!App.data.user) { $('#view').innerHTML = ''; return; }
    $('#view').innerHTML = App.pages[page]();
    window.scrollTo(0, 0);
  };

  // ======================================================================= events
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) return App.closeModal();
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, arg = el.dataset.arg;
    if (App.match && !App.match.dead && App.match.handle(act, arg)) return;
    switch (act) {
      case 'quickplay': if (arg === 'bingo') { App.room = App.newRoom('bingo'); location.hash = 'rooms'; break; } App.startMatch(arg); break;
      case 'rules': App.showRules(arg); break;
      case 'sound': App.data.settings.sound = !App.data.settings.sound; App.save(); App.sfx('select'); App.match ? App.match.render() : App.route(); break;
      case 'cat': App.setLibFilter(arg); location.hash = 'library'; break;
      case 'libfilter': App.setLibFilter(arg); App.route(); break;
      case 'lbperiod': App.setLbPeriod(arg); App.route(); break;
      case 'roomgame': App.room.game = arg; App.room.ready = false; App.route(); App.Online.hostLobby(); break;
      case 'roomset': { const [k, val] = arg.split(':'); App.room[k] = isNaN(+val) ? val : +val; if (k === 'timer' || k === 'pace') { App.data.settings[k] = App.room[k]; App.save(); } App.route(); App.Online.hostLobby(); break; }
      case 'ready': App.room.ready = !App.room.ready; App.sfx('select'); App.route(); App.Online.hostLobby(); break;
      case 'startroom': {
        const r = App.room;
        const opts = r.game === 'inbetween' ? App.sessionOpts(r) : r.game === 'bingo' ? { pace: r.pace, bingoSeats: r.bgSeats || 4, cardsEach: r.bgCards || 2, roundCount: r.bgRounds || 5, myCards: App.bingoChosen(r) } : { timer: 0, pace: r.pace };
        if (App.Online.role === 'host') {
          if (!App.Online.allReady()) { App.toast('Wait until everyone in the room is ready.'); break; }
          try { App.Online.start(r.game, opts); } catch (err) { App.toast(err.message, 'bad'); }
          break;
        }
        App.room = null; App.startMatch(r.game, opts); break;
      }
      case 'sessionagain': {
        const x = App.viewSession || App.data.lastSession; if (!x) break;
        if (App.Online.role === 'host') { try { App.Online.start('inbetween', Object.assign({}, x.opts, { dealer: 0 })); } catch (err) { App.toast(err.message, 'bad'); } break; }
        App.startMatch('inbetween', Object.assign({}, x.opts, { dealer: 0 })); break;
      }
      case 'hostsession': App.room = App.newRoom('inbetween'); location.hash = 'rooms'; break;
      case 'gosessionsetup': { const x = App.viewSession || App.data.lastSession; App.room = x && x.config && x.config.game ? Object.assign({}, x.config, { ready: false }) : App.newRoom('inbetween'); App.room.game = 'inbetween'; location.hash = 'rooms'; break; }
      case 'viewsession': App.viewSession = (App.data.sessions || []).find((x) => x.id === arg) || null; if (location.hash === '#session-results') App.route(); else location.hash = 'session-results'; break;
      case 'savesession': {
        const x = App.viewSession || App.data.lastSession; if (!x) break;
        App.data.sessions = (App.data.sessions || []).filter((s) => s.id !== x.id).concat([x]).slice(-20);
        App.save(); App.route(); App.toast(App.storageOk ? 'Session saved to this browser.' : 'Saved for this visit. Browser storage is blocked, so it won’t survive a reload.'); break;
      }
      case 'copysession': {
        const x = App.viewSession || App.data.lastSession; if (!x) break;
        try { navigator.clipboard.writeText(App.sessionSummaryText(x)).then(() => App.toast('Results copied.'), () => App.toast('Copy was blocked by the browser.', 'bad')); } catch (e) { App.toast('Copy was blocked by the browser.', 'bad'); }
        break;
      }
      case 'editprofile': App.onboard(true); break;
      case 'resetdata':
        App.modal(`<h2>Reset your data?</h2><p class="muted" style="margin:10px 0 20px">This clears your match history, stats and achievements in this browser. Your name stays.</p><div class="row"><button class="btn btn-accent" data-act="confirmreset">Reset data</button><button class="btn btn-ghost" data-close>Keep my data</button></div>`);
        break;
      case 'confirmreset': App.data.history = []; App.data.recent = []; App.save(); App.closeModal(); App.renderMeChip(); App.route(); App.toast('Data reset.'); break;
      case 'leave':
        if (App.match && App.auth_phase_ended()) { location.hash = App.match.online ? (App.match.host ? 'rooms' : 'room') : 'lobby'; break; }
        App.modal(`<h2>Leave this match?</h2><p class="muted" style="margin:10px 0 20px">${App.match && App.match.host ? 'You’re the host, so the game ends for everyone in the room.' : App.match && App.match.guest ? 'A bot will take your seat for the rest of this game.' : App.match && App.match.solo ? 'This deal isn’t recorded.' : App.match && App.match.opts.session ? 'The session ends without a champion and isn’t recorded.' : 'The game ends and isn’t recorded.'}</p><div class="row"><button class="btn btn-accent" data-act="confirmleave">Leave match</button><button class="btn btn-ghost" data-close>Keep playing</button></div>`);
        break;
      case 'confirmleave': App.closeModal(); location.hash = 'lobby'; break;
      case 'rematch': {
        const m = App.match; const last = App.lastOpts;
        if (m && m.online) { if (m.host) { App.closeModal(); App.Online.rematch(); } break; }
        const opts = Object.assign({}, last.opts);
        if (m && m.gameId === 'tongits') opts.dealer = m.v().result.winners[0];
        if (opts.session) opts.dealer = 0;
        App.startMatch(last.gameId, opts); break;
      }
      case 'tolobby': {
        App.closeModal();
        const m = App.match;
        if (m && m.online && App.Online.role) { location.hash = m.host ? 'rooms' : 'room'; break; }
        location.hash = 'lobby'; break;
      }
    }
  });
  App.auth_phase_ended = () => App.match && App.match.v() && App.match.v().phase === 'ended';
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="card"],[data-act="sapaw"]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form]'); if (!f) return;
    if (f.dataset.form === 'chat') { e.preventDefault(); if (App.match) App.match.say(f.msg.value); }
    if (f.dataset.form === 'join') {
      e.preventDefault();
      const code = f.code.value.trim().toUpperCase();
      if (code.length !== 5) { $('#joinmsg').innerHTML = '<div class="note warn">Room codes are 5 letters or numbers.</div>'; return; }
      if (!App.Net.available()) { $('#joinmsg').innerHTML = `<div class="note warn">Online play isn’t switched on in this copy of DeckFlix. Open the deployed site to join friends.</div>`; return; }
      location.hash = 'join-' + code;
    }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-input]'); if (!el || !App.room) return;
    const k = el.dataset.input;
    const val = k === 'bgRounds' ? Math.max(1, Math.min(10, Math.floor(+el.value) || 5))
      : k === 'rAnte'
      ? Math.round(Math.max(1, Math.min(1000, Math.floor((App.room.sStart || 300) / 2), +el.value || 1)))
      : Math.round(Math.max(20, Math.min(10000, +el.value || 300)) / 10) * 10;
    App.room[k] = val; App.route(); if (App.Online && App.Online.hostLobby) App.Online.hostLobby();
  });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (App.match && !App.match.dead) App.match.render(); }, 150); });
  window.addEventListener('hashchange', () => { if (App.skipRoute) { App.skipRoute = false; return; } App.route(); });

})();
</script>
<script>/* DeckFlix Solitaire table: tap a card to move it to its best spot, or drag it. */
(function () {
  'use strict';
  const App = window.App, CV = window.CV, $ = App.$;
  const S = CV.Solitaire;
  const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const parse = (str) => { const [pile, i, idx] = str.split(':'); return pile === 'waste' ? { pile } : { pile, i: +i, idx: idx == null ? undefined : +idx }; };
  const same = (a, b) => a && b && a.pile === b.pile && (a.i ?? -1) === (b.i ?? -1) && (a.idx ?? -1) === (b.idx ?? -1);

  Object.assign(App.Match.prototype, {
    solMetrics() {
      const w = window.innerWidth, mobile = w <= 900;
      const W = mobile ? w - 28 : Math.min(w - 248 - 80, 960);
      const g = W < 520 ? 5 : 12;
      const cw = Math.max(38, Math.min(100, Math.floor((W - 6 * g - 2.8 * g - 4) / 7))); // columns + gaps + board padding
      const compact = cw < 64;
      return { cw, g, compact, downOff: Math.round(cw * (compact ? 0.17 : 0.14)), upOff: Math.round(cw * (compact ? 0.44 : 0.3)) };
    },
    solCard(c, extra = '', attr = '') {
      return App.cardHTML(c, { sm: this.solM.compact, cls: (this.solM.compact ? 'solc ' : '') + extra, attr });
    },

    render_solitaire(v) {
      const m = (this.solM = this.solMetrics());
      const st = this.auth.state;
      const hint = this.solHint && this.solHint.until > Date.now() ? this.solHint : null;
      const isHintSrc = (src) => hint && !hint.draw && same(hint.from, src);
      const isHintDst = (t) => hint && !hint.draw && hint.to.pile === t.pile && hint.to.i === t.i;
      let k = 0;

      // top row: stock, waste, foundations
      const stock = `<div class="slot stock ${hint && hint.draw ? 'sol-hint' : ''}" data-act="sol-draw" role="button" tabindex="0" aria-label="${v.stockCount ? 'Draw from the stock' : 'Turn the waste back over'}">
        ${v.stockCount ? App.cardHTML(null, { back: true }) + `<span class="count">${v.stockCount}</span>` : `<span class="recycle">${v.wasteCount ? App.icon('sort') : ''}</span>`}</div>`;
      const shown = v.drawCount === 3 ? v.waste : v.waste.slice(-1);
      const waste = `<div class="slot waste ${v.drawCount === 3 ? 'wide' : ''}">${shown.map((c, i) => {
        const top = i === shown.length - 1;
        const src = 'waste';
        return `<div class="wcard" style="left:${v.drawCount === 3 ? i * Math.round(m.cw * (m.compact ? 0.5 : 0.36)) : 0}px">${this.solCard(c, top ? (isHintSrc({ pile: 'waste' }) ? 'sol-hint' : '') : 'covered side', top ? `data-src="${src}"` : '')}</div>`;
      }).join('')}</div>`;
      const found = v.found.map((p, i) => {
        const top = p[p.length - 1];
        return `<div class="slot found ${isHintDst({ pile: 'found', i }) ? 'sol-hint' : ''}" data-target="found:${i}">${top ? this.solCard(top, '', `data-src="found:${i}"`) : '<span class="ph">A</span>'}</div>`;
      }).join('');

      // tableau
      const cols = v.tab.map((col, i) => {
        let y = 0;
        const cards = col.map((x, idx) => {
          const top = y;
          y += x.up ? m.upOff : m.downOff;
          const src = { pile: 'tab', i, idx };
          const hl = isHintSrc(src) || (hint && !hint.draw && hint.from.pile === 'tab' && hint.from.i === i && idx > hint.from.idx) ? 'sol-hint' : '';
          const pos = `style="top:${top}px"`;
          const d = this.dealt ? '' : ` deal-in`;
          const delay = this.dealt ? '' : ` style="top:${top}px;animation-delay:${k++ * 28}ms"`;
          return x.up
            ? this.solCard(x.card, hl + d + (idx < col.length - 1 ? ' covered' : ''), `data-src="tab:${i}:${idx}" ${delay || pos}`)
            : App.cardHTML(null, { back: true, cls: d.trim(), attr: delay || pos });
        }).join('');
        const h = col.length ? y - (col[col.length - 1].up ? m.upOff : m.downOff) + m.cw * 1.4 : m.cw * 1.4;
        return `<div class="col ${isHintDst({ pile: 'tab', i }) ? 'sol-hint-col' : ''}" data-target="tab:${i}" style="height:${Math.ceil(h)}px">${col.length ? cards : '<span class="slot empty"><span class="ph">K</span></span>'}</div>`;
      }).join('');

      const board = `<div class="sol-board ${m.compact ? 'compact' : ''}" style="--cw:${m.cw}px;--g:${m.g}px">
        <div class="sol-top">${stock}${waste}${v.drawCount === 3 ? '' : '<span></span>'}${found}</div>
        <div class="sol-tab">${cols}</div></div>`;

      const canFinish = v.phase === 'play' && S.canAutoFinish(st);
      const status = v.phase === 'ended' ? (v.result.winners.length ? 'Solved. Nice work.' : 'Game over.')
        : !v.moves ? 'Tap a card to send it to its best spot, or drag it where you want. Tap the stock to draw.'
        : canFinish ? 'Every card is face up. Finish to send them all to the foundations.'
        : `Build columns down in alternating colours. Foundations go Ace to King by suit.`;
      const actions = `
        <button class="btn btn-ghost btn-sm" data-act="sol-undo" ${this.undoStack.length && v.phase === 'play' ? '' : 'disabled'}>Undo</button>
        <button class="btn btn-ghost btn-sm" data-act="sol-hint" ${v.phase === 'play' ? '' : 'disabled'}>${App.icon('bulb')} Hint</button>
        ${canFinish ? '<button class="btn btn-accent btn-sm" data-act="sol-finish">Finish</button>' : ''}
        <div class="seg" role="group" aria-label="Cards per draw"><button class="${v.drawCount === 1 ? 'on' : ''}" data-act="sol-drawmode" data-arg="1">Draw 1</button><button class="${v.drawCount === 3 ? 'on' : ''}" data-act="sol-drawmode" data-arg="3">Draw 3</button></div>
        <button class="btn btn-primary btn-sm" data-act="sol-new">New deal</button>`;
      const right = `<span><b>${v.score}</b> <span class="muted">score</span></span><span><b>${v.moves}</b> <span class="muted">moves</span></span><span><b id="soltime">${fmt(this.solElapsed())}</b> <span class="muted">time</span></span>`;
      return { board, status, actions, right };
    },

    solElapsed() { return this.solStart ? (this.solEnd || Date.now()) - this.solStart : 0; },

    bindSol() {
      const board = $('.sol-board'); if (!board) return;
      board.addEventListener('pointerdown', (e) => this.solDown(e));
    },
    solDown(e) {
      const el = e.target.closest('[data-src]');
      if (!el || this.auth.state.phase !== 'play' || this.solBusy) return;
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      this.drag = { src: parse(el.dataset.src), x0: e.clientX, y0: e.clientY, el, started: false };
      this._mv = (ev) => this.solMove(ev); this._up = (ev) => this.solUp(ev);
      window.addEventListener('pointermove', this._mv); window.addEventListener('pointerup', this._up); window.addEventListener('pointercancel', this._up);
    },
    solMove(e) {
      const d = this.drag; if (!d) return;
      if (!d.started) {
        if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 7) return;
        d.started = true;
        let els = [d.el];
        if (d.src.pile === 'tab') els = [...document.querySelectorAll(`.col[data-target="tab:${d.src.i}"] [data-src]`)].filter((x) => parse(x.dataset.src).idx >= d.src.idx);
        const r0 = els[0].getBoundingClientRect();
        const ghost = document.createElement('div');
        ghost.className = 'sol-ghost'; ghost.style.setProperty('--cw', this.solM.cw + 'px');
        els.forEach((x) => { const r = x.getBoundingClientRect(); const c = x.cloneNode(true); c.style.cssText = `position:absolute;left:0;top:${r.top - r0.top}px`; ghost.appendChild(c); x.style.visibility = 'hidden'; });
        document.body.appendChild(ghost);
        d.ghost = ghost; d.els = els; d.ox = d.x0 - r0.left; d.oy = d.y0 - r0.top;
        App.sfx('select');
      }
      d.ghost.style.transform = `translate(${e.clientX - d.ox}px, ${e.clientY - d.oy}px)`;
      const over = document.elementFromPoint(e.clientX, e.clientY);
      document.querySelectorAll('.drop-over').forEach((x) => x.classList.remove('drop-over'));
      const t = over && over.closest('[data-target]'); if (t) t.classList.add('drop-over');
    },
    solUp(e) {
      window.removeEventListener('pointermove', this._mv); window.removeEventListener('pointerup', this._up); window.removeEventListener('pointercancel', this._up);
      const d = this.drag; this.drag = null; if (!d) return;
      if (d.started) {
        d.ghost.style.display = 'none';
        const over = document.elementFromPoint(e.clientX, e.clientY);
        const t = over && over.closest('[data-target]');
        d.ghost.remove(); d.els.forEach((x) => (x.style.visibility = ''));
        document.querySelectorAll('.drop-over').forEach((x) => x.classList.remove('drop-over'));
        if (t) {
          const to = parse(t.dataset.target);
          if (to.pile === d.src.pile && to.i === d.src.i) return;
          this.submit({ type: 'move', from: d.src, to: { pile: to.pile, i: to.i } });
        }
        return;
      }
      // tap: send the card to its best destination
      const to = S.bestTarget(this.auth.state, d.src);
      if (to) this.submit({ type: 'move', from: d.src, to });
      else { App.sfx('error'); d.el.classList.remove('nope'); void d.el.offsetWidth; d.el.classList.add('nope'); }
    },

    solHandle(act, arg) {
      const st = this.auth.state;
      switch (act) {
        case 'sol-draw': if (st.phase === 'play') this.submit({ type: 'draw' }); return true;
        case 'sol-undo': {
          const snap = this.undoStack.pop(); if (!snap) return true;
          const moves = st.moves;
          this.auth.state = JSON.parse(snap);
          this.auth.state.moves = moves + 1; this.auth.state.seq++;
          App.sfx('select'); this.render(); return true;
        }
        case 'sol-hint': {
          const h = S.hint(st);
          if (!h) { App.toast('No moves left. Undo, or start a new deal.'); return true; }
          this.solHint = Object.assign({}, h, { until: Date.now() + 1800 });
          if (h.draw) App.toast(st.stock.length ? 'Draw from the stock.' : 'Turn the waste back over and keep drawing.');
          this.render(); this.later(() => this.render(), 1850); return true;
        }
        case 'sol-finish': {
          this.solBusy = true;
          const step = () => {
            const s = this.auth.state; if (s.phase !== 'play') { this.solBusy = false; return; }
            const m = S.nextFoundationMove(s); if (!m) { this.solBusy = false; return; }
            this.submit({ type: 'move', ...m }); this.later(step, 110);
          };
          step(); return true;
        }
        case 'sol-new': this.solNewDeal(this.auth.state.drawCount); return true;
        case 'sol-drawmode': {
          const n = +arg; App.data.settings.solDraw = n; App.save();
          if (n !== st.drawCount) this.solNewDeal(n);
          return true;
        }
      }
      return false;
    },
    solNewDeal(drawCount) {
      const st = this.auth.state;
      const go = () => {
        if (st.phase === 'play' && st.moves > 0) { this.skipResults = true; this.auth.submit(0, { type: 'resign' }); this.finish(this.v()); }
        App.startMatch('solitaire', Object.assign({}, this.opts, { drawCount }));
      };
      if (st.phase === 'play' && st.moves > 0) {
        App.modal(`<h2>Start a new deal?</h2><p class="muted" style="margin:10px 0 20px">This game will be saved as unfinished.</p><div class="row"><button class="btn btn-accent" id="newdeal-yes">New deal</button><button class="btn btn-ghost" data-close>Keep playing</button></div>`);
        $('#newdeal-yes').addEventListener('click', () => { App.closeModal(); go(); });
      } else go();
    },
  });
})();
</script>
<script>/* DeckFlix Bingo night: ball caller, cards, claims, five pattern rounds */
(function () {
  'use strict';
  const App = window.App, CV = window.CV, $ = App.$, esc = App.esc;
  const B = CV.Bingo;
  const CALL_MS = { relaxed: 5200, normal: 3800, quick: 2300 };
  const BALL_COLOR = { B: '#20E5FF', I: '#386BFF', N: '#9747FF', G: '#FF8A32', O: '#FF5470' };
  const label = (n) => `${B.letter(n)} ${n}`;

  Object.assign(App.Match.prototype, {
    bingoInit() {
      if (this.bg) return;
      this.bg = { daubs: new Set(), board: !this.isMobile(), botPlan: new Set(), lastSeq: -1, auto: App.data.settings.autoDaub !== false };
    },
    bingoLoop() {
      this.bingoInit();
      clearTimeout(this.bgTimer);
      const st = this.auth.state;
      if (this.dead || st.phase === 'ended' || this.paused) return;
      let delay = st.phase === 'calling' ? (st.drawn.length ? this.opts.callMs || CALL_MS[this.opts.pace] || CALL_MS.normal : 1600)
        : st.phase === 'claimed' ? 2600 : 4200;
      if (st.phase === 'calling' && st.drawn.length && this.bg.voiceMs && !this.opts.callMs) delay = Math.max(delay, this.bg.voiceMs + 1000);
      this.bgTimer = this.later(() => {
        const before = st.phase;
        this.auth.advance();
        const now = this.auth.state;
        if (before === 'calling' && now.phase === 'calling') {
          App.sfx('deal'); this.bingoScheduleBots();
          this.bg.voiceMs = App.Voice.callBall(now.drawn[now.drawn.length - 1], App.data.settings.voiceTimes || 3);
        }
        if (before === 'claimed' && (now.phase === 'between' || now.phase === 'ended')) this.bingoRoundClosed();
        if (before === 'between') { App.sfx('turn'); this.bg.daubs.clear(); this.bg.botPlan.clear(); }
        this.render();
        if (now.phase === 'ended') return this.finish(this.v());
        this.bingoLoop();
      }, delay);
    },
    bingoScheduleBots() {
      const st = this.auth.state;
      this.players.forEach((p, i) => {
        if (!p.bot) return;
        const key = `${st.roundIdx}:${i}`;
        if (this.bg.botPlan.has(key)) return;
        const a = B.bot(this.auth.view(i), i); // bots only read their own cards
        if (!a) return;
        this.bg.botPlan.add(key);
        this.later(() => {
          const s = this.auth.state;
          if (s.phase !== 'calling' && s.phase !== 'claimed') return;
          if (`${s.roundIdx}:${i}` !== key) return;
          const wasCalling = s.phase === 'calling';
          const r = this.auth.submit(i, a);
          if (r.ok) {
            this.callouts[i] = { text: 'BINGO!', until: Date.now() + 3000, chow: true };
            App.sfx('coin');
            if (wasCalling) this.bingoLoop(); // start the short window for others to claim
            this.render();
          }
        }, 900 + Math.random() * 1700);
      });
    },
    // guest: new data from the host
    bingoOnView(prev, v, ev) {
      this.bingoInit();
      if (!prev) return;
      if (v.drawn.length > prev.drawn.length && v.roundIdx === prev.roundIdx) { App.sfx('deal'); App.Voice.callBall(v.drawn[v.drawn.length - 1], App.data.settings.voiceTimes || 3); }
      if (v.roundIdx !== prev.roundIdx) { this.bg.daubs.clear(); App.sfx('turn'); }
      v.claims.filter((c) => !prev.claims.some((p) => p.seat === c.seat) || prev.roundIdx !== v.roundIdx).forEach((c) => { this.callouts[c.seat] = { text: 'BINGO!', until: Date.now() + 3000, chow: true }; App.sfx('coin'); });
      if (v.results.length > prev.results.length) { const r = v.results[v.results.length - 1]; if (r.winners.includes(this.me)) App.sfx('win'); }
    },
    bingoRoundClosed() {
      const r = this.auth.state.results[this.auth.state.results.length - 1];
      if (!r) return;
      if (r.winners.includes(this.me)) App.sfx('win');
      else if (r.winners.length) this.botTalk(r.winners[0], 'win', 0.6);
    },

    bingoHandle(act, arg) {
      const st = this.v();
      switch (act) {
        case 'bg-claim': {
          if (st.claims.some((c) => c.seat === this.me)) return true; // already called this round
          if (this.guest) {
            if (!st.seats[this.me].cards.some((c) => CV.Bingo.completed(c, st.drawn, st.pattern))) { App.sfx('error'); App.toast(`Not a bingo yet. You need ${CV.Bingo.PATTERNS[st.pattern].name.toLowerCase()} with numbers that have been called.`, 'bad'); return true; }
            this.auth.submit(this.me, { type: 'claim' }); App.sfx('select'); return true;
          }
          const wasCalling = st.phase === 'calling';
          const r = this.auth.submit(this.me, { type: 'claim' });
          if (!r.ok) { App.sfx('error'); App.toast(r.error, 'bad'); return true; }
          this.callouts[this.me] = { text: 'BINGO!', until: Date.now() + 3000, chow: true };
          App.sfx('coin');
          if (wasCalling) this.bingoLoop(); // only the first claim starts the short window
          this.render(); return true;
        }
        case 'bg-cell': {
          const [ci, n] = arg.split(':').map(Number);
          if (!n) return true;
          if (!st.drawn.includes(n)) { App.sfx('error'); App.toast(`${label(n)} hasn’t been called yet.`); return true; }
          const k = `${ci}:${n}`;
          this.bg.daubs.has(k) ? this.bg.daubs.delete(k) : this.bg.daubs.add(k);
          App.sfx('select'); this.render(); return true;
        }
        case 'bg-pause':
          if (this.guest) { App.toast('Only the host can pause the calling.'); return true; }
          this.paused = !this.paused;
          if (this.paused) clearTimeout(this.bgTimer); else this.bingoLoop();
          this.render(); return true;
        case 'bg-board': this.bg.board = !this.bg.board; this.render(); return true;
        case 'bg-voice':
          App.data.settings.voice = App.data.settings.voice === false; App.save();
          if (App.data.settings.voice !== false) { App.Voice.unlock(); App.toast(App.Voice.ok ? 'The caller will read each number out 3 times.' : 'This browser can’t read numbers aloud.'); }
          else if (App.Voice.ok) speechSynthesis.cancel();
          this.render(); return true;
        case 'bg-auto':
          this.bg.auto = !this.bg.auto; App.data.settings.autoDaub = this.bg.auto; App.save();
          if (!this.bg.auto) { this.bg.daubs.clear(); }
          this.render(); return true;
      }
      return false;
    },

    // ------------------------------------------------------------- page
    bingoPage(v) {
      this.bingoInit();
      const g = App.game('bingo');
      const p = v.pattern, P = B.PATTERNS[p];
      const me = v.seats[this.me];
      const drawn = new Set(v.drawn);
      const lastBall = v.drawn[v.drawn.length - 1];
      const marked = (ci, n) => n === 0 || (drawn.has(n) && (this.bg.auto || this.bg.daubs.has(`${ci}:${n}`)));
      const markedList = (ci, card) => card.filter((n) => marked(ci, n) && n);
      const live = v.phase === 'calling' || v.phase === 'claimed';

      // round lineup
      const steps = v.rounds.map((rp, i) => {
        const res = v.results[i];
        const state = i < v.roundIdx || res ? 'done' : i === v.roundIdx ? 'now' : '';
        const who = res ? (res.winners.length ? res.winners.map((s) => esc(this.players[s].name) + (rp === 'any' && res.made && res.made[s] ? `, ${B.PATTERNS[res.made[s]].name.toLowerCase()}` : '')).join(' & ') : 'No winner') : `${B.POINTS[rp]} pts`;
        return `<div class="bg-step ${state}">${App.patternGrid(rp, 'sm')}<span><b>${i + 1}. ${B.PATTERNS[rp].name}</b><br><span class="tiny muted">${who}</span></span></div>`;
      }).join('');

      // caller
      const ball = (n, big) => `<span class="ball ${big ? 'big' : ''}" style="--bc:${BALL_COLOR[B.letter(n)]}"><span><small>${B.letter(n)}</small>${n}</span></span>`;
      const recent = v.drawn.slice(-6, -1).reverse();
      const caller = `<div class="bg-caller glass">
        <div class="bg-now">${lastBall ? ball(lastBall, true) : `<span class="ball big empty"><span>${v.phase === 'between' ? '' : '…'}</span></span>`}
          <div><div class="tiny muted">${v.phase === 'between' ? 'Next round starting' : lastBall ? 'Last called' : 'Get ready'}</div>
          <div class="bg-callno">${lastBall ? label(lastBall) : v.phase === 'between' ? 'Shuffling the balls' : 'First ball coming up'}</div>
          <div class="tiny muted">${v.drawn.length} of 75 called</div></div></div>
        <div class="bg-recent" aria-label="Previous balls">${recent.map((n) => ball(n)).join('')}</div>
        <div class="row" style="gap:8px">
          ${this.guest ? '' : `<button class="btn btn-ghost btn-sm" data-act="bg-pause" ${v.phase === 'ended' ? 'disabled' : ''}>${this.paused ? App.icon('play') + 'Resume' : 'Pause'}</button>`}
          <button class="btn btn-quiet btn-sm" data-act="bg-board">${this.bg.board ? 'Hide' : 'Show'} called numbers</button>
        </div></div>`;

      // round header
      const header = `<div class="bg-round glass">
        ${App.patternGrid(p, 'lg')}
        <div><div class="tiny muted">Round ${v.roundIdx + 1} of ${v.rounds.length}${p === 'blackout' ? ', final round' : ''}</div>
          <div class="bg-pname">${P.name}</div>
