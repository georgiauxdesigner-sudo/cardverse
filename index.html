          <div class="small muted">${App.PATTERN_HINT[p]}. ${B.POINTS[p]} pts.</div>${p === 'any' ? '<div class="tiny muted bg-short">Diagonal, box of four, straight or corners</div>' : p === 'blackout' ? '<div class="tiny muted bg-short">Fill the whole card</div>' : ''}</div></div>`;

      // players
      const plates = v.seats.map((s, i) => {
        const co = this.callouts[i] && this.callouts[i].until > Date.now() ? `<span class="callout chow">${esc(this.callouts[i].text)}</span>` : '';
        const b = this.bubbles[i] && this.bubbles[i].until > Date.now() ? `<span class="speech">${esc(this.bubbles[i].text)}</span>` : '';
        return `<div class="bg-plate ${i === this.me ? 'me' : ''}">${b}${App.avatar(this.players[i].name, this.players[i].av, 'sm', this.players[i].photo)}<div><div class="nm">${App.flag(this.players[i].country, 'sm')}${esc(this.players[i].name)}${i === this.me ? ' (you)' : ''}</div><div class="sub"><b>${s.points}</b> pts, ${s.wins} won</div></div>${co}</div>`;
      }).join('');

      // my cards
      let anyReady = false;
      const cards = me.cards.map((card, ci) => {
        const done = B.completed(card, v.drawn, p);
        const daubDone = BINGO_DONE(card, markedList(ci, card), p);
        if (live && daubDone) anyReady = true;
        const winSet = daubDone ? new Set(daubDone) : null;
        const target = P.sets.length === 1 ? new Set(P.sets[0]) : null;
        const togo = B.toGo(card, v.drawn, p);
        const cells = card.map((n, i) => {
          const m = marked(ci, n);
          const cls = [m ? 'm' : '', n === lastBall ? 'last' : '', winSet && winSet.has(i) ? 'win' : '', target && target.has(i) && !m ? 'tgt' : '', n === 0 ? 'free' : ''].join(' ');
          return `<button class="cell ${cls}" data-act="bg-cell" data-arg="${ci}:${n}" aria-label="${n ? label(n) : 'Free'}${m ? ', marked' : ''}">${n || 'FREE'}</button>`;
        }).join('');
        const note = !live ? '' : daubDone ? '<b style="color:var(--accent)">Bingo! Press the button</b>' : done && !this.bg.auto ? 'Check your card' : togo === 1 ? '1 to go' : `${togo} to go`;
        return `<div class="bcard ${daubDone && live ? 'ready' : ''}"><div class="bhead">${'BINGO'.split('').map((l) => `<span>${l}</span>`).join('')}</div><div class="bgrid">${cells}</div><div class="bnote tiny">Card ${ci + 1}${note ? `, ${note}` : ''}</div></div>`;
      }).join('');

      // overlay banners
      let overlay = '';
      if (v.phase === 'claimed') {
        overlay = `<div class="round-banner"><span class="tiny muted">Checking the card…</span><b>BINGO! ${v.claims.map((c) => esc(this.players[c.seat].name)).join(' & ')}</b><span class="small muted">Anyone else with ${p === 'any' ? 'a pattern' : P.name.toLowerCase()} can still call it before the next ball.</span></div>`;
      } else if (v.phase === 'between' && v.results.length) {
        const r = v.results[v.results.length - 1];
        overlay = `<div class="round-banner"><span class="tiny muted">Round ${r.n}: ${B.PATTERNS[r.pattern].name}</span><b>${r.winners.length ? r.winners.map((s) => esc(this.players[s].name) + (s === this.me ? ' (you)' : '') + (r.pattern === 'any' && r.made && r.made[s] ? ` (${B.PATTERNS[r.made[s]].name.toLowerCase()})` : '')).join(' & ') + ` win${r.winners.length === 1 ? 's' : ''} ${r.share} pts` : 'No winner'}</b><span class="small muted">Bingo on ball ${r.balls}${r.lastBall ? `, ${label(r.lastBall)}` : ''}. Next: ${B.PATTERNS[v.rounds[r.n]].name}.</span></div>`;
      }

      // called board
      const board = this.bg.board ? `<div class="bg-board glass">${'BINGO'.split('').map((l, c) => `<div class="brow"><span class="bl" style="color:${BALL_COLOR[l]}">${l}</span>${Array.from({ length: 15 }, (_, k) => { const n = c * 15 + k + 1; return `<span class="bn ${drawn.has(n) ? 'on' : ''} ${n === lastBall ? 'last' : ''}">${n}</span>`; }).join('')}</div>`).join('')}</div>` : '';

      const iClaimed = v.claims.some((c) => c.seat === this.me);
      const claimBtn = `<button class="btn btn-accent btn-lg bingo-btn ${anyReady && !iClaimed ? 'ready' : ''}" data-act="bg-claim" ${live && !iClaimed ? '' : 'disabled'}>${iClaimed ? 'Bingo called' : 'BINGO!'}</button>`;
      const auto = `<label class="row tiny" style="gap:8px;cursor:pointer"><button class="toggle ${this.bg.auto ? 'on' : ''}" data-act="bg-auto" aria-pressed="${this.bg.auto}" aria-label="Auto-mark called numbers"></button>Auto-mark</label>`
        + (App.Voice.ok ? `<label class="row tiny" style="gap:8px;cursor:pointer"><button class="toggle ${App.data.settings.voice !== false ? 'on' : ''}" data-act="bg-voice" aria-pressed="${App.data.settings.voice !== false}" aria-label="Read numbers aloud"></button>Voice</label>` : '');

      return `
        <div class="game-bar">
          <button class="icon-btn" data-act="leave" aria-label="Leave game">${App.icon('back')}</button>
          <h2>${g.name}</h2>${this.online ? `<span class="pill net" title="Room code">${App.Online.code || 'Online'}</span>` : '<span class="pill sim">Bots</span>'}${this.paused ? '<span class="pill soon">Paused</span>' : ''}
          <span class="grow"></span>
          <button class="icon-btn" data-act="rules" data-arg="bingo" aria-label="Rules">${App.icon('info')}</button>
          <button class="icon-btn" data-act="sound" aria-label="Toggle sound">${App.icon(App.data.settings.sound ? 'sound' : 'mute')}</button>
          <button class="icon-btn mobile-only" data-act="togglefeed" aria-label="Chat and log">${App.icon('chat')}</button>
        </div>
        <div class="game-wrap bingo-wrap">
          <div class="bg-main">
            <div class="bg-lineup">${steps}</div>
            <div class="bg-top">${header}${caller}</div>
            <div class="bg-players">${plates}</div>
            <div class="bg-cardwrap">${overlay}<div class="bg-cards n${me.cards.length}">${cards}</div></div>
            <div class="bg-actions">${claimBtn}${auto}</div>
            ${board}
          </div>
          ${this.sidePanelHTML(v)}
        </div>`;
    },
  });

  // ------------------------------------------------------------- card picker + saved (alaga) cards
  const key = (c) => c.join(',');
  App.bpick = App.bpick || { fresh: [], chosen: [] };
  App.bingoFresh = (n = 6) => { App.bpick.fresh = Array.from({ length: n }, () => B.makeCard()); };
  App.alaga = () => (App.data.alaga || []).filter((c) => B.validCard(c));
  App.bingoChosen = (r) => {
    const n = (r && r.bgCards) || 2;
    return App.bpick.chosen.slice(0, n).map((c) => c.slice());
  };
  App.miniCard = (c, opts = {}) => `<div class="mcard ${opts.on ? 'on' : ''}" ${opts.attr || ''}>
      <div class="mhead">${'BINGO'.split('').map((l) => `<span>${l}</span>`).join('')}</div>
      <div class="mgrid">${c.map((n) => `<span class="${n ? '' : 'free'}">${n || '★'}</span>`).join('')}</div></div>`;
  App.bingoPickerHTML = (count) => {
    if (!App.bpick.fresh.length) App.bingoFresh();
    const al = App.alaga();
    const chosenKeys = App.bpick.chosen.map(key);
    const all = al.concat(App.bpick.fresh.filter((c) => !al.some((a) => key(a) === key(c))));
    const card = (c) => {
      const k = key(c), on = chosenKeys.includes(k), saved = al.some((a) => key(a) === k);
      return `<div class="pick ${on ? 'on' : ''}">
        ${App.miniCard(c, { on, attr: `data-act="bp-pick" data-arg="${k}" role="button" tabindex="0" aria-pressed="${on}" aria-label="Bingo card${on ? ', chosen' : ''}"` })}
        <button class="alaga ${saved ? 'saved' : ''}" data-act="bp-star" data-arg="${k}" aria-pressed="${saved}" title="${saved ? 'Remove from your alaga cards' : 'Keep this card (alaga)'}">${saved ? '★ Alaga' : '☆ Alaga'}</button></div>`;
    };
    return `<div class="picker">
      <div class="row between"><span class="lab small"><b>Choose your ${count === 1 ? 'card' : count + ' cards'}</b> <span class="muted">${App.bpick.chosen.length >= count ? 'Ready' : `${Math.min(App.bpick.chosen.length, count)} of ${count} chosen`}</span></span>
        <button class="btn btn-quiet btn-sm" data-act="bp-new">Show other cards</button></div>
      <div class="picks">${all.map(card).join('')}</div>
      <p class="tiny muted">Tap a card to play it. Tap ☆ Alaga to keep a card you like; kept cards stay here for every bingo night.${count > App.bpick.chosen.length ? ' Any card you don’t choose is dealt at random.' : ''}</p></div>`;
  };
  App.bingoPickAct = (act, arg, count) => {
    const all = App.alaga().concat(App.bpick.fresh);
    const c = all.find((x) => key(x) === arg);
    if (act === 'bp-new') { App.bingoFresh(); App.bpick.chosen = App.bpick.chosen.filter((x) => App.alaga().some((a) => key(a) === key(x))); return; }
    if (!c) return;
    if (act === 'bp-pick') {
      const i = App.bpick.chosen.findIndex((x) => key(x) === arg);
      if (i >= 0) App.bpick.chosen.splice(i, 1);
      else { App.bpick.chosen.push(c.slice()); while (App.bpick.chosen.length > count) App.bpick.chosen.shift(); }
      App.sfx('select');
    }
    if (act === 'bp-star') {
      const al = App.data.alaga || [];
      const i = al.findIndex((x) => key(x) === arg);
      if (i >= 0) { al.splice(i, 1); App.toast('Removed from your alaga cards.'); }
      else if (al.length >= 12) { App.toast('You can keep up to 12 alaga cards. Remove one first.', 'bad'); return; }
      else { al.push(c.slice()); App.toast('Card kept. It’ll be here every bingo night.'); }
      App.data.alaga = al; App.save();
    }
  };

  // completed set using only the numbers this player has marked
  function BINGO_DONE(card, markedNums, p) {
    const set = new Set(markedNums);
    return B.PATTERNS[p].sets.find((s) => s.every((i) => card[i] === 0 || set.has(card[i]))) || null;
  }
})();
</script>
<script>/* DeckFlix online layer
 * - Transport: Supabase Realtime broadcast (production) or BroadcastChannel (same-device testing)
 * - Online: invite-code rooms. The host's device runs the authoritative engine and sends each
 *   player only their own view over a private channel, so nobody receives another player's cards.
 * - Rank: real rankings from finished games (Supabase table), or this device only when offline.
 * - Voice: spoken bingo calls. Photo: profile picture resize.
 */
(function () {
  'use strict';
  const App = window.App, CV = window.CV, $ = App.$, esc = App.esc;
  const CFG = () => window.CV_CONFIG || {};
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'p' + Math.random().toString(36).slice(2) + Date.now().toString(36));
  const rid = (n = 10) => Array.from({ length: n }, () => 'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 32)]).join('');

  // ------------------------------------------------------------------ transport
  let client = null;
  const Net = (App.Net = {
    mode() {
      const c = CFG();
      if (c.transport === 'local') return 'local';
      if (c.supabaseUrl && c.supabaseAnonKey && window.supabase && window.supabase.createClient) return 'supabase';
      return null;
    },
    available() { return !!Net.mode(); },
    client() {
      if (Net.mode() !== 'supabase') return null;
      if (!client) client = window.supabase.createClient(CFG().supabaseUrl, CFG().supabaseAnonKey, { realtime: { params: { eventsPerSecond: 40 } } });
      return client;
    },
    open(name) { return Net.mode() === 'local' ? new LocalTransport(name) : new SupaTransport(Net.client(), name); },
  });
  class LocalTransport {
    constructor(name) { this.bc = new BroadcastChannel('cvnet:' + name); this.hs = []; this.bc.onmessage = (e) => this.hs.forEach((h) => h(e.data)); }
    ready() { return Promise.resolve(); }
    on(fn) { this.hs.push(fn); }
    send(msg) { try { this.bc.postMessage(msg); } catch (e) { console.warn(e); } }
    close() { this.bc.close(); }
  }
  class SupaTransport {
    constructor(c, name) {
      this.c = c; this.hs = [];
      this.ch = c.channel('cv:' + name, { config: { broadcast: { self: false, ack: false } } });
      this.ch.on('broadcast', { event: 'm' }, (e) => this.hs.forEach((h) => h(e.payload)));
      this.p = new Promise((res, rej) => this.ch.subscribe((s) => { if (s === 'SUBSCRIBED') res(); else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') rej(new Error(s)); }));
    }
    ready() { return this.p; }
    on(fn) { this.hs.push(fn); }
    send(msg) { return this.ch.send({ type: 'broadcast', event: 'm', payload: msg }).catch((e) => console.warn('send failed', e)); }
    close() { try { this.c.removeChannel(this.ch); } catch (e) { /* closed */ } }
  }

  // ------------------------------------------------------------------ remote authority (guest side)
  class RemoteAuthority {
    constructor(gameId) { this.engine = CV.ENGINES[gameId]; this.latest = null; this.state = null; this.listeners = []; }
    view() { return this.latest; }
    submit(seat, action) { Online.sendAction(action); return { ok: true, pending: true }; }
    advance() {}
    onChange(f) { this.listeners.push(f); }
  }
  App.RemoteAuthority = RemoteAuthority;

  // trim what goes over the wire
  function netView(v) {
    if (!v) return v;
    if (v.game === 'inbetween' && v.phase !== 'ended' && v.log && v.log.length > 80) v.log = v.log.slice(-80);
    if (v.game === 'inbetween' && v.phase === 'ended' && v.log && v.log.length > 800) v.log = v.log.slice(-800);
    return v;
  }

  // ------------------------------------------------------------------ rooms
  const Online = (App.Online = {
    role: null, // 'host' | 'guest'
    code: null, room: null, members: [], status: 'idle', started: false, matchId: null,
    me() {
      if (!App.data.pid) { App.data.pid = uid(); App.save(); }
      const u = App.data.user;
      return { id: App.data.pid, name: u.name, av: u.avatar, photo: u.photo || null, loc: App.locText(u), country: u.country || '' };
    },
    inRoom() { return !!this.role; },
    shareLink() {
      const base = location.origin && location.origin !== 'null' ? location.origin + location.pathname : '';
      return `${base}#join-${this.code}`;
    },

    // ---------------------------------------------------------- host
    async host(room) {
      if (!Net.available()) throw new Error('offline');
      if (this.role) this.close(true);
      this.role = 'host'; this.room = room; this.code = room.code; this.members = []; this.started = false; this.status = 'connecting';
      this.main = Net.open(this.code); this.priv = {};
      this.main.on((m) => this.hostMsg(m));
      try { await this.main.ready(); } catch (e) { this.close(true); throw e; }
      this.status = 'open';
      this.hostLobby();
      this.hbTimer = setInterval(() => this.hostTick(), 4000);
      return this.code;
    },
    seatsFor(room) { return App.roomSeats(room); },
    publicMembers() { return this.members.map((m) => ({ id: m.id, name: m.name, av: m.av, photo: m.photo, loc: m.loc, country: m.country, ready: m.ready, gone: m.gone })); },
    hostLobby() {
      if (this.role !== 'host') return;
      const me = this.me();
      this.main.send({ t: 'lobby', code: this.code, started: this.started, matchId: this.matchId, room: this.roomSummary(), host: { id: me.id, name: me.name, av: me.av, photo: me.photo, loc: me.loc, country: me.country, ready: !!(App.room && App.room.ready) }, members: this.publicMembers() });
    },
    roomSummary() {
      const r = App.room || this.room;
      return { game: r.game, seats: this.seatsFor(r), sWin: r.sWin, sStart: r.sStart, rAce: r.rAce, rPost: r.rPost, rPair: r.rPair, rMax: r.rMax, rMode: r.rMode, rScore: r.rScore, rAnte: r.rAnte, bgCards: r.bgCards || 2, bgRounds: r.bgRounds || 5, pace: r.pace };
    },
    hostMsg(m) {
      if (!m || !m.t) return;
      const mem = this.members.find((x) => x.id === m.id);
      if (mem) { mem.seen = Date.now(); if (mem.gone && m.t !== 'bye') this.memberBack(mem); }
      switch (m.t) {
        case 'hello': {
          if (mem) { // rejoin or repeated hello
            mem.token = m.token; mem.name = m.name; mem.av = m.av; mem.photo = Online.cleanPhoto(m.photo); mem.loc = String(m.loc || '').slice(0, 82); mem.country = String(m.country || '').slice(0, 40);
            this.openPriv(mem);
            this.hostLobby();
            if (this.started && App.match && App.match.host) { this.sendStart(mem); setTimeout(() => this.sendViews(null), 300); }
            return;
          }
          if (this.started) return this.main.send({ t: 'busy', id: m.id });
          const r = App.room || this.room;
          if (this.members.length + 1 >= this.seatsFor(r)) return this.main.send({ t: 'full', id: m.id });
          const nm = { id: m.id, name: String(m.name || 'Player').slice(0, 16), av: m.av | 0, photo: Online.cleanPhoto(m.photo), loc: String(m.loc || '').slice(0, 82), country: String(m.country || '').slice(0, 40), token: m.token, ready: false, seen: Date.now(), cards: null };
          this.members.push(nm); this.openPriv(nm);
          App.toast(`${nm.name} joined your room.`); App.sfx('turn');
          this.hostLobby(); this.refreshRooms();
          return;
        }
        case 'ready': if (mem) { mem.ready = !!m.ready; mem.cards = CV.Bingo.validCards(m.cards) ? m.cards : null; this.hostLobby(); this.refreshRooms(); } return;
        case 'ping':
        case 'sync':
          if (m.t === 'sync' && mem && this.started && App.match && App.match.host) this.sendViewTo(mem);
          return;
        case 'bye': if (mem) this.memberLeft(mem); return;
        case 'act': {
          if (!mem || !App.match || !App.match.host || m.matchId !== this.matchId) return;
          const seat = App.match.players.findIndex((p) => p.id === mem.id);
          if (seat < 0) return;
          App.match.remoteAction(seat, m.a, (err) => this.priv[mem.id] && this.priv[mem.id].send({ t: 'err', msg: err }));
          return;
        }
        case 'chat': case 'emo': if (App.match && App.match.online) App.match.netChat(m); return;
      }
    },
    openPriv(mem) {
      if (this.priv[mem.id]) { if (this.priv[mem.id]._token === mem.token) return; this.priv[mem.id].close(); }
      const ch = Net.open(this.code + ':' + mem.token); ch._token = mem.token;
      this.priv[mem.id] = ch;
    },
    hostTick() {
      if (this.role !== 'host') return;
      const now = Date.now();
      this.main.send({ t: 'hb', started: this.started, matchId: this.matchId });
      if (!this.started) this.hostLobby();
      for (const mem of this.members) {
        if (!mem.gone && now - mem.seen > 25000) {
          if (this.started) this.memberGone(mem, 'lost connection');
          else this.memberLeft(mem);
        }
      }
    },
    memberGone(mem, why) {
      mem.gone = true;
      const m = App.match;
      if (m && m.host) {
        const seat = m.players.findIndex((p) => p.id === mem.id);
        if (seat >= 0) { m.players[seat].bot = true; m.players[seat].away = true; App.toast(`${mem.name} ${why}. A bot is playing for them.`); m.after(); }
      }
      this.hostLobby();
    },
    memberBack(mem) {
      mem.gone = false;
      const m = App.match;
      if (m && m.host) {
        const seat = m.players.findIndex((p) => p.id === mem.id);
        if (seat >= 0 && m.players[seat].away) { m.players[seat].bot = false; m.players[seat].away = false; App.toast(`${mem.name} is back.`); m.render(); }
      }
    },
    memberLeft(mem) {
      if (this.started) return this.memberGone(mem, 'left');
      this.members = this.members.filter((x) => x !== mem);
      if (this.priv[mem.id]) { this.priv[mem.id].close(); delete this.priv[mem.id]; }
      App.toast(`${mem.name} left the room.`);
      this.hostLobby(); this.refreshRooms();
    },
    refreshRooms() { if ((location.hash || '').slice(1) === 'rooms' && !App.match) App.route(); },
    allReady() { return this.members.every((m) => m.ready); },

    // host starts (or restarts) the online match
    start(gameId, opts) {
      const me = this.me();
      const r = App.room || this.room;
      const seats = this.seatsFor(r);
      if (this.members.length + 1 > seats) throw new Error(`${App.game(gameId).name} has room for ${seats} players.`);
      const players = [{ id: me.id, name: me.name, av: me.av, photo: me.photo, country: me.country, bot: false, cards: opts.myCards || null }]
        .concat(this.members.map((m) => ({ id: m.id, name: m.name, av: m.av, photo: m.photo, country: m.country, bot: !!m.gone, remote: true, away: !!m.gone, cards: m.cards })));
      App.BOTS.forEach(([b, av]) => { if (players.length < seats) players.push({ id: 'bot-' + b, name: b, av, bot: true }); });
      this.matchId = rid(8); this.started = true;
      this.gameId = gameId; this.opts = opts;
      const m = App.startMatch(gameId, Object.assign({}, opts, { online: true, role: 'host', players, mySeat: 0, matchId: this.matchId }));
      this.members.forEach((mem) => this.sendStart(mem));
      setTimeout(() => this.sendViews(null), 250);
      return m;
    },
    sendStart(mem) {
      const m = App.match; if (!m) return;
      const seat = m.players.findIndex((p) => p.id === mem.id);
      this.main.send({
        t: 'start', to: mem.id, seat, matchId: this.matchId, game: m.gameId,
        opts: { pace: m.opts.pace, session: m.opts.session, winRounds: m.opts.winRounds, scoring: m.opts.scoring, rules: m.opts.rules, cardsEach: m.opts.cardsEach, roundCount: m.opts.roundCount, room: m.opts.room },
        players: m.players.map((p) => ({ id: p.id, name: p.name, av: p.av, photo: p.photo, country: p.country || '', bot: p.bot && !p.away })),
      });
    },
    // called after every authoritative change
    sendViews(ev) {
      const m = App.match; if (!m || !m.host || this.role !== 'host') return;
      m.players.forEach((p, seat) => {
        if (!p.remote) return;
        const ch = this.priv[p.id]; if (!ch) return;
        ch.send({ t: 'view', matchId: this.matchId, seat, view: netView(m.auth.view(seat)), ev });
      });
    },
    sendViewTo(mem) {
      const m = App.match; if (!m || !m.host) return;
      const seat = m.players.findIndex((p) => p.id === mem.id);
      const ch = this.priv[mem.id];
      if (seat >= 0 && ch) ch.send({ t: 'view', matchId: this.matchId, seat, view: netView(m.auth.view(seat)), ev: null });
    },
    rematch() {
      const m = App.match; if (!m) return;
      const opts = Object.assign({}, this.opts);
      if (m.gameId === 'tongits' && m.v().result) opts.dealer = m.v().result.winners[0];
      this.start(m.gameId, opts);
    },
    backToLobby() { this.started = false; this.matchId = null; this.hostLobby(); },

    // ---------------------------------------------------------- guest
    async join(code) {
      code = String(code || '').trim().toUpperCase();
      if (!/^[A-Z0-9]{5}$/.test(code)) throw new Error('Room codes are 5 letters or numbers.');
      if (!Net.available()) throw new Error('offline');
      if (this.role) this.close(true);
      this.role = 'guest'; this.code = code; this.status = 'joining'; this.lobby = null; this.started = false; this.matchId = null;
      this.token = (App.data.tokens && App.data.tokens[code]) || rid(16);
      App.data.tokens = Object.assign({}, App.data.tokens, { [code]: this.token }); App.save();
      this.main = Net.open(code); this.mine = Net.open(code + ':' + this.token);
      this.main.on((m) => this.guestMsg(m)); this.mine.on((m) => this.guestMsg(m, true));
      try { await Promise.all([this.main.ready(), this.mine.ready()]); } catch (e) { this.close(true); throw e; }
      this.myReady = false; this.lastHost = 0;
      App.data.lastRoom = { code, at: Date.now() }; App.save();
      const me = this.me();
      const hello = () => this.main.send({ t: 'hello', id: me.id, name: me.name, av: me.av, photo: me.photo, loc: me.loc, country: me.country, token: this.token });
      hello();
      return new Promise((resolve, reject) => {
        let tries = 0;
        this.helloTimer = setInterval(() => {
          if (this.lobby) { clearInterval(this.helloTimer); return resolve(this.lobby); }
          if (this.status === 'full') { clearInterval(this.helloTimer); this.close(true); return reject(new Error('That room is full.')); }
          if (this.status === 'busy') { clearInterval(this.helloTimer); this.close(true); return reject(new Error('That room has already started a game. Ask the host to let you in after this round.')); }
          if (++tries > 12) { clearInterval(this.helloTimer); this.close(true); return reject(new Error(`Room ${code} wasn’t found. Check the code, and make sure the host has the room open.`)); }
          hello();
        }, 700);
        this.pingTimer = setInterval(() => {
          this.main.send({ t: 'ping', id: me.id });
          if (App.match && App.match.guest && !App.match.auth.latest && this.matchId) this.main.send({ t: 'sync', id: me.id, matchId: this.matchId });
          if (this.lobby && Date.now() - this.lastHost > 22000) this.hostLost();
        }, 4000);
      });
    },
    guestMsg(m, priv) {
      if (!m || !m.t) return;
      const me = App.data.pid;
      if (['lobby', 'hb', 'start', 'end'].includes(m.t)) this.lastHost = Date.now();
      switch (m.t) {
        case 'lobby': {
          const wasStarted = this.started;
          this.lobby = m; this.started = m.started;
          if (!m.members.some((x) => x.id === me)) return; // not admitted yet
          this.status = 'in';
          return;
        }
        case 'full': if (m.id === me) this.status = 'full'; return;
        case 'busy': if (m.id === me) this.status = 'busy'; return;
        case 'start': {
          if (m.to && m.to !== me) return;
          this.matchId = m.matchId; this.started = true;
          if (App.match && App.match.guest && App.match.opts.matchId === m.matchId) return;
          App.closeModal();
          App.startMatch(m.game, Object.assign({}, m.opts, { online: true, role: 'guest', players: m.players, mySeat: m.seat, matchId: m.matchId }));
          this.main.send({ t: 'sync', id: me, matchId: m.matchId }); // ask for the table in case it raced ahead of this message
          return;
        }
        case 'view': {
          if (!priv || m.matchId !== this.matchId || !App.match || !App.match.guest) return;
          this.lastHost = Date.now();
          App.match.receiveView(m.view, m.ev);
          return;
        }
        case 'err': if (priv) { App.sfx('error'); App.toast(m.msg, 'bad'); } return;
        case 'chat': case 'emo': if (App.match && App.match.online && m.id !== me) App.match.netChat(m); return;
        case 'end':
          delete App.data.lastRoom; App.save();
          this.close(true);
          if (App.match) App.match.destroy();
          App.match = null;
          App.modal(`<h2>The host closed the room</h2><p class="muted" style="margin:10px 0 20px">${esc(m.reason || 'The game has ended.')}</p><button class="btn btn-primary" data-act="tolobby">Back to lobby</button>`);
          return;
      }
    },
    hostLost() {
      if (this.role !== 'guest' || this.lostShown) return;
      this.lostShown = true;
      App.modal(`<h2>Lost connection to the host</h2><p class="muted" style="margin:10px 0 20px">We haven’t heard from the host for a while. They may have closed the app or lost signal.</p><div class="row"><button class="btn btn-primary" data-act="rejoin">Try again</button><button class="btn btn-ghost" data-act="leaveroom">Leave room</button></div>`);
    },
    setReady(ready, cards) {
      this.myReady = ready;
      this.main.send({ t: 'ready', id: App.data.pid, ready, cards: cards || null });
    },
    sendAction(a) { this.main.send({ t: 'act', id: App.data.pid, matchId: this.matchId, a }); },
    chat(kind, text) {
      const msg = { t: kind, id: App.data.pid, text };
      if (this.role === 'host') this.main.send(msg); else this.main.send(msg);
    },

    // ---------------------------------------------------------- leave / close
    close(silent) {
      clearInterval(this.hbTimer); clearInterval(this.pingTimer); clearInterval(this.helloTimer);
      if (this.role === 'host' && this.main && !silent) this.main.send({ t: 'end', reason: 'The host closed the room.' });
      if (this.role === 'guest' && this.main && !silent) this.main.send({ t: 'bye', id: App.data.pid });
      if (!silent && App.data.lastRoom) { delete App.data.lastRoom; App.save(); }
      try { this.main && this.main.close(); this.mine && this.mine.close(); Object.values(this.priv || {}).forEach((c) => c.close()); } catch (e) { /* closed */ }
      Object.assign(this, { role: null, code: null, main: null, mine: null, priv: {}, members: [], lobby: null, status: 'idle', started: false, matchId: null, lostShown: false });
    },
    cleanPhoto(p) { return typeof p === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p) && p.length < 24000 ? p : null; },
  });
  window.addEventListener('beforeunload', () => { if (Online.role === 'guest') Online.main && Online.main.send({ t: 'bye', id: App.data.pid }); });

  // ------------------------------------------------------------------ rankings
  const POINTS = (wins, games) => wins * 25 + games * 5;
  const Rank = (App.Rank = {
    online() { return Net.mode() === 'supabase'; },
    since(period) { return { daily: Date.now() - 86400000, weekly: Date.now() - 7 * 86400000, alltime: 0 }[period]; },
    async saveProfile() {
      if (!this.online() || !App.data.user) return;
      const u = App.data.user;
      try { await Net.client().from('cv_players').upsert({ player_id: Online.me().id, name: u.name, avatar: u.avatar | 0, photo: u.photo || null, city: u.city || null, country: u.country || null, updated_at: new Date().toISOString() }); } catch (e) { console.warn('profile save failed', e); }
    },
    async submit(entry) {
      if (!this.online()) return;
      const c = Net.client(); const u = App.data.user; const pid = Online.me().id;
      try {
        await this.saveProfile();
        await c.from('cv_results').insert({ player_id: pid, name: u.name, avatar: u.avatar | 0, game: entry.game, won: !!entry.won, online: !!entry.online });
      } catch (e) { console.warn('ranking submit failed', e); }
    },
    // returns [{id, name, av, photo, games, wins, rate, points, you}] sorted, or [] when nobody has played
    async load(period, game) {
      const myId = App.data.pid;
      if (!this.online()) {
        const since = this.since(period);
        const h = App.data.history.filter((m) => m.at >= since && (!game || game === 'all' || m.game === game));
        if (!h.length) return { rows: [], scope: 'device' };
        const wins = h.filter((m) => m.won).length; const u = App.data.user;
        return { scope: 'device', rows: [{ id: myId, name: u.name, av: u.avatar, photo: u.photo, loc: App.locText(u), country: u.country, games: h.length, wins, rate: Math.round((wins / h.length) * 100), points: POINTS(wins, h.length), you: true, rank: 1 }] };
      }
      const c = Net.client();
      let q = c.from('cv_results').select('player_id,name,avatar,game,won,played_at').order('played_at', { ascending: false }).limit(20000);
      if (period !== 'alltime') q = q.gte('played_at', new Date(this.since(period)).toISOString());
      if (game && game !== 'all') q = q.eq('game', game);
      const { data, error } = await q;
      if (error) throw error;
      const by = new Map();
      for (const r of data || []) {
        let p = by.get(r.player_id);
        if (!p) { p = { id: r.player_id, name: r.name, av: r.avatar, games: 0, wins: 0 }; by.set(r.player_id, p); }
        p.games++; if (r.won) p.wins++;
      }
      const ids = [...by.keys()];
      if (ids.length) {
        const { data: ps } = await c.from('cv_players').select('player_id,name,avatar,photo,city,country').in('player_id', ids.slice(0, 500));
        (ps || []).forEach((x) => { const p = by.get(x.player_id); if (p) { p.name = x.name; p.av = x.avatar; p.photo = x.photo; p.loc = App.locText(x); p.country = x.country; } });
      }
      const rows = [...by.values()].map((p) => ({ ...p, rate: Math.round((p.wins / p.games) * 100), points: POINTS(p.wins, p.games), you: p.id === myId }));
      rows.sort((a, b) => b.points - a.points || b.wins - a.wins || a.games - b.games || a.name.localeCompare(b.name));
      rows.forEach((r, i) => { r.rank = i && rows[i - 1].points === r.points && rows[i - 1].wins === r.wins && rows[i - 1].games === r.games ? rows[i - 1].rank : i + 1; });
      return { rows, scope: 'everyone' };
    },
  });

  // players online right now (Supabase presence)
  const Presence = (App.Presence = {
    count: null,
    start() {
      if (Net.mode() !== 'supabase' || this.ch || !App.data.user) return;
      const c = Net.client();
      this.ch = c.channel('cv:presence', { config: { presence: { key: Online.me().id } } });
      this.ch.on('presence', { event: 'sync' }, () => {
        this.count = Object.keys(this.ch.presenceState()).length;
        const el = document.getElementById('online-count'); if (el) el.textContent = this.count;
      });
      this.ch.subscribe((s) => { if (s === 'SUBSCRIBED') this.ch.track({ at: Date.now() }); });
    },
  });

  // ------------------------------------------------------------------ voice caller
  const Voice = (App.Voice = {
    ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
    unlocked: false,
    pickVoice() {
      if (!this.ok) return null;
      const vs = speechSynthesis.getVoices();
      return vs.find((v) => /en-PH|fil/i.test(v.lang)) || vs.find((v) => /^en-(US|GB|AU)/i.test(v.lang) && /female|samantha|google/i.test(v.name)) || vs.find((v) => /^en/i.test(v.lang)) || null;
    },
    unlock() {
      if (!this.ok || this.unlocked) return;
      this.unlocked = true;
      try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
    },
    enabled() { return this.ok && App.data.settings.sound && App.data.settings.voice !== false; },
    // say a bingo ball, repeated (default 3 times like a hall caller)
    callBall(n, times = 3) {
      if (!this.enabled()) return 0;
      try {
        speechSynthesis.cancel();
        const letter = CV.Bingo.letter(n);
        const voice = this.pickVoice();
        for (let i = 0; i < times; i++) {
          const u = new SpeechSynthesisUtterance(`${letter}, ${n}.`);
          if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
          u.rate = 0.92; u.pitch = 1; u.volume = 1;
          speechSynthesis.speak(u);
        }
        return times * 1500; // rough length, used to pace the next ball
      } catch (e) { return 0; }
    },
    speaking() { return this.ok && speechSynthesis.speaking; },
  });

  // ------------------------------------------------------------------ profile photo
  App.Photo = {
    // read an image file, crop to a centred square, resize to 112px JPEG (~5 KB)
    fromFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\//.test(file.type)) return reject(new Error('Choose an image file.'));
        if (file.size > 15 * 1024 * 1024) return reject(new Error('That image is too large. Pick one under 15 MB.'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const s = Math.min(img.naturalWidth, img.naturalHeight);
          const cv = document.createElement('canvas'); cv.width = cv.height = 112;
          const ctx = cv.getContext('2d');
          ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 112, 112);
          URL.revokeObjectURL(url);
          let q = 0.78, out = cv.toDataURL('image/jpeg', q);
          while (out.length > 16000 && q > 0.4) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
          resolve(out);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image couldn’t be read. Try a JPG or PNG.')); };
        img.src = url;
      });
    },
  };
})();
</script>
<script>/* DeckFlix online rooms UI: invite panel (host), waiting room (guest), joining */
(function () {
  'use strict';
  const App = window.App, $ = App.$, esc = App.esc;
  const O = App.Online;

  // re-render the current page without jumping to the top
  App.softRender = () => {
    if (App.match) return;
    const h = (location.hash || '#lobby').slice(1);
    if (App.pages[h] && $('#view')) $('#view').innerHTML = App.pages[h]();
  };
  O.refreshRooms = () => { const h = (location.hash || '').slice(1); if (h === 'rooms' || h === 'room') App.softRender(); };

  const inviteText = () => `Join my DeckFlix room! Code: ${O.code}\n${O.shareLink()}`;

  // ------------------------------------------------------------- host panel on the Rooms page
  App.onlinePanel = (r) => {
    const join = `<div class="glass panel stack">
        <h3>Join a friend’s room</h3>
        <form class="row" data-form="join" style="flex-wrap:nowrap"><input class="input" name="code" maxlength="5" placeholder="Enter code" aria-label="Room code" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em"><button class="btn btn-ghost">Join</button></form>
        <div id="joinmsg"></div>
      </div>`;
    if (!App.Net.available()) {
      return `<div class="glass panel stack">
          <div class="row between"><h3>Invite friends</h3><span class="pill soon">Online only</span></div>
          <p class="small muted">${window.CV_CONFIG ? 'Online rooms aren’t switched on yet: the site still needs its Supabase settings (see the setup guide). Until then you can play with bots.' : 'Room codes work on the published DeckFlix site. This preview can’t connect to the internet, so here you play with bots.'}</p>
        </div>${join}`;
    }
    if (O.role !== 'host') {
      return `<div class="glass panel stack">
          <div class="row between"><h3>Invite friends</h3><span class="pill net">Online</span></div>
          <p class="small muted">Open this room to get a code. Friends enter it, or tap your link, and take the empty seats.</p>
          <button class="btn btn-primary" data-act="invite">${App.icon('link')}Open room and get a code</button>
          ${O.status === 'connecting' ? '<span class="tiny muted">Connecting…</span>' : ''}
        </div>${join}`;
    }
    const joined = O.members.length;
    return `<div class="glass panel stack invite-card">
        <div class="row between"><h3>Your room is open</h3><span class="pill net">Online</span></div>
        <div class="code" aria-label="Room code">${O.code}</div>
        <p class="small muted">${joined ? `${joined} friend${joined === 1 ? '' : 's'} joined.` : 'Send the code or link. Friends who join show up in the player list.'}</p>
        <div class="row">
          <button class="btn btn-primary btn-sm" data-act="copyinvite">Copy invite</button>
          ${navigator.share ? '<button class="btn btn-ghost btn-sm" data-act="shareinvite">Share</button>' : ''}
          <button class="btn btn-quiet btn-sm" data-act="closeroom">Close room</button>
        </div>
        <p class="tiny muted">Keep DeckFlix open while you play: your device runs the table for everyone.</p>
      </div>`;
  };

  // ------------------------------------------------------------- guest waiting room
  App.pages.room = () => {
    if (O.role !== 'guest') {
      return `${App.topbar('Join a room')}
        <div class="glass panel stack" style="max-width:520px">
          <p class="small muted">Enter the 5-letter code your friend sent you.</p>
          <form class="row" data-form="join" style="flex-wrap:nowrap"><input class="input" name="code" maxlength="5" placeholder="Code" aria-label="Room code" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em"><button class="btn btn-primary">Join</button></form>
          <div id="joinmsg">${App.joinError ? `<div class="note warn">${esc(App.joinError)}</div>` : ''}</div>
        </div>`;
    }
    const L = O.lobby;
    if (!L || O.status === 'joining') {
      return `${App.topbar('Joining room ' + esc(O.code || ''))}<div class="empty">Connecting to the host…<br><button class="btn btn-ghost btn-sm" data-act="leaveroom">Cancel</button></div>`;
    }
    const r = L.room, g = App.game(r.game);
    const seats = r.seats;
    const me = App.data.pid;
    const meM = L.members.find((m) => m.id === me) || {};
    const ready = !!meM.ready;
    const people = [Object.assign({ host: true }, L.host)].concat(L.members);
    const bots = Math.max(0, seats - people.length);
    const summary = {
      inbetween: `Grand Champion session: ${r.sStart} starting points, first to ${r.sWin} winning rounds. Ace ${r.rAce === 'low' ? 'low (1)' : 'high (14)'}, post pays ${r.rPost === 3 ? 'triple' : 'double'}.`,
      tongits: '3 players. Draw, chow, meld and sapaw. No time limit.',
      pusoydos: '4 players, 13 cards each. 3♣ leads. No time limit.',
      bingo: `${r.bgRounds || 5} round${(r.bgRounds || 5) === 1 ? '' : 's'}: any pattern wins, the last is punuan. ${r.bgCards} card${r.bgCards === 1 ? '' : 's'} each.`,
    }[r.game] || '';
    const inGame = App.match && App.match.guest && !App.match.dead;
    return `${App.topbar(`${esc(L.host.name)}’s room`, `Room ${esc(O.code)}`)}
      <div class="rooms-grid">
        <section class="glass panel stack">
          <div class="row" style="gap:14px;flex-wrap:nowrap"><span class="thumb" style="width:96px;height:60px">${App.art(r.game)}</span><div><h2>${g.name}</h2><p class="small muted">${summary}</p></div></div>
          ${L.started ? `<div class="note">${inGame ? 'The game is on.' : 'A game is in progress. You’ll be seated when it starts again.'}</div>${inGame ? `<button class="btn btn-accent" data-act="backtotable">Back to the table</button>` : ''}` : ''}
          ${r.game === 'bingo' && !L.started ? App.bingoPickerHTML(r.bgCards || 2) : ''}
          <div class="field"><span class="lab">Players (${seats} seats)</span>
            <div class="seat-list">
              ${people.map((p) => `<div class="seat">${App.avatar(p.name, p.av, '', p.photo)}<span class="grow"><b>${esc(p.name)}${p.id === me ? ' (you)' : ''}</b> <span class="tiny muted">${p.host ? 'Host' : ''}</span>${p.loc ? `<br><span class="tiny muted loc">${App.flag(p.country)}${esc(p.loc)}</span>` : ''}</span><span class="ready ${p.ready ? 'y' : 'n'}">${p.ready ? 'Ready' : 'Not ready'}</span></div>`).join('')}
              ${bots ? `<div class="seat"><span class="grow muted small">${bots} empty seat${bots === 1 ? '' : 's'} will be filled by bots</span></div>` : ''}
            </div>
          </div>
          ${L.started ? '' : `<div class="row">
            <button class="btn ${ready ? 'btn-ghost' : 'btn-primary'}" data-act="guestready">${ready ? 'Cancel ready' : 'I’m ready'}</button>
            <span class="tiny muted">${ready ? 'Waiting for the host to start.' : 'Ready up so the host can start.'}</span>
          </div>`}
        </section>
        <aside class="stack">
          <div class="glass panel stack">
            <h3>Room ${esc(O.code)}</h3>
            <p class="small muted">The host’s device runs the table. If they leave, the game ends.</p>
            <button class="btn btn-quiet btn-sm" data-act="leaveroom" style="justify-self:start;color:var(--bad)">Leave room</button>
          </div>
        </aside>
      </div>`;
  };

  App.joinRoom = (code) => {
    App.joinError = null;
    App.softRender();
    O.join(code).then(() => {
      if (App.match && App.match.guest && !App.match.dead) return; // already back at the table
      if ((location.hash || '').slice(1) === 'room') App.softRender(); else location.hash = 'room';
      App.sfx('turn');
    })
      .catch((err) => { App.joinError = err.message === 'offline' ? 'Online play isn’t switched on in this copy of DeckFlix.' : err.message; if ((location.hash || '').slice(1) !== 'room') location.hash = 'room'; else App.softRender(); });
  };

  // a guest's lobby updates re-render the waiting room (only when something changed)
  let lastLobby = '';
  const origGuestMsg = O.guestMsg.bind(O);
  O.guestMsg = function (m, priv) {
    origGuestMsg(m, priv);
    if (m && m.t === 'lobby') {
      const sig = JSON.stringify([m.room, m.members, m.started, m.host && m.host.ready]);
      if (sig !== lastLobby) { lastLobby = sig; if ((location.hash || '').slice(1) === 'room') App.softRender(); }
    }
  };

  // ------------------------------------------------------------- actions
  const pickCount = () => {
    const h = (location.hash || '').slice(1);
    if (h === 'room' && O.lobby) return O.lobby.room.bgCards || 2;
    return (App.room && App.room.bgCards) || 2;
  };
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, arg = el.dataset.arg;
    App.Voice.unlock();
    switch (act) {
      case 'gorooms': App.room = App.room || App.newRoom(arg && arg !== 'all' ? arg : 'tongits'); if (arg && arg !== 'all') App.room.game = arg; location.hash = 'rooms'; break;
      case 'lbgame': App.setLbGame(arg); App.softRender(); break;
      case 'lbretry': App.fillLeaderboard(); break;
      case 'invite':
        try { O.status = 'connecting'; App.softRender(); await O.host(App.room); App.softRender(); App.sfx('turn'); }
        catch (err) { O.status = 'idle'; App.softRender(); App.toast('Couldn’t open the room. Check your connection and try again.', 'bad'); }
        break;
      case 'copyinvite':
        try { await navigator.clipboard.writeText(inviteText()); App.toast('Invite copied. Paste it in Messenger, Viber or anywhere.'); }
        catch (err) { App.modal(`<h2>Room ${O.code}</h2><p class="muted" style="margin:10px 0">Copy this and send it to your friends:</p><textarea class="input" rows="3" readonly style="width:100%">${esc(inviteText())}</textarea><div class="row" style="margin-top:14px"><button class="btn btn-ghost" data-close>Done</button></div>`); }
        break;
      case 'shareinvite':
        try { await navigator.share({ title: 'DeckFlix room ' + O.code, text: `Join my DeckFlix room! Code: ${O.code}`, url: O.shareLink() }); } catch (err) { /* cancelled */ }
        break;
      case 'closeroom': O.close(); App.softRender(); App.toast('Room closed.'); break;
      case 'leaveroom': App.closeModal(); if (App.match) { App.match.destroy(); App.match = null; } O.close(); App.joinError = null; location.hash = 'lobby'; break;
      case 'rejoin': { const c = O.code; App.closeModal(); O.close(true); location.hash = 'join-' + c; break; }
      case 'guestready': {
        const L = O.lobby; if (!L) break;
        const me = L.members.find((m) => m.id === App.data.pid) || {};
        const cards = L.room.game === 'bingo' ? App.bingoChosen({ bgCards: L.room.bgCards }) : null;
        O.setReady(!me.ready, cards && cards.length ? cards : null);
        App.sfx('select');
        break;
      }
      case 'backroom': location.hash = 'room'; break;
      case 'backtotable': if (App.match) location.hash = 'play-' + App.match.gameId; break;
      case 'bp-pick': case 'bp-star': case 'bp-new': {
        App.bingoPickAct(act, arg, pickCount());
        App.softRender();
        // keep the host's view of a ready guest's cards current
        if ((location.hash || '').slice(1) === 'room' && O.lobby) {
          const me = O.lobby.members.find((m) => m.id === App.data.pid);
          if (me && me.ready) O.setReady(true, App.bingoChosen({ bgCards: O.lobby.room.bgCards }));
        }
        if ((location.hash || '').slice(1) === 'profile' && !App.match) App.softRender();
        break;
      }
    }
  });
})();
</script>
<script>/* boot after every module has loaded */
(function () {
  'use strict';
  document.getElementById('app').innerHTML = App.shell();
  App.renderMeChip();
  // a friend who refreshes mid-game goes straight back to their seat
  const h = (location.hash || '').slice(1), lr = App.data.lastRoom;
  if (App.data.user && lr && Date.now() - lr.at < 3 * 3600000 && (h === 'room' || h.startsWith('play-')) && App.Net.available()) {
    location.hash = 'room'; App.joinRoom(lr.code);
  } else App.route();
  if (App.data.user) { App.Presence.start(); App.Rank.saveProfile(); }
})();
</script>
</body>
</html>
