}

/* settle up */
.settle { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.settle li { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
.settle li.mine-out { border-color: rgba(255,107,125,.35); background: rgba(255,107,125,.06); }
.settle li.mine-in { border-color: rgba(61,233,154,.35); background: rgba(61,233,154,.06); }
.settle-who { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.settle-who > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settle-arrow { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.settle-arrow svg { width: 16px; height: 16px; }
.settle-amt { font-family: var(--f-head); font-size: 18px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pot-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,138,50,.14); color: var(--accent); }
.pot-dot svg { width: 16px; height: 16px; }
.settle.compact li { padding: 7px 10px; gap: 8px; }
.settle.compact .settle-amt { font-size: 15px; }
.settle-rounds { margin-top: 16px; }
.settle-rounds summary { cursor: pointer; padding: 6px 0; }
.settle-round { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.settle-box { text-align: left; margin: 0 0 18px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.025); border: 1px solid var(--line); display: grid; gap: 10px; }
@media (max-width: 600px) {
  .settle li { grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "from amt" "to to"; row-gap: 6px; }
  .settle li > .settle-who.from { grid-area: from; }
  .settle li > .settle-arrow { display: none; }
  .settle li > .settle-who.to { grid-area: to; padding-left: 10px; color: var(--muted); font-weight: 500; font-size: 14px; }
  .settle li > .settle-who.to::before { content: attr(data-verb); margin-right: 2px; font-size: 12px; }
  .settle li > .settle-amt { grid-area: amt; }
}

#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 120; }

/* "any pattern" preview: the four winning shapes take turns */
.pcycle { position: relative; display: inline-grid; flex: none; }
.pcycle > .pgrid { grid-area: 1 / 1; opacity: 0; animation: pcycle 8s infinite; }
.pcycle > .pgrid:nth-child(2) { animation-delay: 2s; } .pcycle > .pgrid:nth-child(3) { animation-delay: 4s; } .pcycle > .pgrid:nth-child(4) { animation-delay: 6s; }
@keyframes pcycle { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pcycle > .pgrid { animation: none !important; opacity: 0; } .pcycle > .pgrid:first-child { opacity: 1; } }
</style>
</head>
<body>
<div id="app"></div>
<script>/* DeckFlix game engines
 * Each game is a separate, authoritative rules engine with the same contract:
 *   create(config, rng)        -> full state (server-side only)
 *   view(state, seat)          -> redacted state for one seat (hidden cards removed)
 *   apply(state, seat, action) -> {ok:true} | {ok:false, error}
 *   bot(view, seat)            -> action chosen from that seat's view only
 *   timeoutAction(view, seat)  -> safe default action when a turn timer expires
 */
(function (root) {
  'use strict';

  // ---------- shared card utilities ----------
  const SUITS = ['C', 'S', 'H', 'D'];
  const SUIT_SYMBOL = { C: '♣', S: '♠', H: '♥', D: '♦' };
  const RANK_LABEL = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };
  const rankLabel = (r) => RANK_LABEL[r] || String(r);
  const cardName = (c) => rankLabel(c.r) + SUIT_SYMBOL[c.s];

  function makeDeck() {
    const d = [];
    for (const s of SUITS) for (let r = 1; r <= 13; r++) d.push({ id: rankLabel(r) + s, r, s });
    return d;
  }

  function cryptoRng() {
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      return () => { crypto.getRandomValues(buf); return buf[0] / 4294967296; };
    }
    return Math.random;
  }

  function seededRng(seed) { // mulberry32, for reproducible tests
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) { // Fisher–Yates
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const err = (e) => ({ ok: false, error: e });
  const OK = { ok: true };

  function takeCards(hand, ids) {
    const out = [];
    for (const id of ids) {
      const i = hand.findIndex((c) => c.id === id);
      if (i < 0) return null;
      out.push(hand[i]);
    }
    if (new Set(ids).size !== ids.length) return null;
    return out;
  }
  const removeIds = (hand, ids) => hand.filter((c) => !ids.includes(c.id));

  // =====================================================================
  // IN BETWEEN (Acey-Deucey, Filipino house rules)
  // Two modes: a single game (fixed number of table rotations) or a tracked
  // session that runs round by round until a set number of rounds have a winner.
  // All amounts are non-redeemable virtual points.
  // =====================================================================
  const IB_RULES = { ante: 1, postMult: 2, pairRule: 'call', maxBet: 'pot', roundMode: 'pot', potCap: 3, ace: 'high' };
  const InBetween = {
    id: 'inbetween',
    minPlayers: 2, maxPlayers: 6,
    val: (c) => (c.r === 1 ? 14 : c.r), // default: Ace high
    // Only the card's number counts; suit and colour never matter.
    num(st, c) { return c.r === 1 ? (st.rules && st.rules.ace === 'low' ? 1 : 14) : c.r; },
    DEFAULT_RULES: IB_RULES,

    create(cfg, rng) {
      rng = rng || cryptoRng();
      const rules = Object.assign({}, IB_RULES, cfg.rules || {}, cfg.ante ? { ante: cfg.ante } : {});
      const start = cfg.startChips || 300;
      const seats = cfg.players.map((p) => ({ name: p.name, bot: !!p.bot, chips: start, out: false }));
      const session = cfg.session ? { target: cfg.winRounds || 5, scoring: cfg.scoring || 'wins', maxRounds: (cfg.winRounds || 5) * 4 } : null;
      const st = {
        game: 'inbetween', seats, rules, ante: rules.ante, minBet: rules.ante, startChips: start,
        deck: shuffle(makeDeck(), rng), used: [], pot: 0,
        turn: cfg.dealer != null ? (cfg.dealer + 1) % seats.length : 0,
        turnsTaken: 0, maxTurns: session ? Infinity : (cfg.rotations || 4) * seats.length,
        posts: null, third: null, phase: 'bet', log: [], last: null, result: null, seq: 0,
        session, rounds: [], roundNo: 1, roundStart: null, lastRound: null,
        stats: seats.map(() => ({ biggestWin: 0, betsWon: 0, betsLost: 0, posts: 0, elimRound: null })),
      };
      Object.defineProperty(st, '_rngFn', { value: rng, enumerable: false, writable: true });
      if (session) InBetween._beginRound(st);
      InBetween._ante(st);
      InBetween._startTurn(st, rng);
      return st;
    },

    _ante(st) {
      for (const s of st.seats) {
        if (s.out) continue;
        const a = Math.min(st.ante, s.chips);
        s.chips -= a; st.pot += a;
        if (s.chips === 0) { s.out = true; InBetween._markOut(st, st.seats.indexOf(s)); }
      }
      st.log.push({ t: 'ante', msg: `Everyone antes ${st.ante}. Pot is ${st.pot}.` });
    },
    _markOut(st, i) { if (st.stats[i].elimRound == null) st.stats[i].elimRound = st.session ? st.roundNo : st.turnsTaken; },

    _draw(st, rng) {
      if (st.deck.length === 0) {
        st.deck = shuffle(st.used, rng || cryptoRng());
        st.used = [];
        st.log.push({ t: 'shuffle', msg: 'Deck reshuffled.' });
      }
      return st.deck.pop();
    },

    _active(st) { return st.seats.filter((s) => !s.out && s.chips > 0); },
    noBet(st) { return st.postKind === 'consecutive' || (st.postKind === 'pair' && st.rules.pairRule === 'pass'); },

    _beginRound(st) {
      st.roundStart = { bal: st.seats.map((s) => s.chips), outBefore: st.seats.map((s) => s.out), turns: 0, active: InBetween._active(st).length };
      if (st.roundNo > 1) st.log.push({ t: 'round', msg: `Round ${st.roundNo} begins.` });
    },

    _startTurn(st, rng) {
      let guard = 0;
      while ((st.seats[st.turn].out || st.seats[st.turn].chips <= 0) && guard++ < st.seats.length) {
        st.seats[st.turn].out = true;
        st.turn = (st.turn + 1) % st.seats.length;
      }
      if (st.turnsTaken >= st.maxTurns || InBetween._active(st).length < 2) return InBetween._end(st);
      if (st.pot <= 0) InBetween._ante(st);
      if (InBetween._active(st).length < 2) return InBetween._end(st);
      if (st.posts) st.used.push(...st.posts);
      if (st.third) st.used.push(st.third);
      st.third = null;
      if (st.deck.length < 3) {
        st.deck = shuffle(st.deck.concat(st.used), rng || cryptoRng());
        st.used = [];
        st.log.push({ t: 'shuffle', msg: 'Deck reshuffled.' });
      }
      const a = InBetween._draw(st, rng), b = InBetween._draw(st, rng);
      st.posts = InBetween.num(st, a) <= InBetween.num(st, b) ? [a, b] : [b, a];
      st.phase = 'bet';
      st.seq++;
      const gap = InBetween.num(st, st.posts[1]) - InBetween.num(st, st.posts[0]);
      st.postKind = gap === 0 ? 'pair' : gap === 1 ? 'consecutive' : 'open';
      st.noBet = InBetween.noBet(st);
    },

    maxBet(st, seat) {
      const minB = Math.min(st.minBet, st.pot);
      const potLimit = st.rules.maxBet === 'half' ? Math.max(minB, Math.floor(st.pot / 2)) : st.pot;
      return Math.max(0, Math.min(potLimit, st.seats[seat].chips));
    },
    minBetFor(st, seat) { return Math.min(st.minBet, InBetween.maxBet(st, seat)); },

    apply(st, seat, a, rng) {
      rng = rng || st._rngFn || cryptoRng();
      if (st.phase === 'ended') return err('The game is over.');
      if (st.phase !== 'bet') return err('Wait for the card to be revealed.');
      if (seat !== st.turn) return err('It is not your turn.');
      const me = st.seats[seat];
      if (a.type === 'pass') {
        st.log.push({ t: 'pass', seat, msg: `${me.name} passes.` });
        st.last = { seat, kind: 'pass' };
        return InBetween._next(st, rng);
      }
      if (a.type !== 'bet') return err('Unknown action.');
      if (InBetween.noBet(st)) return err(st.postKind === 'pair' ? 'House rules: pairs pass automatically.' : 'No card can land between consecutive posts. Pass instead.');
      const amt = Math.floor(Number(a.amount));
      const max = InBetween.maxBet(st, seat), min = InBetween.minBetFor(st, seat);
      if (!Number.isFinite(amt) || amt < min || amt > max) return err(`Bet must be between ${min} and ${max}.`);
      if (st.postKind === 'pair' && a.call !== 'higher' && a.call !== 'lower') return err('With a pair, call higher or lower.');
      const third = InBetween._draw(st, rng);
      st.third = third;
      const lo = InBetween.num(st, st.posts[0]), hi = InBetween.num(st, st.posts[1]), v = InBetween.num(st, third);
      let outcome;
      if (st.postKind === 'pair') {
        if (v === lo) outcome = 'post';
        else if ((a.call === 'higher' && v > lo) || (a.call === 'lower' && v < lo)) outcome = 'win';
        else outcome = 'lose';
      } else {
        if (v === lo || v === hi) outcome = 'post';
        else if (v > lo && v < hi) outcome = 'win';
        else outcome = 'lose';
      }
      let delta;
      const S = st.stats[seat];
      if (outcome === 'win') { delta = amt; me.chips += amt; st.pot -= amt; S.betsWon++; S.biggestWin = Math.max(S.biggestWin, amt); }
      else {
        const owe = Math.min(me.chips, outcome === 'post' ? amt * st.rules.postMult : amt);
        delta = -owe; me.chips -= owe; st.pot += owe; S.betsLost++; if (outcome === 'post') S.posts++;
      }
      const words = { win: 'lands in between', lose: 'misses', post: 'hits the post' };
      st.log.push({ t: outcome, seat, msg: `${me.name} bets ${amt}${a.call ? ' on ' + a.call : ''}. ${cardName(third)} ${words[outcome]} (${delta > 0 ? '+' : ''}${delta}).` });
      st.last = { seat, kind: outcome, amount: amt, delta, call: a.call || null, third };
      if (me.chips <= 0) { me.out = true; InBetween._markOut(st, seat); st.log.push({ t: 'out', seat, msg: `${me.name} is out of points and eliminated.` }); }
      st.phase = 'reveal';
      return { ok: true, outcome, delta };
    },

    // Called by the host after the reveal animation (or immediately in tests)
    advance(st, rng) { if (st.phase === 'reveal') return InBetween._next(st, rng || st._rngFn); return OK; },

    _next(st, rng) {
      st.turnsTaken++;
      if (st.session) {
        st.roundStart.turns++;
        if (InBetween._roundCheck(st)) return OK; // session ended
      }
      st.turn = (st.turn + 1) % st.seats.length;
      InBetween._startTurn(st, rng);
      return OK;
    },

    // ---- session rounds ----
    _roundCheck(st) {
      const r = st.roundStart, L = st.last, R = st.rules;
      const alive = InBetween._active(st).length;
      let close = false, winner = null, how = '';
      if (R.roundMode === 'pot' && L && L.kind === 'win' && st.pot === 0) { close = true; winner = L.seat; how = 'Took the whole pot'; }
      else if (R.roundMode === 'pot' && r.turns >= R.potCap * r.active) { close = true; how = 'Turn limit reached'; }
      else if (R.roundMode === 'table' && r.turns >= r.active) { close = true; how = 'Table round complete'; }
      if (alive < 2) { close = true; how = how || 'Only one player left'; }
      if (!close) return false;
      const deltas = st.seats.map((s, i) => s.chips - r.bal[i]);
      if (winner == null) {
        const best = Math.max(...deltas);
        const tops = deltas.map((d, i) => (d === best ? i : -1)).filter((i) => i >= 0);
        if (best > 0 && tops.length === 1) { winner = tops[0]; how += ', biggest gain'; }
        else how += best > 0 ? ', tied for biggest gain (no winner)' : ', nobody gained (no winner)';
      }
      const eliminated = st.seats.map((s, i) => (s.out && !r.outBefore[i] ? i : -1)).filter((i) => i >= 0);
      const rec = { n: st.roundNo, winner, how, deltas, balances: st.seats.map((s) => s.chips), eliminated, pot: st.pot, turns: r.turns };
      st.rounds.push(rec);
      st.lastRound = rec;
      st.log.push({ t: 'roundEnd', msg: `Round ${st.roundNo}: ${winner != null ? st.seats[winner].name + ' wins. ' + how + '.' : how + '.'}` });
      const decided = st.rounds.filter((x) => x.winner != null).length;
      if (decided >= st.session.target || alive < 2 || st.rounds.length >= st.session.maxRounds) {
        st.session.endedBy = decided >= st.session.target ? 'target' : alive < 2 ? 'elimination' : 'roundLimit';
        InBetween._end(st);
        return true;
      }
      st.roundNo++;
      InBetween._beginRound(st);
      return false;
    },

    // Rank players for the Grand Champion. Returns ordered standings and the champion seats.
    rankSession(st) {
      const scoring = st.session.scoring;
      const rows = st.seats.map((s, i) => {
        const wins = st.rounds.filter((r) => r.winner === i).length;
        let reachedAt = Infinity, c = 0;
        st.rounds.forEach((r) => { if (r.winner === i && ++c === wins) reachedAt = r.n; });
        return {
          seat: i, name: s.name, bot: s.bot, wins, losses: st.rounds.filter((r) => r.deltas[i] < 0).length,
          start: st.startChips, final: s.chips, net: s.chips - st.startChips, eliminated: s.out || s.chips <= 0,
          elimRound: st.stats[i].elimRound, biggestWin: st.stats[i].biggestWin, betsWon: st.stats[i].betsWon, reachedAt: wins ? reachedAt : Infinity,
        };
      });
      const keys = scoring === 'points'
        ? [['final', -1], ['wins', -1], ['biggestWin', -1], ['reachedAt', 1]]
        : [['wins', -1], ['final', -1], ['biggestWin', -1], ['reachedAt', 1]];
      const cmp = (a, b) => { for (const [k, d] of keys) if (a[k] !== b[k]) return d < 0 ? (b[k] > a[k] ? 1 : -1) : (a[k] > b[k] ? 1 : -1); return 0; };
      rows.sort(cmp);
      // dense ranks, ties share a place
      rows.forEach((r, i) => { r.place = i && cmp(rows[i - 1], r) === 0 ? rows[i - 1].place : i + 1; });
      const champs = rows.filter((r) => r.place === 1).map((r) => r.seat);
      // which criterion separated the top two?
      let decidedBy = null;
      if (rows.length > 1) {
        const [a, b] = rows;
        const hit = keys.find(([k]) => a[k] !== b[k]);
        decidedBy = hit ? hit[0] : 'shared';
      }
      return { rows, champs, keys: keys.map((k) => k[0]), decidedBy };
    },

    _end(st) {
      st.phase = 'ended';
      // leftover pot is shared evenly among players still in
      const alive = st.seats.filter((s) => s.chips > 0);
      st.leftoverPot = st.pot;
      if (st.pot > 0 && alive.length) {
        const share = Math.floor(st.pot / alive.length);
        let extra = st.pot - share * alive.length; // odd points go one each, in seat order, so no points vanish
        alive.forEach((s) => { s.chips += share + (extra > 0 ? 1 : 0); if (extra > 0) extra--; });
        st.pot = 0;
        st.potShare = share;
      }
      if (st.session) {
        const rank = InBetween.rankSession(st);
        st.result = {
          winners: rank.champs,
          reason: rank.champs.length > 1 ? 'Shared Grand Champion title' : 'Grand Champion of the session',
          standings: rank.rows.map((r) => ({ ...r, score: r.final })),
          session: { ...st.session, rounds: st.rounds, decidedBy: rank.decidedBy, keys: rank.keys, totalRounds: st.rounds.length, leftoverPot: st.leftoverPot, potShare: st.potShare || 0 },
        };
        st.log.push({ t: 'end', msg: `Session over. Grand Champion: ${rank.champs.map((i) => st.seats[i].name).join(' & ')}.` });
        st.seq++;
        return OK;
      }
      const best = Math.max(...st.seats.map((s) => s.chips));
      const winners = st.seats.map((s, i) => (s.chips === best ? i : -1)).filter((i) => i >= 0);
      st.result = {
        winners,
        reason: 'Most chips after the final rotation',
        standings: st.seats.map((s, i) => ({ seat: i, name: s.name, score: s.chips, start: st.startChips, net: s.chips - st.startChips })).sort((a, b) => b.score - a.score),
      };
      st.log.push({ t: 'end', msg: `Game over. ${winners.map((i) => st.seats[i].name).join(' & ')} wins with ${best} chips.` });
      st.seq++;
      return OK;
    },

    view(st, seat) {
      const v = clone({ ...st, deck: undefined, used: undefined });
      v.deckCount = st.deck.length;
      v.you = seat;
      v.maxBet = InBetween.maxBet(st, st.turn);
      v.minBet = InBetween.minBetFor(st, st.turn);
      v.noBet = InBetween.noBet(st);
      return v;
    },

    bot(v, seat) {
      if (v.noBet) return { type: 'pass' };
      const lo = InBetween.num(v, v.posts[0]), hi = InBetween.num(v, v.posts[1]);
      const min = v.minBet, max = v.maxBet;
      if (max <= 0) return { type: 'pass' };
      if (v.postKind === 'pair') {
        if (lo <= 5) return { type: 'bet', amount: min, call: 'higher' };
        if (lo >= 11) return { type: 'bet', amount: min, call: 'lower' };
        return { type: 'pass' };
      }
      const gap = hi - lo - 1; // ranks strictly between, out of 13
      const pm = (v.rules && v.rules.postMult) || 2;
      const pWin = gap / 13, pPost = 2 / 13, pLose = 1 - pWin - pPost;
      const ev = pWin - pLose - pm * pPost;
      if (gap >= 10 && v.rules && v.rules.roundMode === 'pot') return { type: 'bet', amount: max }; // go for the pot
      if (ev <= 0.05) return gap >= 6 ? { type: 'bet', amount: min } : { type: 'pass' };
      const frac = Math.min(0.5, ev);
      const step = max >= 100 ? 5 : 1; // small pots (1-point antes) bet in single points
      const amt = Math.max(min, Math.min(max, Math.round((max * frac) / step) * step));
      return { type: 'bet', amount: amt };
    },

    timeoutAction() { return { type: 'pass' }; },
  };

  // =====================================================================
  // TONGITS (3-player Filipino rummy)
  // =====================================================================
  const Tongits = {
    id: 'tongits',
    minPlayers: 3, maxPlayers: 3,
    points: (c) => (c.r >= 10 ? 10 : c.r),
    handPoints(hand) { return hand.reduce((s, c) => s + Tongits.points(c), 0); },

    isSet(cards) { return cards.length >= 3 && cards.length <= 4 && cards.every((c) => c.r === cards[0].r); },
    isRun(cards) {
      if (cards.length < 3) return false;
      if (!cards.every((c) => c.s === cards[0].s)) return false;
      const rs = cards.map((c) => c.r).sort((a, b) => a - b);
      for (let i = 1; i < rs.length; i++) if (rs[i] !== rs[i - 1] + 1) return false;
      return true; // Ace is low only: A-2-3 valid, Q-K-A not
    },
    meldType(cards) { return Tongits.isSet(cards) ? 'set' : Tongits.isRun(cards) ? 'run' : null; },
    canLayOff(meld, card) { return !!Tongits.meldType(meld.cards.concat([card])); },

    create(cfg, rng) {
      rng = rng || cryptoRng();
      const deck = shuffle(makeDeck(), rng);
      const dealer = cfg.dealer || 0;
      const seats = cfg.players.map((p) => ({ name: p.name, bot: !!p.bot, hand: [], opened: false, drawBlocked: false }));
      for (let k = 0; k < 12; k++) for (let i = 0; i < 3; i++) seats[(dealer + i) % 3].hand.push(deck.pop());
      seats[dealer].hand.push(deck.pop());
      return {
        game: 'tongits', seats, stock: deck, discard: [], melds: [], dealer,
        turn: dealer, phase: 'act', firstTurn: true, drewThisTurn: true,
        pending: null, log: [{ t: 'deal', msg: `${seats[dealer].name} deals and starts with 13 cards.` }],
        result: null, last: null, seq: 0, scoring: cfg.scoring || null,
      };
    },

    _owner(st, seat) { return st.seats[seat]; },

    apply(st, seat, a) {
      if (st.phase === 'ended') return err('The round is over.');
      const me = st.seats[seat];

      // ---- responses to a draw call ----
      if (st.phase === 'drawCall') {
        const p = st.pending;
        if (!p.awaiting.includes(seat)) return err('Waiting for other players to answer the draw.');
        if (a.type !== 'challenge' && a.type !== 'fold') return err('Choose challenge or fold.');
        p.awaiting = p.awaiting.filter((s) => s !== seat);
        p.answers[seat] = a.type;
        st.log.push({ t: a.type, seat, msg: `${me.name} ${a.type === 'challenge' ? 'challenges the draw' : 'folds'}.` });
        if (p.awaiting.length === 0) Tongits._resolveDraw(st);
        st.seq++;
        return OK;
      }

      if (seat !== st.turn) return err('It is not your turn.');

      if (st.phase === 'draw') {
        if (a.type === 'drawStock') {
          if (!st.stock.length) return err('The stock is empty.');
          const c = st.stock.pop();
          me.hand.push(c);
          st.phase = 'act'; st.drewThisTurn = true;
          st.last = { seat, kind: 'drawStock', card: c.id };
          st.log.push({ t: 'draw', seat, msg: `${me.name} draws from the stock.` });
          st.seq++;
          return OK;
        }
        if (a.type === 'takeDiscard') {
          const top = st.discard[st.discard.length - 1];
          if (!top) return err('The discard pile is empty.');
          const withCards = takeCards(me.hand, a.with || []);
          if (!withCards || withCards.length < 2) return err('Select at least two cards from your hand that form a meld with the discard.');
          const meldCards = withCards.concat([top]);
          const type = Tongits.meldType(meldCards);
          if (!type) return err('Those cards do not form a set or run with the discard.');
          st.discard.pop();
          me.hand = removeIds(me.hand, a.with);
          st.melds.push({ owner: seat, type, cards: Tongits._sort(meldCards) });
          me.opened = true;
          st.phase = 'act'; st.drewThisTurn = true;
          st.last = { seat, kind: 'takeDiscard', card: top.id };
          st.log.push({ t: 'take', seat, msg: `${me.name} chows ${cardName(top)} and lays down a ${type}.` });
          st.seq++;
          if (me.hand.length === 0) return Tongits._tongits(st, seat);
          return OK;
        }
        if (a.type === 'callDraw') {
          if (!me.opened) return err('You need at least one exposed meld to call a draw.');
          if (me.drawBlocked) return err('Your meld was sapaw’d since your last turn. You can call a draw next turn.');
          const others = [1, 2].map((k) => (seat + k) % 3);
          const eligible = others.filter((s) => st.seats[s].opened);
          st.log.push({ t: 'callDraw', seat, msg: `${me.name} calls a draw.` });
          st.pending = { caller: seat, awaiting: eligible.slice(), answers: {} };
          others.filter((s) => !eligible.includes(s)).forEach((s) => {
            st.pending.answers[s] = 'burned';
            st.log.push({ t: 'fold', seat: s, msg: `${st.seats[s].name} has no exposed meld and folds automatically.` });
          });
          st.phase = 'drawCall';
          st.seq++;
          if (eligible.length === 0) Tongits._resolveDraw(st);
          return OK;
        }
        return err('Draw from the stock, take the discard, or call a draw first.');
      }

      if (st.phase === 'act') {
        if (a.type === 'meld') {
          const cards = takeCards(me.hand, a.cards || []);
          if (!cards) return err('Select cards from your hand.');
          const type = Tongits.meldType(cards);
          if (!type) return err('A meld is 3–4 of the same rank, or 3+ in sequence of one suit (Ace is low).');
          me.hand = removeIds(me.hand, a.cards);
          st.melds.push({ owner: seat, type, cards: Tongits._sort(cards) });
          me.opened = true;
          st.last = { seat, kind: 'meld' };
          st.log.push({ t: 'meld', seat, msg: `${me.name} lays down ${cards.map(cardName).join(' ')}.` });
          st.seq++;
          if (me.hand.length === 0) return Tongits._tongits(st, seat);
          return OK;
        }
        if (a.type === 'sapaw') {
          const card = takeCards(me.hand, [a.card]);
          const meld = st.melds[a.meld];
          if (!card || !meld) return err('Pick a card and an exposed meld.');
          if (!Tongits.canLayOff(meld, card[0])) return err(`${cardName(card[0])} doesn’t fit that meld.`);
          meld.cards = Tongits._sort(meld.cards.concat(card));
          me.hand = removeIds(me.hand, [a.card]);
          if (meld.owner !== seat) st.seats[meld.owner].drawBlocked = true;
          st.last = { seat, kind: 'sapaw', meld: a.meld };
          st.log.push({ t: 'sapaw', seat, msg: `${me.name} sapaws ${cardName(card[0])} onto ${meld.owner === seat ? 'their own' : st.seats[meld.owner].name + '’s'} meld.` });
          st.seq++;
          if (me.hand.length === 0) return Tongits._tongits(st, seat);
          return OK;
        }
        if (a.type === 'discard') {
          const card = takeCards(me.hand, [a.card]);
          if (!card) return err('Pick one card to discard.');
          me.hand = removeIds(me.hand, [a.card]);
          st.discard.push(card[0]);
          me.drawBlocked = false; // your one-turn wait is over once your turn ends
          st.last = { seat, kind: 'discard', card: a.card };
          st.log.push({ t: 'discard', seat, msg: `${me.name} discards ${cardName(card[0])}.` });
          st.firstTurn = false;
          st.seq++;
          if (me.hand.length === 0) return Tongits._tongits(st, seat);
          if (st.stock.length === 0) return Tongits._stockOut(st, seat);
          st.turn = (seat + 1) % 3;
          st.phase = 'draw'; st.drewThisTurn = false;
          return OK;
        }
        return err('Lay down melds, sapaw, or discard to end your turn.');
      }
      return err('Unknown action.');
    },

    _sort(cards) {
      return cards.slice().sort((a, b) => a.r - b.r || SUITS.indexOf(a.s) - SUITS.indexOf(b.s));
    },

    _finish(st, winner, reason, payments) {
      st.phase = 'ended';
      const totals = st.seats.map(() => 0);
      for (const [s, amt] of Object.entries(payments)) { totals[s] -= amt; totals[winner] += amt; }
      st.result = {
        winners: [winner], reason,
        handPoints: st.seats.map((s) => Tongits.handPoints(s.hand)),
        revealed: st.seats.map((s) => s.hand),
        standings: st.seats.map((s, i) => ({ seat: i, name: s.name, score: totals[i], points: Tongits.handPoints(s.hand), opened: s.opened })),
      };
      st.log.push({ t: 'end', msg: `${st.seats[winner].name} wins by ${reason}.` });
      st.seq++;
      return OK;
    },

    _tongits(st, seat) {
      const pay = {};
      [1, 2].forEach((k) => (pay[(seat + k) % 3] = 3));
      return Tongits._finish(st, seat, 'Tongits — an empty hand', pay);
    },

    _resolveDraw(st) {
      const p = st.pending;
      const caller = p.caller;
      const contenders = [caller].concat([1, 2].map((k) => (caller + k) % 3).filter((s) => p.answers[s] === 'challenge'));
      const pts = (s) => Tongits.handPoints(st.seats[s].hand);
      // lowest wins; challengers beat the caller on ties; between challengers, the next seat after the caller wins
      let best = contenders[0];
      for (const s of contenders.slice(1)) if (pts(s) <= pts(best)) { if (pts(s) < pts(best) || best === caller) best = s; }
      const pay = {};
      const challenged = contenders.length > 1;
      st.seats.forEach((_, s) => {
        if (s === best) return;
        pay[s] = p.answers[s] === 'challenge' || (s === caller && challenged) ? 3 : 1;
        if (p.answers[s] === 'burned') pay[s] = 2;
      });
      st.drawSummary = { caller, contenders, points: st.seats.map((_, s) => pts(s)), answers: p.answers };
      st.pending = null;
      return Tongits._finish(st, best, challenged ? 'winning a challenged draw' : 'an unchallenged draw', pay);
    },

    _stockOut(st, lastSeat) {
      const order = [0, 1, 2].map((k) => (lastSeat + k) % 3);
      let pool = order.filter((s) => st.seats[s].opened);
      if (!pool.length) pool = order;
      const pts = (s) => Tongits.handPoints(st.seats[s].hand);
      let best = pool[0];
      for (const s of pool) if (pts(s) < pts(best)) best = s;
      const pay = {};
      st.seats.forEach((seatObj, s) => { if (s !== best) pay[s] = seatObj.opened ? 1 : 2; });
      return Tongits._finish(st, best, 'lowest points when the stock ran out', pay);
    },

    view(st, seat) {
      const v = {
        game: 'tongits', you: seat, turn: st.turn, phase: st.phase, dealer: st.dealer, seq: st.seq,
        stockCount: st.stock.length, discard: clone(st.discard), melds: clone(st.melds),
        firstTurn: st.firstTurn, pending: st.pending ? clone(st.pending) : null,
        log: st.log.slice(-40), last: st.last ? { ...st.last, card: st.last.kind === 'drawStock' && st.last.seat !== seat ? null : st.last.card } : null,
        seats: st.seats.map((s, i) => ({
          name: s.name, bot: s.bot, opened: s.opened, drawBlocked: s.drawBlocked,
          handCount: s.hand.length,
          hand: i === seat || st.phase === 'ended' ? clone(s.hand) : null,
        })),
        result: st.result ? clone(st.result) : null, drawSummary: st.drawSummary || null,
      };
      return v;
    },

    // ---- meld search (used by bots and by the "show melds" hint) ----
    candidateMelds(hand) {
      const out = [];
      const byRank = {};
      hand.forEach((c, i) => (byRank[c.r] = byRank[c.r] || []).push(i));
      for (const idx of Object.values(byRank)) {
        if (idx.length >= 3) {
          const n = idx.length;
          for (let m = 0; m < 1 << n; m++) {
            const sub = idx.filter((_, k) => m & (1 << k));
            if (sub.length >= 3) out.push(sub);
          }
        }
      }
      for (const s of SUITS) {
        const bySuit = hand.map((c, i) => ({ c, i })).filter((x) => x.c.s === s).sort((a, b) => a.c.r - b.c.r);
        for (let i = 0; i < bySuit.length; i++) {
          let j = i;
          while (j + 1 < bySuit.length && bySuit[j + 1].c.r === bySuit[j].c.r + 1) {
            j++;
            if (j - i >= 2) {
              // all sub-runs starting at i of length >= 3
              out.push(bySuit.slice(i, j + 1).map((x) => x.i));
            }
          }
        }
      }
      return out;
    },

    // Every way the top discard can be chowed: the hand cards that make a set or run with it.
    chowOptions(hand, top) {
      if (!top) return [];
      const all = hand.concat([top]); const ti = all.length - 1;
      const seen = new Set(), out = [];
      for (const idx of Tongits.candidateMelds(all)) {
        if (!idx.includes(ti)) continue;
        const withCards = idx.filter((i) => i !== ti).map((i) => all[i]);
        const key = withCards.map((c) => c.id).sort().join(',');
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({ with: withCards, type: Tongits.meldType(withCards.concat([top])) });
      }
      return out.sort((a, b) => a.with.length - b.with.length);
    },

    bestMelds(hand) {
      const cands = Tongits.candidateMelds(hand).map((idx) => ({ idx, mask: idx.reduce((m, i) => m | (1 << i), 0) }));
      const memo = new Map();
      const full = (1 << hand.length) - 1;
      function solve(mask) { // mask = cards still available; returns {dead, melds}
        if (mask === 0) return { dead: 0, melds: [] };
        if (memo.has(mask)) return memo.get(mask);
        let i = 0; while (!(mask & (1 << i))) i++;
        const rest = solve(mask & ~(1 << i));
        let best = { dead: rest.dead + Tongits.points(hand[i]), melds: rest.melds };
        for (const c of cands) {
          if ((c.mask & (1 << i)) && (c.mask & mask) === c.mask) {
            const r = solve(mask & ~c.mask);
            if (r.dead < best.dead) best = { dead: r.dead, melds: [c.idx].concat(r.melds) };
          }
        }
        memo.set(mask, best);
        return best;
      }
      const r = solve(full);
      return { deadwood: r.dead, melds: r.melds.map((m) => m.map((i) => hand[i])) };
    },

    bot(v, seat) {
      const me = v.seats[seat];
      const hand = me.hand;
      if (v.phase === 'drawCall') {
        return { type: Tongits.handPoints(hand) <= 12 ? 'challenge' : 'fold' };
      }
      if (v.phase === 'draw') {
        const pts = Tongits.handPoints(hand);
        const threshold = v.stockCount <= 6 ? 18 : 10;
        if (me.opened && !me.drawBlocked && pts <= threshold) return { type: 'callDraw' };
        const top = v.discard[v.discard.length - 1];
        if (top) {
          const withTop = Tongits.bestMelds(hand.concat([top]));
          const used = withTop.melds.find((m) => m.some((c) => c.id === top.id));
          const without = Tongits.bestMelds(hand);
          if (used && withTop.deadwood < without.deadwood + Tongits.points(top)) {
            return { type: 'takeDiscard', with: used.filter((c) => c.id !== top.id).map((c) => c.id) };
          }
        }
        return { type: 'drawStock' };
      }
      // act phase: lay down every meld, sapaw what fits, then discard the heaviest loose card
      const plan = Tongits.bestMelds(hand);
      if (plan.melds.length) return { type: 'meld', cards: plan.melds[0].map((c) => c.id) };
      for (const c of hand.slice().sort((a, b) => Tongits.points(b) - Tongits.points(a))) {
        const mi = v.melds.findIndex((m) => Tongits.canLayOff(m, c));
        if (mi >= 0 && hand.length > 1) return { type: 'sapaw', card: c.id, meld: mi };
        if (mi >= 0 && hand.length === 1) return { type: 'sapaw', card: c.id, meld: mi };
      }
      // discard: prefer high cards with no near-neighbours
      const score = (c) => {
        let s = Tongits.points(c) * 2;
        hand.forEach((o) => {
          if (o.id === c.id) return;
          if (o.r === c.r) s -= 6;
          if (o.s === c.s && Math.abs(o.r - c.r) <= 2) s -= 4;
        });
        return s;
      };
      const pick = hand.slice().sort((a, b) => score(b) - score(a))[0];
      return { type: 'discard', card: pick.id };
    },

    timeoutAction(v, seat) {
      if (v.phase === 'drawCall') return { type: 'fold' };
      if (v.phase === 'draw') return { type: 'drawStock' };
      const hand = v.seats[seat].hand;
      const pick = hand.slice().sort((a, b) => Tongits.points(b) - Tongits.points(a))[0];
      return { type: 'discard', card: pick.id };
    },
  };

  // =====================================================================
  // PUSOY DOS (Filipino climbing game, a.k.a. Big Two)
  // =====================================================================
  const Pusoy = {
    id: 'pusoydos',
    minPlayers: 4, maxPlayers: 4,
    SUIT_ORDER: { C: 0, S: 1, H: 2, D: 3 }, // clubs lowest, diamonds highest
    rv: (c) => (c.r === 1 ? 12 : c.r === 2 ? 13 : c.r - 2), // 3 low ... A, 2 high
    power(c) { return Pusoy.rv(c) * 4 + Pusoy.SUIT_ORDER[c.s]; },
    TYPE_RANK: { straight: 1, flush: 2, fullhouse: 3, quads: 4, straightflush: 5 },
    TYPE_LABEL: { single: 'Single', pair: 'Pair', triple: 'Three of a kind', straight: 'Straight', flush: 'Flush', fullhouse: 'Full house', quads: 'Four of a kind', straightflush: 'Straight flush' },

    classify(cards) {
      const n = cards.length;
      const pw = cards.map(Pusoy.power).sort((a, b) => b - a);
      const rvs = cards.map(Pusoy.rv);
      const same = rvs.every((r) => r === rvs[0]);
      if (n === 1) return { type: 'single', size: 1, key: pw[0] };
      if (n === 2) return same ? { type: 'pair', size: 2, key: pw[0] } : null;
      if (n === 3) return same ? { type: 'triple', size: 3, key: rvs[0] } : null;
      if (n !== 5) return null;
      const counts = {};
      rvs.forEach((r) => (counts[r] = (counts[r] || 0) + 1));
      const groups = Object.entries(counts).map(([r, c]) => ({ r: +r, c })).sort((a, b) => b.c - a.c || b.r - a.r);
      const flush = cards.every((c) => c.s === cards[0].s);
      const sorted = rvs.slice().sort((a, b) => a - b);
      const straight = groups.length === 5 && sorted[4] - sorted[0] === 4 && sorted[4] <= 12; // 2s can't be in straights
      if (straight && flush) return { type: 'straightflush', size: 5, key: pw[0] };
      if (groups[0].c === 4) return { type: 'quads', size: 5, key: groups[0].r };
      if (groups[0].c === 3 && groups[1].c === 2) return { type: 'fullhouse', size: 5, key: groups[0].r };
      if (flush) return { type: 'flush', size: 5, key: pw[0] };
      if (straight) return { type: 'straight', size: 5, key: pw[0] };
      return null;
    },

    beats(a, b) { // does combo a beat combo b?
      if (a.size !== b.size) return false;
      if (a.size === 5) {
        const ta = Pusoy.TYPE_RANK[a.type], tb = Pusoy.TYPE_RANK[b.type];
        return ta > tb || (ta === tb && a.key > b.key);
      }
      return a.key > b.key;
    },

    create(cfg, rng) {
      rng = rng || cryptoRng();
      const deck = shuffle(makeDeck(), rng);
      const n = cfg.players.length;
      const seats = cfg.players.map((p) => ({ name: p.name, bot: !!p.bot, hand: [] }));
      for (let k = 0; k < 13; k++) for (let i = 0; i < n; i++) seats[i].hand.push(deck.pop());
      // whoever holds the lowest card (3♣ with four players) leads, and must include it
      let starter = 0, low = Infinity;
      seats.forEach((s, i) => s.hand.forEach((c) => { if (Pusoy.power(c) < low) { low = Pusoy.power(c); starter = i; } }));
      const lowCard = seats[starter].hand.find((c) => Pusoy.power(c) === low);
      return {
        game: 'pusoydos', seats, turn: starter, trick: null, passes: 0, passed: [],
        mustInclude: lowCard.id, phase: 'play', log: [{ t: 'deal', msg: `${seats[starter].name} holds ${cardName(lowCard)} and leads.` }],
        result: null, last: null, seq: 0, pile: [],
      };
    },

    apply(st, seat, a) {
      if (st.phase === 'ended') return err('The game is over.');
      if (seat !== st.turn) return err('It is not your turn.');
      const me = st.seats[seat];
      const n = st.seats.length;
      if (a.type === 'pass') {
        if (!st.trick) return err('You’re leading. Play any valid combination.');
        st.passes++;
        st.passed.push(seat);
        st.last = { seat, kind: 'pass' };
        st.log.push({ t: 'pass', seat, msg: `${me.name} passes.` });
        st.turn = (seat + 1) % n;
        if (st.passes >= n - 1) {
          st.turn = st.trick.by;
          if (st.trick) st.pile.push(...st.trick.cards);
          st.trick = null; st.passes = 0; st.passed = [];
          st.log.push({ t: 'clear', msg: `Everyone passed. ${st.seats[st.turn].name} leads a new round.` });
        }
        st.seq++;
        return OK;
      }
      if (a.type !== 'play') return err('Unknown action.');
      const cards = takeCards(me.hand, a.cards || []);
      if (!cards || !cards.length) return err('Select cards from your hand.');
      const combo = Pusoy.classify(cards);
      if (!combo) return err('That isn’t a valid combination. Play a single, pair, three of a kind, or a 5-card hand.');
      if (st.mustInclude && !a.cards.includes(st.mustInclude)) {
        const c = me.hand.find((x) => x.id === st.mustInclude);
        return err(`The first play must include ${cardName(c)}.`);
      }
      if (st.trick && !Pusoy.beats(combo, st.trick.combo)) {
        return err(st.trick.combo.size !== combo.size
          ? `Play ${st.trick.combo.size} card${st.trick.combo.size > 1 ? 's' : ''} to match the table, or pass.`
          : `That doesn’t beat the ${Pusoy.TYPE_LABEL[st.trick.combo.type].toLowerCase()} on the table.`);
      }
      if (st.trick) st.pile.push(...st.trick.cards);
      me.hand = removeIds(me.hand, a.cards);
      st.trick = { by: seat, cards: cards.slice().sort((x, y) => Pusoy.power(x) - Pusoy.power(y)), combo };
      st.mustInclude = null;
      st.passes = 0; st.passed = [];
      st.last = { seat, kind: 'play' };
      st.log.push({ t: 'play', seat, msg: `${me.name} plays ${Pusoy.TYPE_LABEL[combo.type].toLowerCase()}: ${st.trick.cards.map(cardName).join(' ')}.` });
      st.seq++;
      if (me.hand.length === 0) return Pusoy._end(st, seat);
      st.turn = (seat + 1) % n;
      return OK;
    },

    _end(st, winner) {
      st.phase = 'ended';
      const pen = (s) => s.hand.length * (s.hand.length >= 10 ? 2 : 1);
      let pot = 0;
      const standings = st.seats.map((s, i) => {
        if (i === winner) return { seat: i, name: s.name, cardsLeft: 0, score: 0 };
        pot += pen(s);
        return { seat: i, name: s.name, cardsLeft: s.hand.length, score: -pen(s) };
      });
      standings[winner].score = pot;
      st.result = {
        winners: [winner], reason: 'playing every card first',
        standings: standings.slice().sort((a, b) => b.score - a.score),
        revealed: st.seats.map((s) => s.hand),
      };
      st.log.push({ t: 'end', msg: `${st.seats[winner].name} plays out first and wins.` });
      st.seq++;
      return OK;
    },

    view(st, seat) {
      return {
        game: 'pusoydos', you: seat, turn: st.turn, phase: st.phase, seq: st.seq,
        trick: st.trick ? clone(st.trick) : null, passes: st.passes, passed: st.passed.slice(),
        mustInclude: st.seats[seat].hand.some((c) => c.id === st.mustInclude) ? st.mustInclude : null,
        log: st.log.slice(-40), last: st.last, pileCount: st.pile.length,
        seats: st.seats.map((s, i) => ({ name: s.name, bot: s.bot, handCount: s.hand.length, hand: i === seat || st.phase === 'ended' ? clone(s.hand) : null })),
        result: st.result ? clone(st.result) : null,
      };
    },

    allCombos(hand) {
      const out = [];
      const h = hand.slice().sort((a, b) => Pusoy.power(a) - Pusoy.power(b));
      const push = (cards) => { const c = Pusoy.classify(cards); if (c) out.push({ cards, combo: c }); };
      h.forEach((c) => push([c]));
      for (let i = 0; i < h.length; i++) for (let j = i + 1; j < h.length; j++) {
        if (h[i].r === h[j].r) {
          push([h[i], h[j]]);
          for (let k = j + 1; k < h.length; k++) if (h[k].r === h[i].r) push([h[i], h[j], h[k]]);
        }
      }
      const n = h.length;
      for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) for (let c = b + 1; c < n; c++)
        for (let d = c + 1; d < n; d++) for (let e = d + 1; e < n; e++) push([h[a], h[b], h[c], h[d], h[e]]);
      return out;
    },

    _weight(o) { // lower = cheaper to give up
      const t = o.combo.size === 5 ? Pusoy.TYPE_RANK[o.combo.type] * 100 : 0;
      return t + o.combo.key + o.cards.length * 0.01;
    },

    bot(v, seat) {
      const hand = v.seats[seat].hand;
      let options = Pusoy.allCombos(hand);
      if (v.mustInclude) options = options.filter((o) => o.cards.some((c) => c.id === v.mustInclude));
      const oppMin = Math.min(...v.seats.filter((_, i) => i !== seat).map((s) => s.handCount));
      if (!v.trick) {
        // lead: get rid of the lowest card in the biggest sensible combination
        const lowest = hand.slice().sort((a, b) => Pusoy.power(a) - Pusoy.power(b))[0];
        const target = v.mustInclude || lowest.id;
        let withLow = options.filter((o) => o.cards.some((c) => c.id === target));
        if (!withLow.length) withLow = options;
        const fives = withLow.filter((o) => o.combo.size === 5 && o.combo.type !== 'straightflush' && o.combo.type !== 'quads');
        const pairs = withLow.filter((o) => o.combo.size === 2 || o.combo.size === 3);
        let pick = fives.sort((a, b) => Pusoy._weight(a) - Pusoy._weight(b))[0]
          || pairs.sort((a, b) => b.cards.length - a.cards.length || Pusoy._weight(a) - Pusoy._weight(b))[0]
          || withLow.sort((a, b) => Pusoy._weight(a) - Pusoy._weight(b))[0];
        if (oppMin === 1 && pick.combo.size === 1) { // block a player on their last card
          const singles = options.filter((o) => o.combo.size === 1);
          pick = singles[singles.length - 1];
        }
        return { type: 'play', cards: pick.cards.map((c) => c.id) };
      }
      const beaters = options.filter((o) => Pusoy.beats(o.combo, v.trick.combo)).sort((a, b) => Pusoy._weight(a) - Pusoy._weight(b));
      if (!beaters.length) return { type: 'pass' };
      let pick = beaters[0];
      if (oppMin <= 2) pick = beaters[beaters.length - 1]; // go big when someone is about to win
      const usesTop = pick.cards.some((c) => Pusoy.rv(c) >= 13);
      if (usesTop && oppMin > 5 && hand.length > 4) return { type: 'pass' }; // save 2s
      return { type: 'play', cards: pick.cards.map((c) => c.id) };
    },

    hint(v, seat) {
      const hand = v.seats[seat].hand;
      let options = Pusoy.allCombos(hand);
      if (v.mustInclude) options = options.filter((o) => o.cards.some((c) => c.id === v.mustInclude));
      if (v.trick) options = options.filter((o) => Pusoy.beats(o.combo, v.trick.combo));
      return options.sort((a, b) => Pusoy._weight(a) - Pusoy._weight(b));
    },

    timeoutAction(v, seat) {
      if (v.trick) return { type: 'pass' };
      const opts = Pusoy.hint(v, seat).filter((o) => o.combo.size === 1);
      return { type: 'play', cards: [opts[0].cards[0].id] };
    },
  };

  // =====================================================================
  // SOLITAIRE (Klondike) — solo game
  // 7 tableau columns, 4 foundations (Ace to King by suit), stock and waste.
  // =====================================================================
  const isRed = (c) => c.s === 'H' || c.s === 'D';
  const Solitaire = {
    id: 'solitaire',
    minPlayers: 1, maxPlayers: 1,

    create(cfg, rng) {
      rng = rng || cryptoRng();
      const deck = shuffle(makeDeck(), rng);
      const tab = [];
      for (let i = 0; i < 7; i++) {
        tab.push([]);
        for (let k = 0; k <= i; k++) tab[i].push({ card: deck.pop(), up: k === i });
      }
      return {
        game: 'solitaire', seats: (cfg.players || [{ name: 'You' }]).slice(0, 1).map((p) => ({ name: p.name, bot: false })),
        turn: 0, phase: 'play', drawCount: cfg.drawCount === 3 ? 3 : 1,
        stock: deck, waste: [], found: [[], [], [], []], tab,
        moves: 0, score: 0, passes: 0, seq: 0, last: null, result: null,
        log: [{ t: 'deal', msg: `New deal. Draw ${cfg.drawCount === 3 ? 'three' : 'one'} at a time.` }],
      };
    },

    canStack(card, onto) { return isRed(card) !== isRed(onto) && card.r === onto.r - 1; },
    canFound(card, pile) { return pile.length ? pile[pile.length - 1].s === card.s && card.r === pile[pile.length - 1].r + 1 : card.r === 1; },

    // cards a move would lift, or null if that source isn't movable
    _source(st, from) {
      if (!from) return null;
      if (from.pile === 'waste') return st.waste.length ? [st.waste[st.waste.length - 1]] : null;
      if (from.pile === 'found') { const p = st.found[from.i]; return p && p.length ? [p[p.length - 1]] : null; }
      if (from.pile === 'tab') {
        const col = st.tab[from.i]; if (!col || from.idx == null || from.idx < 0 || from.idx >= col.length) return null;
        const run = col.slice(from.idx);
        if (!run.every((x) => x.up)) return null;
        for (let k = 1; k < run.length; k++) if (!Solitaire.canStack(run[k].card, run[k - 1].card)) return null;
        return run.map((x) => x.card);
      }
      return null;
    },

    legalMove(st, from, to) {
      const cards = Solitaire._source(st, from);
      if (!cards) return 'Pick a face-up card.';
      if (!to) return 'Pick where to move it.';
      if (to.pile === 'found') {
        if (cards.length !== 1) return 'Only one card at a time goes to a foundation.';
        if (from.pile === 'found' && from.i === to.i) return 'That card is already there.';
        const p = st.found[to.i]; if (!p) return 'Pick a foundation.';
        return Solitaire.canFound(cards[0], p) ? null : p.length ? `Foundations build up by suit: this pile needs ${rankLabel(p[p.length - 1].r + 1)}${SUIT_SYMBOL[p[p.length - 1].s]}.` : 'Start a foundation with an Ace.';
      }
      if (to.pile === 'tab') {
        if (from.pile === 'tab' && from.i === to.i) return 'That card is already in this column.';
        const col = st.tab[to.i]; if (!col) return 'Pick a column.';
        if (!col.length) return cards[0].r === 13 ? null : 'Only a King can go in an empty column.';
        const top = col[col.length - 1];
        return Solitaire.canStack(cards[0], top.card) ? null : `${cardName(cards[0])} can’t go on ${cardName(top.card)}. Build down in alternating colours.`;
      }
      return 'Pick a column or foundation.';
    },

    apply(st, seat, a) {
      if (st.phase === 'ended') return err('This game is over. Deal again to play.');
      if (seat !== 0) return err('Solitaire has one player.');
      if (a.type === 'draw') {
        if (!st.stock.length) {
          if (!st.waste.length) return err('No cards left to draw.');
          st.stock = st.waste.reverse(); st.waste = []; st.passes++;
          st.log.push({ t: 'recycle', msg: 'Turned the waste back over to the stock.' });
        } else {
          const n = Math.min(st.drawCount, st.stock.length);
          for (let k = 0; k < n; k++) st.waste.push(st.stock.pop());
        }
        st.moves++; st.seq++; st.last = { kind: 'draw' };
        return OK;
      }
      if (a.type === 'resign') {
        st.phase = 'ended';
        st.result = { winners: [], reason: 'stopping before every card reached the foundations', standings: [{ seat: 0, name: st.seats[0].name, score: st.score, foundation: st.found.reduce((n, p) => n + p.length, 0) }] };
        st.log.push({ t: 'end', msg: 'Game ended.' }); st.seq++;
        return OK;
      }
      if (a.type !== 'move') return err('Unknown action.');
      const why = Solitaire.legalMove(st, a.from, a.to);
      if (why) return err(why);
      const cards = Solitaire._source(st, a.from);
      // lift
      if (a.from.pile === 'waste') st.waste.pop();
      else if (a.from.pile === 'found') st.found[a.from.i].pop();
      else st.tab[a.from.i].splice(a.from.idx);
      // place
      if (a.to.pile === 'found') st.found[a.to.i].push(cards[0]);
      else st.tab[a.to.i].push(...cards.map((card) => ({ card, up: true })));
      // scoring (standard Klondike values)
      if (a.to.pile === 'found' && a.from.pile !== 'found') st.score += 10;
      if (a.from.pile === 'waste' && a.to.pile === 'tab') st.score += 5;
      if (a.from.pile === 'found' && a.to.pile === 'tab') st.score = Math.max(0, st.score - 15);
      let flipped = null;
      if (a.from.pile === 'tab') {
        const col = st.tab[a.from.i];
        if (col.length && !col[col.length - 1].up) { col[col.length - 1].up = true; st.score += 5; flipped = col[col.length - 1].card; }
      }
      st.moves++; st.seq++;
      st.last = { kind: 'move', to: a.to, cards: cards.map((c) => c.id), flipped: flipped && flipped.id };
      st.log.push({ t: 'move', msg: `${cards.length > 1 ? cards.length + ' cards from ' : ''}${cardName(cards[0])} to ${a.to.pile === 'found' ? 'a foundation' : 'column ' + (a.to.i + 1)}.` });
      if (st.found.every((p) => p.length === 13)) {
        st.phase = 'ended';
        st.result = { winners: [0], reason: 'moving every card to the foundations', standings: [{ seat: 0, name: st.seats[0].name, score: st.score, foundation: 52 }] };
        st.log.push({ t: 'end', msg: `Solved in ${st.moves} moves.` });
      }
      return OK;
    },

    view(st) {
      return {
        game: 'solitaire', you: 0, turn: 0, phase: st.phase, seq: st.seq, drawCount: st.drawCount,
        stockCount: st.stock.length, waste: clone(st.waste.slice(-3)), wasteCount: st.waste.length,
        found: clone(st.found), tab: st.tab.map((col) => col.map((x) => (x.up ? { up: true, card: clone(x.card) } : { up: false }))),
        moves: st.moves, score: st.score, passes: st.passes, last: st.last, log: st.log.slice(-40),
        seats: st.seats.map((s) => ({ name: s.name, bot: false })), result: st.result ? clone(st.result) : null,
      };
    },

    // All legal moves, best first (used for hints and tap-to-move)
    moves(st) {
      const out = [];
      const tryMove = (from, to, w) => { if (!Solitaire.legalMove(st, from, to)) out.push({ from, to, w }); };
      const sources = [];
      if (st.waste.length) sources.push({ pile: 'waste' });
      st.tab.forEach((col, i) => col.forEach((x, idx) => { if (x.up) sources.push({ pile: 'tab', i, idx }); }));
      for (const from of sources) {
        const cards = Solitaire._source(st, from); if (!cards) continue;
        const revealing = from.pile === 'tab' && from.idx > 0 && !st.tab[from.i][from.idx - 1].up;
        const clearsColumn = from.pile === 'tab' && from.idx === 0;
        for (let j = 0; j < 4; j++) tryMove(from, { pile: 'found', i: j }, 100 + (revealing ? 20 : 0));
        for (let j = 0; j < 7; j++) {
          const empty = !st.tab[j].length;
          if (empty && clearsColumn) continue; // pointless: King already heads a column
          tryMove(from, { pile: 'tab', i: j }, (revealing ? 60 : 0) + (from.pile === 'waste' ? 30 : 0) + (empty ? 5 : 10) - (from.pile === 'tab' && !revealing ? 25 : 0));
        }
      }
      st.found.forEach((p, i) => { if (p.length) for (let j = 0; j < 7; j++) tryMove({ pile: 'found', i }, { pile: 'tab', i: j }, -50); });
      return out.sort((a, b) => b.w - a.w);
    },
    bestTarget(st, from) {
      const cards = Solitaire._source(st, from); if (!cards) return null;
      const m = Solitaire.moves(st).filter((x) => x.from.pile === from.pile && x.from.i === from.i && x.from.idx === from.idx);
      return m.length ? m[0].to : null;
    },
    hint(st) {
      const m = Solitaire.moves(st).filter((x) => x.w > 0);
      if (m.length) return m[0];
      return st.stock.length || st.waste.length ? { draw: true } : null;
    },
    canAutoFinish(st) { return st.stock.length === 0 && st.waste.length === 0 && st.tab.every((col) => col.every((x) => x.up)); },
    nextFoundationMove(st) {
      const srcs = [];
      if (st.waste.length) srcs.push({ pile: 'waste' });
      st.tab.forEach((col, i) => { if (col.length) srcs.push({ pile: 'tab', i, idx: col.length - 1 }); });
      let best = null;
      for (const from of srcs) {
        const c = Solitaire._source(st, from)[0];
        for (let j = 0; j < 4; j++) if (!Solitaire.legalMove(st, from, { pile: 'found', i: j }) && (!best || c.r < best.r)) best = { r: c.r, from, to: { pile: 'found', i: j } };
      }
      return best && { from: best.from, to: best.to };
    },
  };

  // =====================================================================
  // BINGO (75-ball, 5x5 cards with a FREE centre) — multi-round pattern session
  // =====================================================================
  const BINGO_PATTERNS = {
    // each entry: list of cell sets; a card wins if ANY set is fully marked (cells are row*5+col)
    diagonal: { name: 'Diagonal', sets: [[0, 6, 12, 18, 24], [4, 8, 12, 16, 20]] },
    // four cells touching in a 2x2 box; FREE (index 12) never counts, so the four boxes around the centre are excluded
    box: { name: 'Box of four', sets: [0, 1, 2, 3].flatMap((r) => [0, 1, 2, 3].map((c) => [r * 5 + c, r * 5 + c + 1, (r + 1) * 5 + c, (r + 1) * 5 + c + 1])).filter((set) => !set.includes(12)) },
    straight: { name: 'Straight', sets: [0, 1, 2, 3, 4].flatMap((k) => [[0, 1, 2, 3, 4].map((c) => k * 5 + c), [0, 1, 2, 3, 4].map((r) => r * 5 + k)]) },
    corners: { name: 'Four corners', sets: [[0, 4, 20, 24]] },
    blackout: { name: 'Punuan', sets: [Array.from({ length: 25 }, (_, i) => i)] },
  };
  // every round before the last: any of these wins
  const BINGO_ANY = ['diagonal', 'box', 'straight', 'corners'];
  BINGO_PATTERNS.any = { name: 'Any pattern', sets: BINGO_ANY.flatMap((k) => BINGO_PATTERNS[k].sets), of: BINGO_ANY };
  const Bingo = {
    id: 'bingo', minPlayers: 2, maxPlayers: 6,
    PATTERNS: BINGO_PATTERNS,
    ANY: BINGO_ANY,
    MIN_ROUNDS: 1, MAX_ROUNDS: 10, DEFAULT_ROUNDS: 5,
    // n rounds: the last is always punuan, every round before it is "any pattern"
    plan(n) {
      n = Math.max(Bingo.MIN_ROUNDS, Math.min(Bingo.MAX_ROUNDS, Math.floor(+n) || Bingo.DEFAULT_ROUNDS));
      return Array.from({ length: n - 1 }, () => 'any').concat('blackout');
    },
    get ROUNDS() { return Bingo.plan(Bingo.DEFAULT_ROUNDS); },
    POINTS: { any: 10, diagonal: 10, box: 10, straight: 10, corners: 10, blackout: 30 },
    // which named pattern a card actually made (for "Bea wins with a diagonal")
    madeWith(card, drawn, patternId) {
      const ids = BINGO_PATTERNS[patternId].of || [patternId];
      return ids.find((k) => Bingo.completed(card, drawn, k)) || patternId;
    },
    letter: (n) => 'BINGO'[Math.floor((n - 1) / 15)],

    validCard(c) {
      if (!Array.isArray(c) || c.length !== 25 || c[12] !== 0) return false;
      const seen = new Set();
      for (let i = 0; i < 25; i++) {
        if (i === 12) continue;
        const n = c[i], col = i % 5;
        if (!Number.isInteger(n) || n < col * 15 + 1 || n > col * 15 + 15 || seen.has(n)) return false;
        seen.add(n);
      }
      return true;
    },
    validCards(cs) { return Array.isArray(cs) && cs.length >= 1 && cs.length <= 3 && cs.every((c) => Bingo.validCard(c)); },
    makeCard(rng) {
      rng = rng || cryptoRng();
      const cols = [0, 1, 2, 3, 4].map((c) => shuffle(Array.from({ length: 15 }, (_, k) => c * 15 + k + 1), rng).slice(0, 5));
      const cells = [];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) cells.push(r === 2 && c === 2 ? 0 : cols[c][r]);
      return cells; // 0 = FREE
    },

    create(cfg, rng) {
      rng = rng || cryptoRng();
      const each = Math.max(1, Math.min(3, cfg.cardsEach || 2));
      const st = {
        game: 'bingo', rounds: Array.isArray(cfg.rounds) ? cfg.rounds.slice() : Bingo.plan(cfg.roundCount || cfg.rounds), roundIdx: 0,
        seats: cfg.players.map((p) => {
          // players may bring cards they chose (or saved); anything missing or invalid is dealt fresh
          const own = Bingo.validCards(p.cards) ? p.cards.slice(0, each).map((c) => c.slice()) : [];
          while (own.length < each) own.push(Bingo.makeCard(rng));
          return { name: p.name, bot: !!p.bot, cards: own, points: 0, wins: 0 };
        }),
        balls: [], drawn: [], phase: 'calling', claims: [], results: [], log: [], seq: 0, result: null, last: null, turn: -1,
      };
      Object.defineProperty(st, '_rngFn', { value: rng, enumerable: false, writable: true });
      Bingo._startRound(st, rng);
      return st;
    },
    _startRound(st, rng) {
      st.balls = shuffle(Array.from({ length: 75 }, (_, i) => i + 1), rng || st._rngFn || cryptoRng());
      st.drawn = []; st.claims = []; st.phase = 'calling';
      const p = st.rounds[st.roundIdx];
      st.log.push({ t: 'round', msg: `Round ${st.roundIdx + 1}: ${BINGO_PATTERNS[p].name}.` });
      st.seq++;
    },
    pattern(st) { return st.rounds[st.roundIdx]; },
    // which winning set (if any) a card has completed with the balls drawn so far
    completed(card, drawn, patternId) {
      const marked = new Set(drawn);
      return BINGO_PATTERNS[patternId].sets.find((set) => set.every((i) => card[i] === 0 || marked.has(card[i]))) || null;
    },
    // fewest cells still missing for any winning set (for "1 to go" hints)
    toGo(card, drawn, patternId) {
      const marked = new Set(drawn);
      return Math.min(...BINGO_PATTERNS[patternId].sets.map((set) => set.filter((i) => !(card[i] === 0 || marked.has(card[i]))).length));
    },

    // host step: draw the next ball, close a round after a claim, or start the next round
    advance(st, rng) {
      if (st.phase === 'calling') {
        if (!st.balls.length) return Bingo._closeRound(st);
        const b = st.balls.pop(); st.drawn.push(b);
        st.last = { kind: 'ball', ball: b }; st.seq++;
        return OK;
      }
      if (st.phase === 'claimed') return Bingo._closeRound(st);
      if (st.phase === 'between') { st.roundIdx++; Bingo._startRound(st, rng); return OK; }
      return OK;
    },

    apply(st, seat, a) {
      if (a.type !== 'claim') return err('Unknown action.');
      if (st.phase !== 'calling' && st.phase !== 'claimed') return err('Wait for the next round to start.');
      const me = st.seats[seat]; if (!me) return err('Unknown player.');
      const ci = a.card == null ? me.cards.findIndex((c) => Bingo.completed(c, st.drawn, Bingo.pattern(st))) : a.card;
      const card = me.cards[ci];
      if (!card || !Bingo.completed(card, st.drawn, Bingo.pattern(st))) return err(Bingo.pattern(st) === 'any' ? 'Not a bingo yet. You need a diagonal, box of four, straight or four corners with numbers that have been called.' : `Not a bingo yet. You need ${BINGO_PATTERNS[Bingo.pattern(st)].name.toLowerCase()} with numbers that have been called.`);
      if (st.claims.some((c) => c.seat === seat)) return OK;
      const made = Bingo.madeWith(card, st.drawn, Bingo.pattern(st));
      st.claims.push({ seat, card: ci, balls: st.drawn.length, made });
      st.log.push({ t: 'claim', seat, msg: `${me.name} calls BINGO! (${BINGO_PATTERNS[made].name.toLowerCase()})` });
      st.phase = 'claimed'; st.last = { kind: 'claim', seat }; st.seq++;
      return { ok: true, card: ci };
    },

    _closeRound(st) {
      const p = Bingo.pattern(st);
      const winners = [...new Set(st.claims.map((c) => c.seat))];
      const pts = Bingo.POINTS[p] || 10;
      const made = {}; st.claims.forEach((c) => { if (made[c.seat] == null) made[c.seat] = c.made || p; });
      const share = winners.length ? Math.round(pts / winners.length) : 0;
      winners.forEach((s) => { st.seats[s].points += share; st.seats[s].wins++; });
      st.results.push({ n: st.roundIdx + 1, pattern: p, winners, made, share, balls: st.drawn.length, lastBall: st.drawn[st.drawn.length - 1], claims: st.claims.slice() });
      st.log.push({ t: 'roundEnd', msg: `Round ${st.roundIdx + 1} (${BINGO_PATTERNS[p].name}): ${winners.length ? winners.map((s) => st.seats[s].name + (p === 'any' ? ` with ${BINGO_PATTERNS[made[s]].name.toLowerCase()}` : '')).join(' & ') + ` win${winners.length === 1 ? 's' : ''} ${share} pts` : 'no winner'}.` });
      st.seq++;
      if (st.roundIdx >= st.rounds.length - 1) return Bingo._end(st);
      st.phase = 'between';
      return OK;
    },

    _end(st) {
      st.phase = 'ended';
      const last = st.results[st.results.length - 1];
      const rows = st.seats.map((s, i) => ({ seat: i, name: s.name, score: s.points, wins: s.wins, punuan: last && last.winners.includes(i) ? 1 : 0 }));
      // ranking: points, then won the punuan round, then round wins
      rows.sort((a, b) => b.score - a.score || b.punuan - a.punuan || b.wins - a.wins);
      const top = rows[0];
      const winners = rows.filter((r) => r.score === top.score && r.punuan === top.punuan && r.wins === top.wins).map((r) => r.seat);
      st.result = { winners, reason: 'most bingo points after the punuan round', standings: rows, rounds: st.results };
      st.log.push({ t: 'end', msg: `Bingo night over. ${winners.map((i) => st.seats[i].name).join(' & ')} wins.` });
      st.seq++;
      return OK;
    },

    view(st, seat) {
      return {
        game: 'bingo', you: seat, phase: st.phase, seq: st.seq, roundIdx: st.roundIdx, rounds: st.rounds.slice(), pattern: Bingo.pattern(st),
        drawn: st.drawn.slice(), ballsLeft: st.balls.length, claims: clone(st.claims), results: clone(st.results), last: st.last, log: st.log.slice(-40), turn: -1,

      };
    },

    bot(v, seat) {
      const cards = v.seats[seat].cards;
      const ci = cards.findIndex((c) => Bingo.completed(c, v.drawn, v.pattern));

    },
    timeoutAction() { return null; },
  };

  // =====================================================================
  // Local authority: the single place that holds full state.
  // Clients (human UI and bots) only ever receive view(state, seat).
  // In production this class is replaced by a server function with the same contract.
  // =====================================================================
  const ENGINES = { inbetween: InBetween, tongits: Tongits, pusoydos: Pusoy, solitaire: Solitaire, bingo: Bingo };

  class LocalAuthority {
    constructor(gameId, cfg, rng) {
      this.engine = ENGINES[gameId];
      this.rng = rng || cryptoRng();
      this.state = this.engine.create(cfg, this.rng);
      this.listeners = [];
    }
    view(seat) { return this.engine.view(this.state, seat); }
    submit(seat, action) {
      const res = this.engine.apply(this.state, seat, action, this.rng);
      if (res.ok) this.listeners.forEach((f) => f(action, seat, res));
      return res;
    }
    advance() { if (this.engine.advance) this.engine.advance(this.state, this.rng); this.listeners.forEach((f) => f({ type: 'advance' }, -1)); }

  }

  // ---------------------------------------------------------------------
  // Settle up: the fewest transfers that square everyone's points.
  // nets[i] > 0 means player i is up, < 0 means down. `pot` (optional) is the change in the pot:
  // > 0 when points went into the pot, < 0 when the pot paid out points it held from before.
  // Returns [{ from, to, amount }] where from/to are seat numbers or 'pot'. Virtual points only.
  // ---------------------------------------------------------------------
  function settle(nets, pot = 0) {
    const debt = [], cred = [];
    nets.forEach((n, i) => { if (n < 0) debt.push({ who: i, left: -n }); else if (n > 0) cred.push({ who: i, left: n }); });
    if (pot > 0) cred.push({ who: 'pot', left: pot }); else if (pot < 0) debt.push({ who: 'pot', left: -pot });

    const order = (a, b) => (a.who === 'pot') - (b.who === 'pot') || b.left - a.left || String(a.who).localeCompare(String(b.who));
    debt.sort(order); cred.sort(order);

      for (const c of cred) {

        if (!c.left || (d.who === 'pot' && c.who === 'pot')) continue;
        const amt = Math.min(d.left, c.left);
        out.push({ from: d.who, to: c.who, amount: amt });
        d.left -= amt; c.left -= amt;
      }
    }
    return out;
  }

  else root.CV = api;
})(typeof window !== 'undefined' ? window : globalThis);

      const f = s.querySelector('form[data-form=guest]');
      if (f) f.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = f.name.value.trim(), city = f.city.value.trim().replace(/\s+/g, ' '), country = f.country.value.trim().replace(/\s+/g, ' ');

        const ccode = App.countryCode(country);
        if (!ccode) { s.querySelector('#locerr').textContent = 'Pick your country from the list so your flag shows.'; return; }
        const countryName = App.countryName(ccode);
        App.data.user = { name, avatar: pick, photo, city: city.slice(0, 40), country: countryName, created: (App.data.user && App.data.user.created) || Date.now(), guest: true };
        if (!App.data.pid) App.data.pid = (crypto.randomUUID ? crypto.randomUUID() : 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2));

  });

  };

  App.settleText = (players, t, me) => t.map((x) => x.to === 'pot' ? `${App.settleName(players, x.from, me)} put ${x.amount} into the pot`

    : `${App.settleName(players, x.from, me)} owes ${App.settleName(players, x.to, me)} ${x.amount}`);
  App.settleHTML = (players, t, me, opts = {}) => {
    if (!t.length) return `<p class="small muted">${opts.empty || 'Everyone finished even. Nobody owes anything.'}</p>`;
    const who = (i, side, verb = '') => i === 'pot' ? `<span class="settle-who ${side}" data-verb="${verb}"><span class="pot-dot">${App.icon('coins')}</span><span>The pot</span></span>`
      : `<span class="settle-who ${side}" data-verb="${verb}">${App.avatar(players[i].name, players[i].av, 'sm', players[i].photo)}<span>${esc(players[i].name)}${i === me ? ' (you)' : ''}</span></span>`;
    return `<ul class="settle ${opts.compact ? 'compact' : ''}">${t.map((x) => `<li class="${x.from === me ? 'mine-out' : x.to === me ? 'mine-in' : ''}">
      ${who(x.from, 'from')}<span class="settle-arrow"><span>${x.to === 'pot' ? 'puts in' : x.from === 'pot' ? 'pays out' : 'owes'}</span>${App.icon('arrow')}</span>${who(x.to, 'to', x.to === 'pot' ? 'puts in →' : x.from === 'pot' ? 'pays out →' : 'owes →')}
      <b class="settle-amt">${x.amount.toLocaleString()} <span class="tiny muted">pts</span></b></li>`).join('')}</ul>`;
  };
  App.sessionSummaryText = (x) => {
    const lines = [`DeckFlix In Between session, ${new Date(x.at).toLocaleString()}`, `Grand Champion: ${x.champNames}`, `Rounds completed: ${x.session.totalRounds} (target ${x.session.target} with a winner)`, `Starting points: ${x.config.sStart} each (virtual, no cash value)`, '', 'Final rankings:'];
    x.rows.forEach((r) => lines.push(`${r.place}. ${r.name}: ${r.wins} wins, ${r.losses} losses, ${r.final} points (${r.net >= 0 ? '+' : ''}${r.net})${r.eliminated ? `, eliminated round ${r.elimRound}` : ''}`));
    const seatOrder = x.players.map((_, i) => (x.rows.find((r) => r.seat === i) || { net: 0 }).net);
    lines.push('', 'Settle up (virtual points, no cash value):');
    const tot = CV.settle(seatOrder);
    (tot.length ? App.settleText(x.players, tot, -1) : ['Everyone finished even.']).forEach((l) => lines.push('- ' + l));
    lines.push('', 'Rounds:');
    x.session.rounds.forEach((r) => {
      lines.push(`R${r.n}: ${r.winner != null ? x.players[r.winner].name : 'no winner'}, ${r.how}`);
      App.settleText(x.players, CV.settle(r.deltas, -r.deltas.reduce((a, b) => a + b, 0) || 0), -1).forEach((l) => lines.push('   ' + l));

  App.pages['session-results'] = () => {

        <div class="stat"><div class="v">${x.config.sStart.toLocaleString()}</div><div class="l">Starting points each</div></div>
        <div class="stat"><div class="v">${x.rows.filter((r) => r.eliminated).length}</div><div class="l">Players eliminated</div></div>
      </div>
      <div class="row" style="margin-top:20px">
        ${x.guest ? `<button class="btn btn-ghost" disabled>The host can start another session</button>${App.Online.role === 'guest' ? '<button class="btn btn-ghost" data-act="backroom">Back to the room</button>' : ''}` : `<button class="btn btn-accent" data-act="sessionagain">${App.icon('play')}Play again with the same group</button>`}

        <button class="btn btn-ghost" data-act="copysession">Copy results</button>
        ${x.guest ? '' : '<button class="btn btn-quiet" data-act="gosessionsetup">Change rules</button>'}

      <section class="glass panel section" style="overflow-x:auto">

        ${x.rows.map((r) => `<tr style="${x.champs.includes(r.seat) ? 'background:rgba(255,138,50,.08)' : ''}"><td><b style="font-family:var(--f-head)">${r.place}</b></td><td><span class="row" style="flex-wrap:nowrap">${App.avatar(r.name, P[r.seat].av, 'sm', P[r.seat].photo)}<span>${nm(r.seat)}${P[r.seat].bot ? ' <span class="tag bot" style="font-size:11px;padding:1px 6px;border-radius:5px">Bot</span>' : ''}</span></span></td>
          <td class="num">${r.wins}</td><td class="num">${r.losses}</td><td class="num">${r.start.toLocaleString()}</td><td class="num"><b>${r.final.toLocaleString()}</b></td><td class="num ${r.net >= 0 ? 'res-w' : 'res-l'}">${r.net >= 0 ? '+' : ''}${r.net}</td>

        </tbody></table>
        ${S.leftoverPot ? `<p class="tiny muted" style="margin-top:10px">${S.leftoverPot} points left in the pot were shared among players still in (${S.potShare} each) and are included in final points.</p>` : ''}
      </section>
      <section class="glass panel section">
        <div class="section-head"><h2>Settle up</h2><span class="tiny muted">Virtual points, no cash value</span></div>
        <p class="small muted" style="margin:-4px 0 12px">Who owes whom for the whole session, using the fewest transfers that square everyone’s net points.</p>

  // ------------------------------------------------------------------ rules text
  App.RULES = {
    inbetween: `<h3>Goal</h3><p>Finish with the most chips. Chips are game points with no cash value.</p>
